name: Bug report
description: Something renders wrong, crashes or differs between targets
labels: [bug]
body:
  - type: dropdown
    id: target
    attributes:
      label: Where
      options: [Viewer, Micro-Manager adapter, CLI, webSMLM block, Docs, Build/CI]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version (release tag or commit)
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Seed, options (CLI line or MM property values), position, browser/OS/GPU.
