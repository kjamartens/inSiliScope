name: Release

# Push a tag `vX.Y.Z` (or run by hand with a version) to: run the CI tests, build the Micro-Manager
# DLL and the webSMLM block, render the gallery and the benchmarks, publish a GitHub Release with
# all of it, and redeploy the Pages site (viewer + docs + gallery + benchmarks).
# A hotfix (a tag with -hotfix in it, e.g. v0.1.0-rc14-hotfix1, or `hotfix` ticked when run by hand): the same tests,
# DLL, block and site, but no gallery, 3D overview or benchmarks: the release carries the previous release's
# gallery.zip and benchmarks.json over, so the site keeps them.
# Nothing is committed to the repository and no PR is opened; bringing the block into
# kjamartens/webSMLM is a separate change made there (tools/sync_cellfield.mjs).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version/tag to create (e.g. v0.1.0); the tag is created on the selected branch head'
        type: string
        required: true
      psfgenerator_url:
        description: 'Download URL of PSFGenerator.jar (empty = the EPFL site)'
        type: string
        default: ''
      hotfix:
        description: 'Hotfix: skip the gallery, 3D overview and benchmarks (carried over from the previous release)'
        type: boolean
        default: false

env:
  EMSDK_VERSION: 6.0.10   # same pin as ci.yml: the block's bytes depend on it
  NODE_VERSION: 24
  VERSION: ${{ inputs.version || github.ref_name }}
  HOTFIX: ${{ (inputs.hotfix || contains(inputs.version || github.ref_name, '-hotfix')) && 'true' || 'false' }}

jobs:
  # The tag must be v<VERSION> or v<VERSION>-rcN (the VERSION file; core/include/insiliscope/version.h repeats it, CMake checks that).
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag = v<VERSION>
        run: |
          want="v$(tr -d '[:space:]' < VERSION)"
          # a release candidate v<VERSION>-rcN is the coming VERSION
          if [ "${VERSION%-rc*}" != "$want" ]; then echo "::error::release $VERSION, but the VERSION file says $want"; exit 1; fi
          grep -q "#define ISC_VERSION \"${want#v}\"" core/include/insiliscope/version.h \
            || { echo "::error::core/include/insiliscope/version.h is not ${want#v}"; exit 1; }
          grep -q "^version: ${want#v}$" CITATION.cff || { echo "::error::CITATION.cff is not version ${want#v}"; exit 1; }

  tests:
    needs: version
    uses: ./.github/workflows/ci.yml

  dll:
    needs: tests
    uses: ./.github/workflows/build-dll.yml
    with:
      version: ${{ inputs.version || github.ref_name }}
      psfgenerator_url: ${{ inputs.psfgenerator_url || '' }}

  block:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
      - run: sudo apt-get install -y ninja-build
      - name: Configure + build (Emscripten)
        run: |
          cmake --preset wasm
          cmake --build --preset wasm
      - name: Make + check the block
        run: |
          node tools/make_cellfield_block.mjs
          node tools/make_cellfield_block.mjs --check dist/cellfield_block.js
          node tests/block/check_cellfield_block.mjs dist/cellfield_block.js
          (cd dist && sha256sum cellfield_block.js | tee cellfield_block.js.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: cellfield_block
          path: dist/

  gallery:
    needs: tests
    if: ${{ !(inputs.hotfix || contains(inputs.version || github.ref_name, '-hotfix')) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y ninja-build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pillow tifffile
      - name: Build the CLI (native Release)
        run: |
          cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native --target insiliscope_cli
      # The 3D overview: the viewer (the committed web/insiliscope_module.js) in headless Chromium (tools/build_hero.mjs),
      # before the gallery, which puts it above the 2x2 overview.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: 3D overview
        run: |
          (cd web/tools && npm ci && npx playwright install --with-deps chromium)
          node tools/build_hero.mjs --out site_gallery
      - name: Gallery
        run: python tools/build_gallery.py --cli build/native/cli/insiliscope_cli --out site_gallery
      - name: Benchmarks (history from the previous release, if any)
        run: |
          tag=$(gh release list --limit 1 --json tagName -q '.[0].tagName')   # newest, incl. pre-releases
          if [ -n "$tag" ]; then gh release download "$tag" --pattern benchmarks.json --dir . || true; else echo "no previous benchmarks"; fi
          python tools/bench.py --cli build/native/cli/insiliscope_cli --version "$VERSION" --out benchmarks.json
      - run: cd site_gallery && rm -f *.tif && zip -q ../gallery.zip *
      - uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: |
            gallery.zip
            benchmarks.json

  # Micro-Manager live speed with a phase breakdown (tools/bench_live.py --profile): the DLL just built, loaded by
  # MMCore through pymmcore (its device interface must match third_party/mmCoreAndDevices: 75), on a Windows runner;
  # added to the cli benchmarks' entry of this version (benchmarks.json, the site's Benchmarks page).
  mm-bench:
    needs: [dll, gallery]
    if: ${{ !(inputs.hotfix || contains(inputs.version || github.ref_name, '-hotfix')) }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install "pymmcore==12.5.0.75.0" "pymmcore-plus==0.18.1"
      - uses: actions/download-artifact@v4
        with:
          name: mmgr_dal_inSiliScope-windows-x64
          path: dll
      - uses: actions/download-artifact@v4
        with:
          name: gallery
          path: gallery
      - name: Live benchmark (Basic configuration, 256 px)
        shell: bash
        env:
          ADAPTER_DIR: dll
        run: |
          cp gallery/benchmarks.json benchmarks.json
          python tools/bench_live.py --profile --history benchmarks.json --version "$VERSION" --json bench_live.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            benchmarks.json
            bench_live.json

  release:
    needs: [dll, block, gallery, mm-bench]
    # a hotfix runs without the gallery and benchmark jobs (skipped); anything else needs all four
    if: ${{ !cancelled() && needs.dll.result == 'success' && needs.block.result == 'success' && (needs.mm-bench.result == 'success' || ((inputs.hotfix || contains(inputs.version || github.ref_name, '-hotfix')) && needs.gallery.result == 'skipped' && needs.mm-bench.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: "Hotfix: the previous release's gallery and benchmarks"
        if: env.HOTFIX == 'true'
        run: |
          prev=$(gh release list --limit 1 --exclude-drafts --json tagName -q '.[0].tagName')   # newest, incl. pre-releases
          if [ -z "$prev" ]; then echo "::error::a hotfix needs a previous release to take the gallery from"; exit 1; fi
          mkdir -p assets/gallery assets/benchmarks
          gh release download "$prev" --pattern gallery.zip --dir assets/gallery
          gh release download "$prev" --pattern benchmarks.json --dir assets/benchmarks
          echo "$prev" > prev_tag
      - name: Publish
        run: |
          {
            echo "inSiliScope ${VERSION}, built from ${GITHUB_SHA}."
            echo
            di=$(tr -dc '0-9' < assets/mmgr_dal_inSiliScope-windows-x64/device_interface.txt)
            echo "- \`mmgr_dal_inSiliScope.dll\`: Micro-Manager device adapter (Windows x64, GPL-3.0). Needs a [Micro-Manager 2.0 nightly build](https://micro-manager.org/Micro-Manager_Nightly_Builds) with device interface ${di} (from 21 February 2026 on); older builds refuse it. Copy it into the Micro-Manager folder; getting started: https://kjamartens.github.io/inSiliScope/docs/micro-manager/"
            echo "- \`inSiliScope_Basic.cfg\`, \`inSiliScope_Advanced.cfg\`, \`inSiliScope_Expert.cfg\`: Micro-Manager hardware configurations (the devices, Channel/Objective/Camera/Quality/Drift groups, pixel sizes) at each level of detail."
            echo "- \`cellfield_block.js\`: drop-in CellField block for webSMLM (\`node tools/sync_cellfield.mjs <file>\` in that repo)."
            echo "- \`LICENSE\`, \`LICENSE-GPL-3.0.txt\`, \`THIRD_PARTY_NOTICES.md\`: the licences of the DLL and of what it includes."
            echo "- \`gallery.zip\`, \`benchmarks.json\`: rendered examples and timings: the cli, and Micro-Manager live speed with where each frame's time goes (also on the project site)."
            if [ -f prev_tag ]; then echo "  This is a hotfix: both are carried over from $(cat prev_tag), not rendered again."; fi
            echo
            echo '```'
            cat assets/mmgr_dal_inSiliScope-windows-x64/BUILD_INFO.txt
            echo '```'
          } > notes.md
          pre=""; case "$VERSION" in *-*) pre="--prerelease";; esac   # v0.1.0-rc1 etc.
          gh release create "$VERSION" $pre \
            assets/mmgr_dal_inSiliScope-windows-x64/mmgr_dal_inSiliScope.dll \
            assets/mmgr_dal_inSiliScope-windows-x64/mmgr_dal_inSiliScope.dll.sha256 \
            assets/mmgr_dal_inSiliScope-windows-x64/BUILD_INFO.txt \
            assets/mmgr_dal_inSiliScope-windows-x64/inSiliScope_Basic.cfg \
            assets/mmgr_dal_inSiliScope-windows-x64/inSiliScope_Advanced.cfg \
            assets/mmgr_dal_inSiliScope-windows-x64/inSiliScope_Expert.cfg \
            assets/mmgr_dal_inSiliScope-windows-x64/LICENSE \
            assets/mmgr_dal_inSiliScope-windows-x64/LICENSE-GPL-3.0.txt \
            assets/mmgr_dal_inSiliScope-windows-x64/THIRD_PARTY_NOTICES.md \
            assets/cellfield_block/cellfield_block.js \
            assets/cellfield_block/cellfield_block.js.sha256 \
            assets/gallery/gallery.zip assets/benchmarks/benchmarks.json \
            --target "$GITHUB_SHA" --title "inSiliScope $VERSION" --notes-file notes.md

  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
