name: CI

# Light, fast checks on every push to main and every PR. Heavy jobs (adapter DLL, GPU, gallery,
# benchmarks) live in release.yml / build-dll.yml and run on tags. release.yml also calls this
# workflow, so a tag cannot be published with failing tests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

env:
  # Pinned toolchain versions. Change deliberately: a different Emscripten can
  # change the WASM blob that ships to webSMLM (not the numbers -- the golden
  # test guards those).
  EMSDK_VERSION: 6.0.10
  NODE_VERSION: 24

jobs:
  # The generated data are current (the generators' --check).
  data-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # data/dyes -> the generated dye library and docs/references.md are current.
      - run: node tools/gen_dye_library.mjs --check
      # data/origami/designs.json -> the core and viewer design tables are current.
      - run: node tools/gen_origami_designs.mjs --check
      # data/fiducials: the curves give balinovic2019's quoted efficiencies; fitted tails, emitters and the gold Mie table current.
      - run: node tools/fiducial_spectra/check.mjs

  # The viewer's DOM-free modules in Node: scene core (camera, clip tables, detail budget, layer registry), data-layer
  # computations (thresholded surface, localizations), animation
  # sequences, export encoders (GIF decoded back, MP4/WebM structure), the BrightField worker split on the viewer's own
  # worker code (iscEngine, the committed module). The browser checks (tests/web/viewer_*) stay local.
  viewer-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node tests/web/scene_core_check.mjs && node tests/web/scene_compute_check.mjs && node tests/web/anim_unit.mjs && node tests/web/encode_unit.mjs && node tests/web/mm_config_check.mjs && node tests/web/analytics_unit.mjs && node tests/web/settings_unit.mjs && node tests/web/bf_split_check.mjs

  core-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Not the msvc preset: it pins "Visual Studio 17 2022", and the runner
      # image moves on; let CMake pick the installed Visual Studio.
      - name: Configure + build (MSVC)
        run: |
          cmake -S . -B build/msvc -A x64
          cmake --build build/msvc --config Release
      - name: Golden vectors + world checks + cli (native)
        run: ctest --test-dir build/msvc -C Release -j 8 --output-on-failure

  core-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
      - run: sudo apt-get install -y ninja-build
      - name: Configure + build (Emscripten)
        run: |
          cmake --preset wasm
          cmake --build --preset wasm
      - name: Golden vectors + world checks (WASM under Node)
        run: ctest --test-dir build/wasm -j 8 --output-on-failure
      - name: Viewer module up to date (web/insiliscope_module.js)
        run: node tools/embed_web_module.mjs --check
      - name: WASM size
        run: |
          ls -l build/wasm/core/insiliscope.wasm
          gzip -9 -c build/wasm/core/insiliscope.wasm | wc -c
      - uses: actions/upload-artifact@v4
        with:
          name: insiliscope-wasm
          path: |
            build/wasm/core/insiliscope.wasm
            build/wasm/core/insiliscope.js

  core-native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: sudo apt-get install -y ninja-build
      - name: Configure + build + ctest (Release)
        run: |
          cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native
          ctest --test-dir build/native -j 8 --output-on-failure
