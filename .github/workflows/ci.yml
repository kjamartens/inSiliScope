name: CI

# Light, fast checks on every push to main and every PR. Heavy jobs (adapter DLL, GPU, gallery,
# benchmarks) live in release.yml / build-dll.yml and run on tags. release.yml also calls this
# workflow, so a tag cannot be published with failing tests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

env:
  # Pinned toolchain versions. Change deliberately: a different Emscripten can
  # change the WASM blob that ships to webSMLM (not the numbers -- the golden
  # test guards those).
  EMSDK_VERSION: 6.0.10
  NODE_VERSION: 24

jobs:
  # Iteration mode (web/lab/README.md): while PORT_PENDING.md exists, the JS prototype is ahead of the C++
  # core. This gate fails (blocking the merge and any release) and the C++/WASM/golden jobs below are
  # skipped instead of failing one by one; the port removes the file.
  port-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No pending C++ port
        run: |
          if [ -f PORT_PENDING.md ]; then
            echo "::error file=PORT_PENDING.md::The prototype is ahead of the C++ core; port it before merging (web/lab/README.md)."
            cat PORT_PENDING.md
            exit 1
          fi

  # The lab's headless check: prototype loads, no NaN geometry, address determinism. Runs in iteration mode too.
  lab-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node web/lab/check.mjs

  # JS imaging reference (web/prototype/scope) == the C++ (the committed WASM module): events, SR, WideField.
  scope-parity:
    needs: port-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node tests/parity/scope_parity.mjs

  core-native:
    needs: port-gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Not the msvc preset: it pins "Visual Studio 17 2022", and the runner
      # image moves on; let CMake pick the installed Visual Studio.
      - name: Configure + build (MSVC)
        run: |
          cmake -S . -B build/msvc -A x64
          cmake --build build/msvc --config Release
      - name: Golden vectors + world checks + cli (native)
        run: ctest --test-dir build/msvc -C Release --output-on-failure

  core-wasm:
    needs: port-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
      - run: sudo apt-get install -y ninja-build
      - name: Configure + build (Emscripten)
        run: |
          cmake --preset wasm
          cmake --build --preset wasm
      - name: Golden vectors (WASM under Node)
        run: ctest --test-dir build/wasm --output-on-failure
      - name: Viewer module up to date (web/insiliscope_module.js)
        run: node tools/embed_web_module.mjs --check
      - name: webSMLM block (dist/cellfield_block.js; published by the "webSMLM block" workflow)
        run: |
          node tools/make_cellfield_block.mjs
          node tests/block/check_cellfield_block.mjs
      - name: WASM size
        run: |
          ls -l build/wasm/core/insiliscope.wasm
          gzip -9 -c build/wasm/core/insiliscope.wasm | wc -c
      - uses: actions/upload-artifact@v4
        with:
          name: insiliscope-wasm
          path: |
            build/wasm/core/insiliscope.wasm
            build/wasm/core/insiliscope.js

  # The frozen golden vectors must match what the prototype in web/ produces:
  # a generator change in web/prototype/ needs a re-freeze in the port commit.
  golden-fresh:
    needs: port-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Re-freeze from web/prototype/index.html and diff
        run: |
          node tests/parity/golden.mjs --freeze
          git diff --exit-code --stat spec/golden

  core-native-linux:
    needs: port-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: sudo apt-get install -y ninja-build
      - name: Configure + build + ctest (Release)
        run: |
          cmake -S . -B build/native -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native
          ctest --test-dir build/native --output-on-failure
