name: Build adapter DLL

# Builds mmgr_dal_inSiliScope.dll (Windows x64), with the PSFGenerator jar embedded when it can be downloaded.
# Called by release.yml; can also be run by hand (Actions -> Build adapter DLL). The DLL is only
# ever uploaded as an artifact / release asset, never committed.
on:
  workflow_call:
    inputs:
      psfgenerator_url:
        description: 'Download URL of PSFGenerator.jar (empty = the EPFL site)'
        type: string
        default: ''
      version:
        description: 'Version string recorded in BUILD_INFO.txt'
        type: string
        default: 'dev'
  workflow_dispatch:
    inputs:
      psfgenerator_url:
        description: 'Download URL of PSFGenerator.jar (the "Java application for standalone/Matlab" build); empty = try the EPFL site'
        type: string
        default: ''

jobs:
  adapter:
    runs-on: windows-latest
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # SMLMPsfEmbedded.jar = PSFGenerator.jar (GPL-3.0, EPFL BIG; never committed) + this project's
      # bridge classes, built as CLAUDE.md describes. If PSFGenerator cannot be downloaded, an empty
      # placeholder is embedded: the DLL then works (the default GibsonLanniZernike PSF is C++), but RichardsWolf/GibsonLanni are unavailable.
      - name: Embedded PSF jar
        shell: pwsh
        run: |
          $urls = @('${{ inputs.psfgenerator_url }}',
                    'https://bigwww.epfl.ch/algorithms/psfgenerator/PSFGenerator.jar',
                    'http://bigwww.epfl.ch/algorithms/psfgenerator/PSFGenerator.jar') | Where-Object { $_ }
          $ok = $false
          foreach ($u in $urls) {
            try {
              Invoke-WebRequest -Uri $u -OutFile third_party/PSFGenerator.jar -UseBasicParsing
              if ((Get-Item third_party/PSFGenerator.jar).Length -gt 100000) { $ok = $true; Write-Host "PSFGenerator.jar from $u"; break }
            } catch { Write-Host "download failed: $u ($_)" }
          }
          if ($ok) {
            Push-Location adapter/inSiliScope/Simulation/psfbridge-java
            javac --release 8 -cp ../../../../third_party/PSFGenerator.jar -d out psfbridge/PsfBridge.java psfbridge/GibsonLanniZernikePSF.java
            Pop-Location
            Copy-Item third_party/PSFGenerator.jar third_party/SMLMPsfEmbedded.jar
            Push-Location adapter/inSiliScope/Simulation/psfbridge-java/out
            jar uf ../../../../../third_party/SMLMPsfEmbedded.jar psfbridge/PsfBridge.class psfbridge/GibsonLanniZernikePSF.class 'psfbridge/GibsonLanniZernikePSF$PlaneJob.class'
            Pop-Location
            "PSFGenerator: embedded (RichardsWolf/GibsonLanni available; GibsonLanniZernike is C++)" | Out-File -Encoding utf8 psf_status.txt
          } else {
            New-Item -ItemType File -Force third_party/SMLMPsfEmbedded.jar | Out-Null
            "PSFGenerator: NOT embedded (PSFGenerator.jar unavailable in CI); RichardsWolf/GibsonLanni unavailable, GibsonLanniZernike (C++) unaffected" | Out-File -Encoding utf8 psf_status.txt
          }
          Get-Content psf_status.txt
      - name: MSBuild Release|x64
        run: msbuild adapter/inSiliScope/inSiliScope.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal
      - name: Collect DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter mmgr_dal_inSiliScope.dll adapter/inSiliScope | Select-Object -First 1
          if (-not $dll) { throw "mmgr_dal_inSiliScope.dll not found" }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $dll.FullName out/
          Copy-Item LICENSE-GPL-3.0.txt out/LICENSE-GPL-3.0.txt
          Copy-Item LICENSE out/LICENSE
          Copy-Item THIRD_PARTY_NOTICES.md out/THIRD_PARTY_NOTICES.md
          Copy-Item adapter/inSiliScope/config/*.cfg out/
          $hash = (Get-FileHash out/mmgr_dal_inSiliScope.dll -Algorithm SHA256).Hash.ToLower()
          "$hash  mmgr_dal_inSiliScope.dll" | Out-File -Encoding ascii out/mmgr_dal_inSiliScope.dll.sha256
          $di = (Select-String -Path third_party/mmCoreAndDevices/MMDevice/MMDevice.h -Pattern 'define DEVICE_INTERFACE_VERSION (\d+)').Matches[0].Groups[1].Value
          $di | Out-File -Encoding ascii out/device_interface.txt
          @(
            "mmgr_dal_inSiliScope.dll, version ${{ inputs.version }}, Micro-Manager device interface $di",
            "source commit: $env:GITHUB_SHA ($env:GITHUB_REF_NAME)",
            "built: $(Get-Date -Format o) by GitHub Actions run $env:GITHUB_RUN_ID",
            "sha256: $hash",
            "Licence: GPL-3.0 (LICENSE-GPL-3.0.txt); inSiliScope's own source is BSD-3-Clause (LICENSE); third parties: THIRD_PARTY_NOTICES.md.",
            "Needs: a Micro-Manager 2.0 nightly build with device interface $di (https://micro-manager.org/Micro-Manager_Nightly_Builds); older builds refuse the DLL.",
            "Install: copy the DLL into your Micro-Manager folder;",
            "devices: the hub inSiliScope and its peripherals (Camera, XYStage, ZStage, Objective, EmissionPath, FilterCube, ExcitationFilter, Dichroic, EmissionFilter, Lasers, TransmittedLamp, SampleHolder, CellField, Nanorulers, Fluorophores, Renderer) in module inSiliScope;",
            "configurations: inSiliScope_Basic.cfg, inSiliScope_Advanced.cfg, inSiliScope_Expert.cfg (File > Load System Configuration in Micro-Manager)."
          ) | Out-File -Encoding utf8 out/BUILD_INFO.txt
          Get-Content out/BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mmgr_dal_inSiliScope-windows-x64
          path: out/
