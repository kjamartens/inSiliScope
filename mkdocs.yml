site_name: inSiliScope
site_description: A deterministic in-silico microscope - a synthetic field of cells imaged as SMLM or widefield, in Micro-Manager, the browser and webSMLM.
site_url: https://kjamartens.github.io/inSiliScope/docs/
repo_url: https://github.com/kjamartens/inSiliScope
docs_dir: docs

theme:
  name: material
  custom_dir: overrides   # the analytics tag (overrides/partials/integrations/analytics/custom.html), link previews (main.html)
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.arithmatex: { generic: true }
  - pymdownx.superfences
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
  - javascripts/katex-init.js
  - javascripts/nav-external.js
extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  - stylesheets/extra.css

extra:
  analytics:
    provider: custom   # Umami, cookieless: docs/privacy.md
  social:
    - icon: fontawesome/solid/house
      link: https://kjamartens.github.io
      name: Koen Martens

exclude_docs: |
  dev/

# The pages that moved (2026-10-12) redirect to their new place; the viewer reference is linked from the Quickstart.
not_in_nav: |
  try-viewer.md
  physics/world-model.md
  physics/structures.md

nav:
  - Home: index.md
  - Viewer (live): https://kjamartens.github.io/inSiliScope/
  - Quickstart: quickstart.md
  - Gallery: gallery/index.md
  - Micro-Manager: micro-manager.md
  - Samples:
      - Overview: samples/index.md
      - Cell field:
          - World model: samples/cell-field/world-model.md
          - Structures: samples/cell-field/structures.md
      - Nanorulers:
          - DNA-origami nanorulers: samples/nanorulers/index.md
  - Physics:
      - Dyes and light path: physics/dyes-and-light-path.md
      - Photophysics: physics/photophysics.md
      - Optics and PSF: physics/optics.md
      - Camera and background: physics/camera.md
      - Validation: physics/validation.md
      - References: references.md
  - Extending: extending.md
  - Benchmarks: benchmarks.md
  - Roadmap: roadmap.md
  - Privacy: privacy.md
  - kjamartens.github.io: https://kjamartens.github.io
