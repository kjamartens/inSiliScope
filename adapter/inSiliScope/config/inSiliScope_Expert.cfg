# inSiliScope, Detail = Expert: generated by tools/gen_mm_configs.py from the adapter and data/ -- do not edit.
# The simulated microscope (spec/MM_DEVICES.md, docs/micro-manager.md). Groups: Channel (the label mode and its
# typical dye; lasers and filter cube follow), Objective, Aberrations (the objective's Zernike set), Camera
# (sensor + its relay), Quality, Drift, Specimen, Illumination (epi / HILO / TIRF: the laser spot in the back
# focal plane), BfpPosition (the same as a field),
# and the 561 and 640 nm laser powers (one property each: Studio shows an editable field).

