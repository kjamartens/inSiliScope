<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voxelize ground truth</title>
<link rel="icon" type="image/png" sizes="32x32" href="https://kjamartens.github.io/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="https://kjamartens.github.io/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://kjamartens.github.io/apple-touch-icon.png">
<style>
  :root { --bg: #f7f8fa; --panel: #fff; --text: #1d232b; --muted: #5f6b7a; --border: #d5dbe3; --accent: #2f6fd6; --warn: #a8650b; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0f1318; --panel: #171c23; --text: #e3e8ee; --muted: #93a0b0; --border: #2b333d; --accent: #6ea2ff; --warn: #e0a64a; }
  }
  :root[data-theme="dark"] { --bg: #0f1318; --panel: #171c23; --text: #e3e8ee; --muted: #93a0b0; --border: #2b333d; --accent: #6ea2ff; --warn: #e0a64a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 6px 0; color: var(--muted); }
  #drop { margin: 16px 0; border: 2px dashed var(--border); border-radius: 10px; padding: 28px 16px; text-align: center; background: var(--panel); cursor: pointer; }
  #drop.over { border-color: var(--accent); }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
  .grid { display: grid; grid-template-columns: max-content 1fr; gap: 8px 12px; align-items: center; }
  label { color: var(--muted); }
  .grid label.chk { color: var(--text); grid-column: 1 / -1; }
  input, select, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; max-width: 100%; }
  input[type=number] { width: 7em; }
  button.go { background: var(--accent); color: #fff; border-color: var(--accent); padding: 6px 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #info, #out, #load { white-space: pre-wrap; font-size: 13px; color: var(--muted); }
  .warn { color: var(--warn); }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
</style>
</head>
<body>
<main>
  <h1>Voxelize ground truth</h1>
  <p>Turns a ground-truth table (<code>dyes.csv</code>, <code>localizations.csv</code>, or the saved .zip) into a
    density stack at any voxel size. Open the .tif in Fiji with <b>File › Import › TIFF Virtual Stack</b>. Nothing is
    uploaded.</p>
  <div id="drop" tabindex="0">Drop a CSV or a saved recording's .zip here, or click to choose one<input type="file" id="file" accept=".csv,text/csv,.zip,application/zip" hidden></div>
  <div id="pick" hidden><label for="entry">Table in the zip</label> <select id="entry"></select></div>
  <div id="load"></div>
  <div class="panel" id="opts" hidden>
    <div class="grid">
      <label for="pos">Positions</label><select id="pos"></select>
      <label for="weight">Value per voxel</label><select id="weight"></select>
      <label for="target">Target</label><select id="target"></select>
      <label for="split">Targets as</label><select id="split">
        <option value="channels" selected>a channel each</option>
        <option value="sum">one stack (summed)</option></select>
      <label for="kind">Rows</label><select id="kind"></select>
      <label for="vxy">Voxel x, y (nm)</label><input type="number" id="vxy" min="1" step="1" value="10">
      <label for="vz">Voxel z (nm)</label><input type="number" id="vz" min="1" step="1" value="10">
      <label for="bits">Bit depth</label><select id="bits">
        <option value="8">8-bit (scaled)</option>
        <option value="16">16-bit (scaled)</option>
        <option value="32">32-bit float</option></select>
      <label for="fmt">File</label><select id="fmt">
        <option value="tif" selected>.tif, compressed</option>
        <option value="zip">.zip of an uncompressed .tif (Fiji opens it by drag-and-drop)</option>
        <option value="raw">.tif, uncompressed</option></select>
    </div>
    <div id="info"></div>
    <p><button class="go" id="go">Make the stack</button></p>
    <div id="out"></div>
  </div>
</main>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
// The table, by column (a 4 M-dye dyes.csv is ~600 MB of text: read as a stream into typed arrays, never whole):
// { name, n, num: {column: Float64Array}, cat: {column: {codes: Uint16Array, names: [...]}} }
let table = null;
const POS = ['x_world_um', 'y_world_um', 'z_world_um', 'site_x_world_um', 'site_y_world_um', 'site_z_world_um'];
// the value per voxel's choices, the first present the default: detected photons (what the camera got), then emitted
const WEIGHTS = ['photons_detected_total', 'photons_emitted_total', 'photons_detected', 'photons_emitted', 'intensity [photon]'];
const CATS = ['target', 'kind'];

// ---- a saved recording's .zip: its tables (gt/dyes.csv, gt/localizations.csv), read without unpacking it ----
// (the zip of web/live/zip.js: stored or deflated entries, Zip64 records when a size or offset passes 4 GB)
const TABLE = /(^|\/)(dyes|localizations(_min[\d.]+)?|fiducials)\.csv$/;   // (_min<N>: zips before 2026-11-04)
async function zipEntries(file) {

// an entry as load() reads a file: name, size (unpacked), stream()
async function zipEntryFile(file, ent) {

let zipped = null;   // the dropped zip and its tables
async function openInput(file) {
  $('pick').hidden = true;
  zipped = null;
  const sig = new DataView(await file.slice(0, 4).arrayBuffer());
  if (!/\.zip$/i.test(file.name) && !(sig.byteLength === 4 && sig.getUint32(0, true) === 0x04034b50)) return load(file);
  try {
    const tables = (await zipEntries(file)).filter(e => TABLE.test(e.name));
    if (!tables.length) { $('load').innerHTML = `<span class="warn">${esc(file.name)} holds no ground-truth table.</span>`; return; }
    // dyes.csv first, then the localization table(s) (an older zip: by threshold)
    const rank = e => /dyes\.csv$/.test(e.name) ? -1 : /fiducials/.test(e.name) ? 1e9 : +(/min([\d.]+)/.exec(e.name) || [0, 0])[1];
    tables.sort((a, b) => rank(a) - rank(b));
    zipped = { file, tables };
    $('entry').innerHTML = tables.map((e, i) => `<option value="${i}">${esc(e.name)} (${(e.size / 1e6).toFixed(1)} MB)</option>`).join('');
    $('pick').hidden = tables.length < 2;
    await load(await zipEntryFile(file, tables[0]), file.name);
  } catch (err) {
    $('load').innerHTML = `<span class="warn">${esc(file.name)}: ${esc(err.message || err)}</span>`;
  }
}

// ---- reading the CSV (fields as written by inSiliScope: quoted when they hold a comma) ----
function splitLine(s) {
  if (s.indexOf('"') < 0) return s.split(',');
  const out = [];
  let cur = '', q = false;
  for (let i = 0; i < s.length; i++) {

    if (q) { if (c === '"') { if (s[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }

    else if (c === ',') { out.push(cur); cur = ''; }

}

    } else blob = tiffBlob(data, layout(data.map(d => d.size)));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = file; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 30000);
    $('out').textContent = `Saved ${file} (${(blob.size / 1e6).toFixed(2)} MB${zs ? `, holding ${name}` : ''}): ${g.nx} × ${g.ny} × ${g.nz} voxels of ` +
      `${g.vx * 1000} × ${g.vx * 1000} × ${g.vz * 1000} nm` + (nc > 1 ? `, ${nc} channels` : '') + '; ' +
      c.channels.map((n, k) => `${nc > 1 ? n + ': ' : ''}${sums[k].toPrecision(6)} in all` + (bits === 32 ? '' : `, ${scales[k].toPrecision(4)} ${unit} per step`)).join('; ') +
      '.';
  } catch (err) {
    $('out').innerHTML = `<span class="warn">${esc(err.message || err)}</span>`;
  } finally {
    if (h) M._vox_free(h);
    $('go').disabled = false;
  }
}

$('drop').addEventListener('click', () => $('file').click());
$('drop').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') $('file').click(); });
$('file').addEventListener('change', () => { if ($('file').files[0]) openInput($('file').files[0]); });
$('entry').addEventListener('change', async () => {
  if (!zipped) return;
  try { await load(await zipEntryFile(zipped.file, zipped.tables[+$('entry').value]), zipped.file.name); }
  catch (err) { $('load').innerHTML = `<span class="warn">${esc(err.message || err)}</span>`; }
});
$('drop').addEventListener('dragover', e => { e.preventDefault(); $('drop').classList.add('over'); });
$('drop').addEventListener('dragleave', () => $('drop').classList.remove('over'));
$('drop').addEventListener('drop', e => { e.preventDefault(); $('drop').classList.remove('over'); if (e.dataTransfer.files[0]) openInput(e.dataTransfer.files[0]); });
for (const id of ['pos', 'weight', 'target', 'split', 'kind', 'vxy', 'vz', 'bits', 'fmt']) $(id).addEventListener('input', describe);
$('go').addEventListener('click', make);
self.iscVoxelize = { openInput, load, make, tiffBlob, zipEntries };   // (the browser test drives it)
</script>
</body>
</html>
