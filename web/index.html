<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cell field viewer</title>
<style>
  /* UI styles: one DOM, themed by body[data-ui-style] (compact | focus | light). A new style is one block of tokens
     below plus one entry in UI_STYLES (uiSchema script; oneOpen: only one group open at a time). The canvas area and its overlays stay dark in every style. */
  :root{--side-w:380px;--lab-w:116px;--lab-w-base:116px;--val-w:68px;--bg:#0c0f14;--panel:#11161d;--border:#232a35;--text:#dfe6ee;--muted:#8b97a8;--accent:#4a90d9;
    --link:#8bb8e8;--in-bg:#1a212b;--in-border:#2c3644;--grp-bg:transparent;--grp-head:transparent;--tip-bg:#1d2530;
    --row-gap:4px;--fs:12px;--radius:6px;--guide:#2f3a4a}
  body[data-ui-style=focus]{--panel:#0f141b;--border:#26303d;--grp-bg:#161d27;--grp-head:#1b2430;--accent:#5aa9e6;--guide:#3a4a60}
  body[data-ui-style=light]{--panel:#f5f6f8;--border:#d9dde3;--text:#1f2329;--muted:#5d6672;--accent:#4051b5;
    --link:#4051b5;--in-bg:#fff;--in-border:#c4cad3;--tip-bg:#fff;--guide:#c4cad3}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
  #wrap{display:grid;grid-template-columns:var(--side-w) 1fr;height:100vh}
  #side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--border);box-sizing:border-box;font-size:var(--fs)}
  #sideTop{position:relative;padding:10px 12px 6px;border-bottom:1px solid var(--border)}
  #sideTop .bar{display:flex;align-items:center;gap:8px}
  #sideTop h1{font-size:15px;margin:0;flex:1}
  #side a.back{display:block;font-size:11px;color:var(--link);text-decoration:none;margin:0 0 6px}
  #side a.back:hover{text-decoration:underline}
  #panel{flex:1;overflow-y:auto;padding:4px 12px 12px;min-height:0}
  #side p.sub{font-size:11px;color:var(--muted);margin:6px 0;line-height:1.4}
  #side p.sub a{color:var(--link)}
  input[type=number],input[type=text],select{background:var(--in-bg);border:1px solid var(--in-border);color:var(--text);border-radius:4px;padding:2px 4px;font-size:var(--fs);font-family:inherit;box-sizing:border-box}
  input[type=number]{width:64px}
  input[type=range],input[type=checkbox]{accent-color:var(--accent)}
  button{background:var(--in-bg);border:1px solid var(--in-border);color:var(--text);border-radius:4px;padding:5px 8px;font-size:var(--fs);cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--accent)}
  /* hamburger menu */
  #menuBtn{font-size:16px;line-height:1;padding:3px 8px}
  #menu{display:none;position:absolute;right:12px;top:100%;z-index:20;margin-top:4px;min-width:210px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 10px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  #menu.open{display:block}
  #menu h4{margin:6px 0 4px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  #menu label{display:block;margin:3px 0;cursor:pointer}
  #menu .btns{display:flex;gap:6px;margin-top:8px}
  #menu .btns button{flex:1;padding:3px 6px}
  #menu .note{font-size:11px;color:var(--muted);margin-top:6px}
  /* groups and sections */
  .sect{margin:12px 0 2px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  details.grp{border:1px solid var(--border);border-radius:var(--radius);margin:6px 0;background:var(--grp-bg)}
  details.grp>summary{cursor:pointer;padding:5px 8px;font-weight:600;list-style:none;display:flex;align-items:center;gap:6px;background:var(--grp-head);border-radius:var(--radius)}
  details.grp>summary::-webkit-details-marker{display:none}
  details.grp>summary::before{content:'▸';color:var(--muted);font-size:10px;transition:transform .12s}
  details.grp[open]>summary::before{transform:rotate(90deg)}
  details.grp[open]>summary{border-bottom:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0}
  details.grp .body{padding:4px 8px 6px}
  /* focus: the one open group carries the accent: its title in the accent colour, its box a faint tint of it */
  body[data-ui-style=focus] details.grp[open]{border-color:color-mix(in srgb,var(--accent) 45%,var(--border));background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  body[data-ui-style=focus] details.grp[open]>summary{color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel));border-bottom-color:color-mix(in srgb,var(--accent) 35%,var(--border))}
  body[data-ui-style=focus] details.grp[open]>summary::before{color:var(--accent)}
  body[data-ui-style=focus] #menu [data-act=expand]{display:none}
  /* one option = one line: label (i) | control | value + unit */
  .opt{display:grid;grid-template-columns:var(--lab-w) minmax(0,1fr) var(--val-w);align-items:center;gap:6px;margin:var(--row-gap) 0}
  .opt .lab{display:flex;align-items:center;gap:4px;min-width:0}
  .opt .lab label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .opt .ctl{display:flex;align-items:center;gap:4px;justify-content:flex-end}
  .opt .ctl input[type=range]{width:100%;min-width:0}
  .opt .ctl select{max-width:150px}
  .opt .val{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
  .opt .val b{color:var(--text);font-weight:500}
  .opt.wide{grid-template-columns:1fr}
  .opt.wide button{width:100%}
  .opt.check{grid-template-columns:minmax(0,1fr) auto}
  .opt.select,.opt.preset{grid-template-columns:var(--lab-w) minmax(0,1fr)}
  .opt.select select,.opt.preset select{width:100%;max-width:none}
  .opt .val .u{font-size:.9em}
  .opt.pair .ctl input[type=number]{width:52px;flex:none;padding:2px 3px}
  .opt.pair .ctl .dual{flex:1;min-width:30px;width:auto}
  .opt.pair .ctl{grid-column:2 / 4}
  .opt.pair .ctl .u{flex:none;width:calc(var(--val-w) - 26px);padding-left:2px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .opt.pair .val{display:none}
  .info{display:inline-flex;align-items:center;justify-content:center;flex:none;width:13px;height:13px;border-radius:50%;border:1px solid var(--muted);color:var(--muted);font-size:9px;font-style:italic;font-family:Georgia,serif;cursor:help;user-select:none}
  .info:hover,.info:focus{color:var(--accent);border-color:var(--accent);outline:none}
  #tip{position:fixed;z-index:50;display:none;max-width:280px;background:var(--tip-bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:11.5px;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.35);pointer-events:none}
  #tip code{font-size:10.5px;color:var(--muted)}
  /* preset children: indented under their preset with a guide line */
  .kids{margin-left:5px;padding-left:9px;border-left:2px solid var(--guide)}
  .kids .opt{--lab-w:calc(var(--lab-w-base) - 16px)}
  body[data-level=default] .adv{display:none!important}
  /* two-knob range slider (two overlaid range inputs) */
  .dual{position:relative;width:96px;height:18px}
  .dual .track,.dual .fill{position:absolute;top:8px;height:3px;border-radius:2px}
  .dual .track{left:0;right:0;background:var(--in-border)}
  .dual .fill{background:var(--accent)}
  .dual input{position:absolute;left:0;top:0;width:100%!important;height:18px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
  .dual input::-webkit-slider-runnable-track{background:none;height:18px}
  .dual input::-moz-range-track{background:none}
  .dual input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:12px;height:12px;margin-top:3px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);cursor:pointer}
  .dual input::-moz-range-thumb{pointer-events:auto;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);cursor:pointer}
  @media (max-width:700px){
    #wrap{grid-template-columns:1fr;grid-template-rows:45vh 1fr}
    #side{border-right:none;border-bottom:1px solid var(--border)}
  }
  #canvasHost{position:relative;min-height:0}
  canvas{display:block;cursor:grab}
  canvas.dragging{cursor:grabbing}
  /* Three stacked layers, all the same pixel size: #cvBase (grid + microtubules, 2D), #cvGl (cell bodies, WebGL2),
     #cv (nuclei + scale bar, 2D, the interactive one). #cvGl/#cvBase are display:none when WebGL2 is unavailable. */
  #cvBase{position:absolute;top:0;left:0;background:#05070a;pointer-events:none;z-index:0}
  #cvGl{position:absolute;top:0;left:0;pointer-events:none;z-index:1}
  #cv{position:relative;z-index:2;background:transparent}
  #hud,#legend,#movie{z-index:3;color:#dfe6ee}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:4;pointer-events:none;font-size:14px;color:#8b97a8;background:#05070a}
  #movie{position:absolute;bottom:8px;right:8px;display:none;background:rgba(10,13,18,.94);border:1px solid #232a35;border-radius:6px;padding:6px;font-size:11px}
  #movie .t{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:3px 0}
  #movie a{color:#8bb8e8}
  #movie button{background:#1a212b;border-color:#2c3644;color:#dfe6ee}
  #mv_cv{display:block;image-rendering:pixelated;cursor:default;background:#000}
  #hud{position:absolute;top:8px;left:8px;font-size:11px;background:rgba(10,13,18,.7);border:1px solid #232a35;border-radius:6px;padding:8px 10px;line-height:1.5;pointer-events:none;white-space:pre}
  #legend{position:absolute;bottom:8px;left:8px;font-size:11px;background:rgba(10,13,18,.7);border:1px solid #232a35;border-radius:6px;padding:6px 9px;line-height:1.5}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
</style>
</head>
<body>
<div id="wrap">
  <div id="side">
    <div id="sideTop">
      <a id="docsLink" class="back" target="_top" href="https://kjamartens.github.io/inSiliScope/">&larr; inSiliScope docs</a>
      <div class="bar">
        <h1>Cell field viewer</h1>
        <button id="menuBtn" title="Options and style" aria-haspopup="true" aria-expanded="false">☰</button>
      </div>
      <div id="menu" role="menu"></div>
    </div>
    <!-- Filled from UI_GROUPS by the uiSchema script below (same element ids as the main script reads). -->
    <div id="panel"></div>
  </div>

  <div id="canvasHost">
    <canvas id="cvBase"></canvas>
    <canvas id="cvGl"></canvas>
    <canvas id="cv"></canvas>
    <div id="hud"></div>
    <div id="loading">Loading the cell field (WebAssembly core, packing cells)…</div>
    <div id="movie"><div class="t"><span id="mv_info"></span><span><a href="#" id="mv_save">save TIFF</a> &nbsp; <a href="#" id="mv_close">close</a></span></div>
      <canvas id="mv_cv"></canvas>
      <div class="t"><button id="mv_play">▶</button><input type="range" id="mv_slider" min="0" max="0" value="0" style="flex:1"><span id="mv_fno"></span></div></div>
    <div id="legend">
      <span class="sw" style="background:#5aa9e6"></span>cell body
      <span class="sw" style="background:#e6a23c;margin-left:10px"></span>nucleus (colour = depth)
      <span class="sw" style="background:#e6c65a;margin-left:10px"></span>microtubule
      <span class="sw" style="background:#ff4d4d;margin-left:10px"></span>dye
      <span class="sw" style="background:#3a4454;margin-left:10px"></span>chunk grid
    </div>
  </div>
</div>

<script src="insiliscope_module.js"></script>
<script src="wf_gpu.js"></script>
<script id="uiSchema">
'use strict';
// ---- option panel: schema + renderer ------------------------------------------------------------------------------
// Every option of the side panel is one entry of UI_GROUPS. This script builds #panel from it before the main script
// runs, with the element ids the main script reads (els, params(), movieSpec(), MOVIE_KEYS), so the generator path
// does not know the panel changed. One option = one line: label (i) | control | value + unit. Rows marked adv are
// hidden in the Default level; show() hides rows that do not apply (e.g. WideField rows unless that modality is
// chosen). A preset (or an entry with kids) draws its kids indented under it; picking a preset writes their values,
// editing one by hand makes it "Custom". Styles are CSS only (body[data-ui-style], UI_STYLES).
// This script is data only (no DOM access until a show()/fmt() runs): web/lab/engine_check.mjs reads the defaults
// from it (tests/parity/load_prototype.mjs schemaDefaults). The renderer is the uiPanel script below.
const { UI_GROUPS, UI_STYLES } = (() => {
const $ = id => document.getElementById(id);
const modality = () => +($('mv_modality') ? $('mv_modality').value : 0);
const SR = () => modality() === 0, WF = () => modality() === 1, BF = () => modality() === 2;
const fx = d => v => (+v).toFixed(d);
const offIf0 = d => v => +v ? (+v).toFixed(d) : 'off';
const pct = v => (100 * v).toFixed(1);
const adv = true;

const range = (id, label, unit, tip, min, max, step, value, o) => ({ kind: 'range', id, label, unit, tip, min, max, step, value, ...o });
const num = (id, label, unit, tip, min, max, step, value, o) => ({ kind: 'number', id, label, unit, tip, min, max, step, value, ...o });
const check = (id, label, tip, value, o) => ({ kind: 'check', id, label, tip, value, ...o });
const select = (id, label, tip, options, value, o) => ({ kind: 'select', id, label, tip, options, value, ...o });
const button = (id, label, tip, o) => ({ kind: 'button', id, label, tip, ...o });
// min/max on one line: two number boxes (ids id+'Min', id+'Max') around a two-knob slider over [lo, hi]
const pair = (id, label, unit, tip, lo, hi, step, vMin, vMax, o) => ({ kind: 'pair', id, label, unit, tip, lo, hi, step, vMin, vMax, ...o });
// a UI-only select that writes its kids: presets = { name: { childId: value } }
const preset = (id, label, tip, presets, kids, o) => ({ kind: 'preset', id, label, tip, presets, kids, ...o });

const BF_QUALITY_NAMES = ['', 'fastest', 'fast', 'balanced', 'precise'];
const ZERNIKE_PRESETS = ['None', 'AstigmatismWeak', 'AstigmatismModerate', 'AstigmatismStrong', 'ComaWeak', 'ComaStrong',
  'SphericalWeak', 'SphericalStrong', 'TrefoilModerate', 'MixedRealisticObjective', 'SaddlePoint', 'ExtendedRange',
  'ExtendedRangeStrong'].map((n, i) => [String(i), n]);

const UI_GROUPS = [
  { sect: 'Display', id: 'view', title: 'View', open: true, items: [
    range('tiltDeg', 'Tilt', '°', 'Tilts the view about the horizontal axis for a 3D impression. Display only.', 0, 75, 1, 0, { fmt: fx(0) }),
    check('showCyto', 'Show cytoplasm', 'Draw the cell bodies.', true),
    check('showNucleus', 'Show nucleus', 'Draw the nuclei (colour = depth).', true),
    check('showMt', 'Show microtubules', 'Draw the microtubules.', true),
    check('showDyes', 'Show dyes', 'Draw the labelled dye sites of the core (red), once zoomed in far enough (≥ 120 px/µm).', false),
    check('showGrid', 'Show chunk grid', 'Draw the chunk grid (one candidate cell per chunk; packing runs on fixed 8×8-chunk blocks).', false, { adv }),
    check('showCytoContours', 'Show height contour lines', 'Draw contour lines of the cytoplasm height.', false, { adv }),
    range('cytoContourStep', 'Contour step', 'µm', 'Height step between two contour lines.', 0.1, 1, 0.05, 0.25, { adv, fmt: fx(2) }),
    button('resetView', 'Reset view to origin', 'Back to world position (0, 0) at the default zoom.'),
  ] },

  { sect: 'Sample', id: 'field', title: 'Specimen: cell field', open: true, items: [
    num('seed', 'World seed', 'integer', 'Every cell, microtubule and dye is a pure function of (seed, position): the same seed always gives the same world.', null, null, 1, 1249),
    button('reseed', 'Randomize seed', 'Draw a new random world seed.'),
    range('density', 'Occupancy', '%', 'Share of chunks that hold a cell, before packing drops cells that stay stuck. <code>SimType_CellFieldOccupancy</code>', 0.05, 1, 0.01, 0.33, { fmt: v => (100 * v).toFixed(0) }),
    range('jitter', 'Position jitter', '× chunk', 'How far a cell centre may move from its chunk centre, as a fraction of the chunk (a jittered grid). Below 1 two neighbours stay at least chunk × (1 − jitter) apart.', 0.1, 1, 0.02, 0.8, { adv, fmt: fx(2) }),
    num('chunkSize', 'Chunk size', 'µm', 'Side of the square chunk grid. One candidate cell per chunk, so this sets the mean cell spacing. <code>SimType_CellFieldChunkSizeUm</code>', 4, 200, 1, 26, { adv }),
  ] },
  { id: 'shape', title: 'Cell shape', open: true, items: [
    preset('cellShape', 'Cell shape', 'Sets the footprint and outline (the rows below) to a typical cell shape. Rough starting points, not measured values; editing a row shows "Custom".', {
      'Default': { cellDiamMin: 25, cellDiamMax: 35, cellElongMin: 0.5, cellElongMax: 1, cellHeightMin: 3, cellHeightMax: 6, cellBlob: 1.75, cellRough: 0.15, cellFractalDim: 1.35 },
      'Round, smooth': { cellDiamMin: 20, cellDiamMax: 30, cellElongMin: 0.8, cellElongMax: 1, cellHeightMin: 3, cellHeightMax: 6, cellBlob: 0.3, cellRough: 0.05, cellFractalDim: 1.2 },
      'Elongated': { cellDiamMin: 30, cellDiamMax: 50, cellElongMin: 0.25, cellElongMax: 0.5, cellHeightMin: 2, cellHeightMax: 4, cellBlob: 1, cellRough: 0.15, cellFractalDim: 1.35 },
      'Spread, lobed': { cellDiamMin: 35, cellDiamMax: 55, cellElongMin: 0.5, cellElongMax: 1, cellHeightMin: 2, cellHeightMax: 4, cellBlob: 3, cellRough: 0.3, cellFractalDim: 1.45 },
      'Small, compact': { cellDiamMin: 12, cellDiamMax: 18, cellElongMin: 0.7, cellElongMax: 1, cellHeightMin: 4, cellHeightMax: 8, cellBlob: 0.75, cellRough: 0.1, cellFractalDim: 1.3 },
      'Irregular, rough': { cellDiamMin: 25, cellDiamMax: 40, cellElongMin: 0.4, cellElongMax: 1, cellHeightMin: 3, cellHeightMax: 6, cellBlob: 2.5, cellRough: 0.5, cellFractalDim: 1.6 },
    }, [
      pair('cellDiam', 'Diameter', 'µm', 'Footprint diameter, drawn per cell between min and max.', 5, 80, 0.5, 25, 35),
      pair('cellElong', 'Elongation', 'ratio', 'Short-to-long axis ratio of the footprint, per cell (1 = round).', 0.1, 1, 0.05, 0.5, 1),
      pair('cellHeight', 'Height', 'µm', 'Cell height, drawn per cell between min and max.', 0.5, 15, 0.5, 3, 6),
      range('cellBlob', 'Blobbiness', 'a.u.', 'Amplitude of the large lobes of the outline (0 = smooth ellipse).', 0, 4, 0.05, 1.75, { fmt: fx(2) }),
      range('cellRough', 'Roughness', '× blob', 'Fine fractal wiggle of the outline (harmonics 6-64), scaled with blobbiness. 0 = smooth lobes only.', 0, 1, 0.01, 0.15, { adv, fmt: fx(2) }),
      range('cellFractalDim', 'Fractal dim.', 'D', "Fractal (box-counting) dimension of the outline's fine wiggle, 1 (smooth) to 2 (space-filling). Measured cell contours: ~1.35.", 1, 2, 0.01, 1.35, { adv, fmt: fx(2) }),
    ]),
  ] },
  { id: 'nucleus', title: 'Nucleus', items: [
    pair('nucLong', 'Long axis', 'µm', 'Long axis of the nucleus ellipsoid, per cell.', 2, 30, 0.5, 8, 12),
    pair('nucRatio', 'Short/long axis', 'ratio', 'Short-to-long axis ratio of the nucleus footprint, per cell.', 0.2, 1, 0.05, 0.6, 1, { adv }),
    pair('nucHeight', 'Height', '× long', 'Height of the ellipsoid as a fraction of its long axis, per cell.', 0.1, 1, 0.05, 0.3, 0.5, { adv }),
    range('nucOffsetFrac', 'Centre offset', '× cell r', 'Random offset of the nucleus from the cell centre, up to this fraction of the cell radius.', 0, 1, 0.02, 0.1, { adv, fmt: fx(2) }),
    range('nucMargin', 'Margin', 'µm', 'Cytoplasm clearance around the nucleus on every side, and the least cytoplasm above it.', 0.1, 1.5, 0.1, 0.6, { adv, fmt: fx(1) }),
  ] },
  { id: 'cyto', title: 'Cytoplasm', items: [
    preset('cellLook', 'Cell look', 'Sets the cytoplasm height profile (the rows below: rim and mid heights, their distances, slope caps) to a typical shape. Rough starting points, not measured values; editing a row shows "Custom".', {
      'Rounded': { cytoRimHeightMin: 0.2, cytoRimHeightMax: 0.5, cytoEdgeRiseMin: 0.1, cytoEdgeRiseMax: 0.5, cytoMidHeightMin: 2, cytoMidHeightMax: 3.5, cytoMidDistanceMin: 0.1, cytoMidDistanceMax: 0.3, cytoMaxSlope: 2, cytoDomeSlope: 4 },
      'Classic': { cytoRimHeightMin: 0.1, cytoRimHeightMax: 0.3, cytoEdgeRiseMin: 0.1, cytoEdgeRiseMax: 0.5, cytoMidHeightMin: 1, cytoMidHeightMax: 2, cytoMidDistanceMin: 0.1, cytoMidDistanceMax: 0.3, cytoMaxSlope: 1, cytoDomeSlope: 3 },
      'Flat, spread': { cytoRimHeightMin: 0.05, cytoRimHeightMax: 0.15, cytoEdgeRiseMin: 0.1, cytoEdgeRiseMax: 0.5, cytoMidHeightMin: 0.5, cytoMidHeightMax: 1, cytoMidDistanceMin: 0.1, cytoMidDistanceMax: 0.3, cytoMaxSlope: 0.5, cytoDomeSlope: 2 },
      'Fried egg': { cytoRimHeightMin: 0.05, cytoRimHeightMax: 0.15, cytoEdgeRiseMin: 0.2, cytoEdgeRiseMax: 0.6, cytoMidHeightMin: 0.4, cytoMidHeightMax: 0.8, cytoMidDistanceMin: 0.05, cytoMidDistanceMax: 0.15, cytoMaxSlope: 0.5, cytoDomeSlope: 4 },
      'Tall, compact': { cytoRimHeightMin: 0.4, cytoRimHeightMax: 0.8, cytoEdgeRiseMin: 0.3, cytoEdgeRiseMax: 0.8, cytoMidHeightMin: 3, cytoMidHeightMax: 5, cytoMidDistanceMin: 0.2, cytoMidDistanceMax: 0.4, cytoMaxSlope: 3, cytoDomeSlope: 6 },
      'Thin lamella': { cytoRimHeightMin: 0.03, cytoRimHeightMax: 0.08, cytoEdgeRiseMin: 0.5, cytoEdgeRiseMax: 1.5, cytoMidHeightMin: 0.3, cytoMidHeightMax: 0.6, cytoMidDistanceMin: 0.4, cytoMidDistanceMax: 0.6, cytoMaxSlope: 0.3, cytoDomeSlope: 2.5 },
    }, [
      pair('cytoRimHeight', 'Rim height', 'µm', 'Cytoplasm height at the cell edge, per cell.', 0, 2, 0.05, 0.2, 0.5, { adv }),

// Styles: name -> menu label. The look is CSS (body[data-ui-style=...]); add a block there and an entry here.
const UI_STYLES = { compact: { label: 'Compact (dark)' }, focus: { label: 'Focus (one group open)', oneOpen: true }, light: { label: 'Light' } };

<script id="uiPanel">
'use strict';
(function () {
const $ = id => document.getElementById(id);

// ---- persistence (per viewer; may be unavailable) ----
const store = {
  get(k, d) { try { const v = localStorage.getItem('isc.ui.' + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('isc.ui.' + k, v); } catch (e) { /* private window etc. */ } },
};

// ---- rendering ----
function h(tag, attrs, html) {
  const e = document.createElement(tag);
  for (const k in attrs || {}) if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) e.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
  if (html !== undefined) e.innerHTML = html;
  return e;
}
const entries = [];   // every rendered entry, kids included: { ...entry, row, group, parent }
const groups = [];    // { g, det, sect }

function labelCell(e, forId) {
  const lab = h('div', { class: 'lab' });
  lab.append(h('label', forId ? { for: forId } : {}, e.label));
  if (e.tip) lab.append(h('span', { class: 'info', tabindex: 0, role: 'note', 'aria-label': e.label + ' info', 'data-tip': e.tip }, 'i'));
  return lab;
}
function inputAttrs(e, id, value) {
  return { type: e.kind === 'range' ? 'range' : 'number', id, min: e.min, max: e.max, step: e.step, value: value };
}
function renderEntry(e, host, g, parent) {
  const r = { ...e, group: g, parent };
  let row;
  if (e.kind === 'html') {
    row = h('div', {}, e.html);
  } else if (e.kind === 'button') {
    row = h('div', { class: 'opt wide' });
    row.append(h('button', { id: e.id, title: e.tip }, e.label));
  } else {
    row = h('div', { class: 'opt ' + e.kind });
    const ctl = h('div', { class: 'ctl' }), val = h('div', { class: 'val' });
    if (e.kind === 'range') {
      ctl.append(h('input', inputAttrs(e, e.id, e.value)));
      val.append(h('b', { id: e.valId || e.id + 'Val' }), document.createTextNode(e.unit ? ' ' : ''), h('span', { class: 'u' }, e.unit));
    } else if (e.kind === 'number') {
      ctl.append(h('input', inputAttrs(e, e.id, e.value)));
      val.append(h('span', { class: 'u' }, e.unit));
    } else if (e.kind === 'check') {
      ctl.append(h('input', { type: 'checkbox', id: e.id, checked: !!e.value }));
    } else if (e.kind === 'select' || e.kind === 'preset') {
      const s = h('select', { id: e.id });
      const opts = e.kind === 'preset' ? Object.keys(e.presets).map(n => [n, n]).concat([['custom', 'Custom']]) : e.options;
      for (const [v, t] of opts) s.append(h('option', { value: v, selected: v === e.value, disabled: v === 'custom' }, t));
      ctl.append(s);
    } else if (e.kind === 'pair') {
      const bounds = e.bounded ? { min: e.lo, max: e.hi } : {};   // bounded: the boxes are limited to the slider range too
      const bMin = h('input', { type: 'number', id: e.id + 'Min', step: e.step, value: e.vMin, ...bounds });
      const bMax = h('input', { type: 'number', id: e.id + 'Max', step: e.step, value: e.vMax, ...bounds });
      const dual = h('div', { class: 'dual' });
      const lo = h('input', { type: 'range', min: e.lo, max: e.hi, step: e.step, 'aria-label': e.label + ' min' });
      const hi = h('input', { type: 'range', min: e.lo, max: e.hi, step: e.step, 'aria-label': e.label + ' max' });
      const fill = h('div', { class: 'fill' });
      dual.append(h('div', { class: 'track' }), fill, lo, hi);
      ctl.append(bMin, dual, bMax, h('span', { class: 'u' }, e.unit));   // spans the value column too (CSS)
      const span = e.hi - e.lo;
      const syncDual = () => {
        lo.value = +bMin.value; hi.value = +bMax.value;   // clamped to [lo, hi] by the input itself
        const a = (+lo.value - e.lo) / span, b = (+hi.value - e.lo) / span;
        fill.style.left = (100 * Math.min(a, b)) + '%'; fill.style.width = (100 * Math.abs(b - a)) + '%';
      };
      const fromSlider = (src, box, other, isLo) => () => {
        let v = +src.value;
        if (isLo ? v > +other.value : v < +other.value) { v = +other.value; src.value = v; }
        box.value = v;
        box.dispatchEvent(new Event('input', { bubbles: true }));
      };
      lo.addEventListener('input', fromSlider(lo, bMin, hi, true));
      hi.addEventListener('input', fromSlider(hi, bMax, lo, false));
      bMin.addEventListener('input', syncDual); bMax.addEventListener('input', syncDual);
      r.syncDual = syncDual;
    }
    row.prepend(labelCell(e, e.kind === 'pair' ? e.id + 'Min' : e.id));
    row.append(ctl, val);
  }
  if (e.adv || (g && g.adv)) row.classList.add('adv');
  if (e.cls) row.classList.add(e.cls);
  r.row = row;
  host.append(row);
  entries.push(r);
  if (e.kids) {
    const kids = h('div', { class: 'kids' });
    r.kidsEl = kids;
    host.append(kids);
    r.kidEntries = e.kids.map(k => renderEntry(k, kids, g, r));
  }
  return r;
}

const panel = $('panel');
const oneOpen = () => !!(UI_STYLES[document.body.dataset.uiStyle] || {}).oneOpen;
// Open groups: one remembered group in a oneOpen style, each group's own remembered state otherwise.
function applyOpen() {
  if (oneOpen()) {
    const want = store.get('focusOpen', (groups.find(G => G.det.open) || groups[0]).g.id);
    for (const G of groups) G.det.open = G.g.id === want;
  } else for (const G of groups) G.det.open = store.get('open.' + G.g.id, G.g.open ? '1' : '0') === '1';
}
let curSect = null;
for (const g of UI_GROUPS) {
  if (g.sect !== undefined) { curSect = { el: h('div', { class: 'sect' }, g.sect), groups: [] }; panel.append(curSect.el); }
  const det = h('details', { class: 'grp', 'data-group': g.id });
  det.append(h('summary', {}, g.title));
  const body = h('div', { class: 'body' });
  det.append(body);
  det.addEventListener('toggle', () => {
    if (!oneOpen()) store.set('open.' + g.id, det.open ? '1' : '0');
    else if (det.open) { store.set('focusOpen', g.id); for (const o of groups) if (o.det !== det) o.det.open = false; }
  });
  panel.append(det);
  const G = { g, det, sect: curSect, entries: g.items.map(e => renderEntry(e, body, g, null)) };
  groups.push(G); curSect.groups.push(G);
}

// ---- values, presets, visibility ----
const byId = {};
for (const r of entries) if (r.id) byId[r.id] = r;
function setValue(id, v) {
  const el = $(id);
  if (el.type === 'checkbox') el.checked = !!v; else el.value = v;
  el.dispatchEvent(new Event('input', { bubbles: true }));
}
function presetMatch(r) {
  for (const name in r.presets) {
    const vals = r.presets[name];
    if (Object.keys(vals).every(id => Math.abs(+$(id).value - vals[id]) < 1e-9)) return name;
  }
  return 'custom';
}
const isShown = r => (!r.show || r.show()) && (!r.parent || isShown(r.parent));
const isDefault = r => r.kind === 'pair'
  ? +$(r.id + 'Min').value === r.vMin && +$(r.id + 'Max').value === r.vMax

function lerp(a, b, t) { return a + (b - a) * t; }

// Deliberately echoes the "colour by depth (z)" convention used elsewhere in
// this project's own reference imagery -- makes the nucleus's 3D-ness legible
// at a glance instead of just being a flat-shaded blob.
const DEPTH_STOPS = [[0.15, 0.25, 0.9], [0.1, 0.75, 0.85], [0.25, 0.8, 0.25], [0.95, 0.85, 0.15], [0.9, 0.2, 0.15]];
function depthRGB(z, zmin, zmax) {
  const t = zmax > zmin ? (z - zmin) / (zmax - zmin) : 0.5;
  const f = Math.min(0.9999, Math.max(0, t)) * (DEPTH_STOPS.length - 1);
  const i = Math.floor(f), frac = f - i;
  const a = DEPTH_STOPS[i], b = DEPTH_STOPS[Math.min(DEPTH_STOPS.length - 1, i + 1)];
  return [lerp(a[0], b[0], frac) * 255, lerp(a[1], b[1], frac) * 255, lerp(a[2], b[2], frac) * 255];

// Standard marching squares, generalised to the polar (ring, theta-index)
// mesh above: theta wraps around (i+1 mod n), ring does not. Returns
// segments in whatever frame the mesh itself is in (local, per
// buildCytoMesh) with z = the iso-level (contour height) -- the caller
// translates by c.x,c.y before projecting.
// Reads the mesh's interleaved vertex array (x, y, h at 3*(k*n + i)); returns a flat
// array of x1, y1, x2, y2, level per segment.
function marchingSquaresContours(mesh, levels) {
  const { rings, n, flat: f } = mesh;
  const segs = [], corner = [0, 0, 0, 0], px = [0, 0], py = [0, 0];
  for (let k = 0; k < rings; k++) {
    for (let i = 0; i < n; i++) {
      const i2 = (i + 1) % n;
      // the quad's corners p00, p10, p11, p01; edges (c, c+1 mod 4) in that order
      corner[0] = 3 * (k * n + i); corner[1] = 3 * (k * n + i2);
      corner[2] = 3 * ((k + 1) * n + i2); corner[3] = 3 * ((k + 1) * n + i);
      for (let l = 0; l < levels.length; l++) {
        const lvl = levels[l];
        let np = 0;
        for (let e = 0; e < 4; e++) {
          const a = corner[e], b = corner[(e + 1) & 3], ah = f[a + 2], bh = f[b + 2];
          if ((ah - lvl) * (bh - lvl) < 0) {
            const t = (lvl - ah) / (bh - ah);
            if (np < 2) { px[np] = f[a] + (f[b] - f[a]) * t; py[np] = f[a + 1] + (f[b + 1] - f[a + 1]) * t; }
            np++;
          }
        }
        if (np === 2) segs.push(px[0], py[0], px[1], py[1], lvl);
      }
    }
  }
  return segs;
}

// Simple oblique projection: x is unaffected by tilt, y is foreshortened by
// cos(tilt) and z lifts the point on screen by sin(tilt) -- tilt=0 reduces
// exactly to the original pure top-down view (cos=1, sin=0), tilt>0 reveals
// height (cell body extrusion, nucleus ellipsoid) the way an isometric-ish
// camera looking down at an angle would. No azimuth rotation, deliberately
// kept to the minimum needed to make "in 3D" legible.
function project(x, y, z) {
  const dpr = devicePixelRatio;
  const sx = cv.width / 2 + (x - view.cx) * view.scale * dpr;
  const sy = cv.height / 2 + ((y - view.cy) * Math.cos(view.tiltRad) - z * Math.sin(view.tiltRad)) * view.scale * dpr;
  return [sx, sy];
}

// Scale bar: picks a "nice" round length (1-2-5 sequence) that renders at
// roughly TARGET_PX on screen at the current zoom, drawn bottom-right in
// fixed screen space (untouched by pan/tilt). Uses the x-axis pixel scale
// specifically -- project()'s x mapping is pure view.scale*dpr regardless of
// tilt (only y is foreshortened by cos(tilt)), so a horizontal bar stays
// metrically correct at any tilt.
const SCALE_NICE = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000];
function drawScaleBar(pxPerUm) {
  const targetPx = 140 * devicePixelRatio;
  let chosen = SCALE_NICE[0];
  for (const v of SCALE_NICE) { if (v * pxPerUm <= targetPx) chosen = v; else break; }
  const barPx = chosen * pxPerUm;
  const m = 18 * devicePixelRatio;
  const y = cv.height - m;
  const x2 = cv.width - m, x1 = x2 - barPx;

  ctx.lineWidth = Math.max(2, 2 * devicePixelRatio);
  ctx.beginPath();

  ctx.textAlign = 'center';

  ctx.beginPath();

  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);

// Rotates a point out of the cell's cached LOCAL frame (the frame every
// cell mesh/outline (from the core) is built in, independent of the
// cell's actual position -- see cellOutlineLocal's own comment) into world
// space by the packing-only c.packRot, then translates by c.x,c.y. Applying
// the rotation here at draw time, rather than baking it into the cached
// local geometry, is what lets relax() turn a cell every iteration without
// invalidating the per-cell asset cache.
function localToWorld(c, lx, ly) {
  const rot = c.packRot || 0;
  if (!rot) return [c.x + lx, c.y + ly];
  const cr = Math.cos(rot), sr = Math.sin(rot);
  return [c.x + lx * cr - ly * sr, c.y + lx * sr + ly * cr];
}

// ---- per-cell mesh render cache + WebGL2 cell-body layer ---------------------
// draw() runs on every pan/zoom event, so nothing here may redo work that a
// pan/zoom cannot change. Everything below hangs off the asset's `entry`
// (one per chunk, dropped by clearCytoCache): flat typed-array copy of the mesh
// (`render`), its depth-sorted quad order (only depends on tilt + packRot, both
// constant during a drag -- the sort key's translation term is the same for every
// quad, so it never enters it), cached contour segments, and the GPU buffers.
function getMeshRender(entry, c) {
  let r = entry.render;
  if (r) return r;
  const { rings, n, flat } = entry.mesh;
  const nv = (rings + 1) * n, nq = rings * n;
  r = {
    nv, nq, n, rings,
    lx: new Float32Array(nv), ly: new Float32Array(nv), h: new Float32Array(nv),
    qidx: new Uint32Array(nq * 4), qcol: null, qavgH: new Float32Array(nq), // qcol: the 2D path's fill styles, made on first use
    sx: new Float32Array(nv), sy: new Float32Array(nv), // reused per-frame screen coords
    order: null, orderKey: '',
  };
  for (let v = 0; v < nv; v++) { r.lx[v] = flat[3 * v]; r.ly[v] = flat[3 * v + 1]; r.h[v] = flat[3 * v + 2]; }
  for (let k = 0; k < rings; k++) for (let i = 0; i < n; i++) {
    const q = k * n + i, i2 = (i + 1) % n, b = q * 4;
    const a = k * n + i, bb = k * n + i2, cc = (k + 1) * n + i2, d = (k + 1) * n + i;
    r.qidx[b] = a; r.qidx[b + 1] = bb; r.qidx[b + 2] = cc; r.qidx[b + 3] = d;
    r.qavgH[q] = (r.h[a] + r.h[bb] + r.h[cc] + r.h[d]) / 4;
  }
  entry.render = r;
  return r;
}

// Back-to-front order (see the note this replaced: no z-buffer anywhere, so quads
// are painted farthest first). Depth is y*sin(tilt) + z*cos(tilt); the cell's own
// world y adds the same constant to every quad, so only the packRot-rotated
// local y and the height matter.
function ensureQuadOrder(r, c, sinT, cosT) {
  const rot = c.packRot || 0;
  const key = sinT.toFixed(6) + '|' + rot;
  if (r.orderKey === key) return;
  const cr = Math.cos(rot), sr = Math.sin(rot);
  const depth = new Float32Array(r.nq);
  const { lx, ly, qidx } = r;
  for (let q = 0; q < r.nq; q++) {
    const b = q * 4;
    let wy = 0;
    for (let j = 0; j < 4; j++) { const v = qidx[b + j]; wy += lx[v] * sr + ly[v] * cr; }
    depth[q] = (wy / 4) * sinT + r.qavgH[q] * cosT;
  }
  const idx = new Uint32Array(r.nq);
  for (let q = 0; q < r.nq; q++) idx[q] = q;
  idx.sort((a, b) => depth[a] - depth[b]);
  r.order = idx; r.orderKey = key;
}

// Marching-squares segments depend only on the mesh + step, so they are cached
// (local frame, flat x1,y1,x2,y2,z) and merely transformed per frame.
function getContourSegs(entry, step) {
  if (entry.contours && entry.contours.step === step) return entry.contours.segs;

  // Pass 1 (base layer): footprint outlines + microtubules, each batched into ONE path.
  ctx = bg;
  if (els.showCyto.checked) {
    ctx.strokeStyle = 'rgba(90,169,230,0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (const { cell, asset } of vis) addOutlinePath(cell, asset.entry);
    ctx.stroke();
  }
  if (els.showMt.checked) {
    ctx.strokeStyle = '#e6c65a';
    ctx.lineWidth = Math.max(0.6, p.mtLineWidth * pxPerUm);
    ctx.globalAlpha = 0.8;
    for (const { cell, asset } of vis) {
      const mts = asset.mts;
      if (!mts) continue;
      const t = cellXform(cell);
      nMt += mts.lens.length;
      ctx.save();
      ctx.translate(t.ox, t.H2 + t.oy * t.cosT * t.S);
      ctx.stroke(getMtPath2D(mts, cell, t));
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  if (els.showDyes.checked) labelNote = drawDyes(seed, p, pxPerUm);

  // Pass 2: cell bodies -- GPU layer, or the 2D fallback on the top canvas.
  if (useGl) {
    if (els.showCyto.checked) drawBodiesGl(vis, p);
    else { gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); }
  } else if (els.showCyto.checked) {
    ctx = ctxTop;
    for (const { cell, asset } of vis) drawCellBody2D(cell, asset.entry);
  }

  // Pass 3 (top layer): contours, nuclei, scale bar.
  ctx = ctxTop;
  if (els.showCyto.checked && p.showCytoContours) {
    ctx.strokeStyle = 'rgba(20,30,45,0.55)';
    ctx.lineWidth = Math.max(1, 0.04 * pxPerUm);
    ctx.beginPath();
    for (const { cell, asset } of vis) addContourPath(cell, asset.entry, p.cytoContourStep);
    ctx.stroke();
  }
  if (els.showNucleus.checked) for (const { cell } of vis) drawNucleus(cell);

  drawMovieFov();
  drawScaleBar(pxPerUm);

  hud.textContent =
    `seed ${seed}   center (${view.cx.toFixed(1)}, ${view.cy.toFixed(1)}) um   scale ${view.scale.toFixed(2)} px/um   tilt ${(+els.tiltDeg.value)}°   ${useGl ? 'GPU' : '2D'}\n` +
    `chunks ${nChunks}   cells ${nCells} (${vis.length} on screen)   microtubules ${nMt}` +
    (!coreReady() ? '   [loading core…]' : '') +
    (packPending ? '   [packing…]' : '') + (nLoading ? `   [loading ${nLoading} cells…]` : '') +
    (withinCap ? '' : '   [view too large: zoom in]') +
    (labelNote ? '   [' + labelNote + ']' : '');
}

// ---- pan / zoom -------------------------------------------------------------
let dragging = false, lastX = 0, lastY = 0;
cv.addEventListener('pointerdown', e => {
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  cv.setPointerCapture(e.pointerId);
  cv.classList.add('dragging');
});
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  view.cx -= dx / view.scale;
  view.cy -= dy / (view.scale * Math.max(0.15, Math.cos(view.tiltRad)));
  noteInteraction(); requestDraw();
});
window.addEventListener('pointerup', () => {
  if (!dragging) return;
  dragging = false;
  cv.classList.remove('dragging');
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * 0.0015);
  view.scale = Math.max(0.3, view.scale * factor);
  noteInteraction(); requestDraw();
}, { passive: false });

// ---- wiring -------------------------------------------------------------------
// Value readouts, preset states and row visibility live with the panel (uiSchema script).
function syncLabels() { uiSync(); }
Object.keys(els).forEach(id => {
  const el = els[id];
  if (!el || id === 'reseed' || id === 'resetView' || id.endsWith('Val')) return;
  el.addEventListener('input', () => { syncLabels(); requestDraw(); });
});

els.reseed.addEventListener('click', () => {
  els.seed.value = (Math.random() * 2 ** 31) | 0;
  requestDraw();
});
els.resetView.addEventListener('click', () => {
  view.cx = 0; view.cy = 0; view.scale = 9;
  requestDraw();
});

// ---- dyes -----------------------------------------------------------------------
// The core's real labelled dyes (isc_sites_in_window: 13_3 lattice, binder tip,
// linker; labelEfficiency of the sites), shown once zoomed in far enough that a
// view holds a drawable number of them. Fetched by the dye worker for the view
// padded by DYE_PAD views each side and reused while the view stays inside it.
const DYE_MIN_PX_PER_UM = 120;
const DYE_MAX_DRAWN = 150000;
const DYE_PAD = 0.25;
let dyeCache = null;    // {key, rect, sites}
let dyePending = null;  // {id, key, rect}
let dyeId = 0;
function dyeKey(seed, p) { return assetSig(seed, p) + '|' + p.labelEfficiency + '|' + p.labelNonBleaching; }
function onDyeResult(e) {
  const d = e.data;
  if (!dyePending || d.id !== dyePending.id) return;
  dyePending = null;
  dyeCache = { key: d.key, rect: d.rect, sites: d.sites };
  requestDraw();
}
// Draws the cached dyes (red) and makes sure the right window is cached or on its
// way; returns a HUD note ('' if none).
function drawDyes(seed, p, pxPerUm) {
  if (pxPerUm < DYE_MIN_PX_PER_UM) return 'zoom in to show dyes';
  const halfW = (cv.width / devicePixelRatio / 2) / view.scale;
  const halfH = (cv.height / devicePixelRatio / 2) / view.scale / Math.max(0.15, Math.cos(view.tiltRad));
  const r = [view.cx - halfW, view.cy - halfH, view.cx + halfW, view.cy + halfH];
  const key = dyeKey(seed, p);
  const covers = c => c && c.key === key && r[0] >= c.rect[0] && r[1] >= c.rect[1] && r[2] <= c.rect[2] && r[3] <= c.rect[3];
  let note = '';
  if (!covers(dyeCache) && !covers(dyePending)) {
    const px = 2 * halfW * DYE_PAD, py = 2 * halfH * DYE_PAD;
    const rect = [r[0] - px, r[1] - py, r[2] + px, r[3] + py];
    if (genWorkers.ok) {
      dyePending = { id: ++dyeId, key, rect };
      genWorkers.dyes.postMessage({ type: 'sites', id: dyePending.id, key, rect, seed, p, blocks: blocksForRect(p, rect) });
    } else if (mainEngine) {
      const [d] = mainEngine.handle({ type: 'sites', id: 0, key, rect, seed, p });
      dyeCache = { key, rect, sites: d.sites };
    }
  }
  if (dyePending) note = 'loading dyes…';
  const c = dyeCache;
  if (!c || c.key !== key) return note;
  const s = c.sites, W = cv.width, H = cv.height, S = view.scale * devicePixelRatio;
  const cosT = Math.cos(view.tiltRad), sinT = Math.sin(view.tiltRad);
  let drawn = 0;
  ctx = ctxTop;
  ctx.fillStyle = '#ff4d4d';
  for (let i = 0; i < s.length; i += ISC_SITE_STRIDE) {
    const sx = W / 2 + (s[i] - view.cx) * S;
    const sy = H / 2 + ((s[i + 1] - view.cy) * cosT - s[i + 2] * sinT) * S;
    if (sx < 0 || sy < 0 || sx > W || sy > H) continue;
    if (drawn >= DYE_MAX_DRAWN) { note = 'dye cap reached, some not drawn'; break; }
    ctx.fillRect(sx - 0.6, sy - 0.6, 1.2, 1.2);
    drawn++;
  }
  return note || `${drawn} dyes`;
}


// ---- blink movie ---------------------------------------------------------------
// "These fluorophore settings, a few frames of blinking here": the dyes under the
// view centre rendered by the adapter's own render code (isc_scope_movie = the
// camera's precomputed CellField stack pipeline: its PSF, sCMOS noise), in
// the dye worker, on the viewer's world (same seed and params). Shown in a small
// player and saved as a 16-bit multi-page TIFF (writeTiff16 below).
const MOVIE_KEYS = ['frames', 'exposure-ms', 'size', 'pixel-nm', 'photons-per-sec', 'photon-cv', 'on-sec', 'off-sec',
  'bleach-prob', 'milli-activation-rate', 'z', 'z-range-um', 'start-sec', 'background-per-sec', 'seed', 'modality',
  'wf-upscale', 'wf-plane-nm', 'wf-excitation-photons-per-um2-per-sec', 'wf-quantum-yield', 'wf-photon-budget',
  'wf-extinction-coeff', 'psf-model', 'psf-zernike-preset', 'bf-quality', 'bf-sources', 'bf-slice-um',
  'bf-condenser-na', 'bf-wavelength-nm', 'bf-photons-per-px-per-sec', 'bf-absorption-per-um', 'bf-n-medium',
  'bf-n-cytoplasm', 'bf-n-nucleus', 'bf-n-microtubule'];
// The PSF kernel's half width: 3 um here instead of the adapter's 7 um keeps
// the kernel stack ~75 MB instead of ~400 MB in the worker's WASM memory. The
// cli reproduces a viewer movie with --psf-kernel-half-width-nm 3000.
const MOVIE_PSF_HALF_WIDTH_NM = 3000;
const moviePsfSeen = new Set(); // PSFs the worker has computed (it memoizes the last two)
let movie = null, moviePending = null, movieId = 0, movieRaf = 0, movieLast = 0, movieAcc = 0;
function movieSpec() {
  const p = params(), o = [];
  for (const k of MOVIE_KEYS) o.push(k + '=' + (+document.getElementById('mv_' + k).value));
  o.push('world-seed=' + (((+els.seed.value) | 0) >>> 0), 'x=' + view.cx, 'y=' + view.cy,
         'psf-kernel-half-width-nm=' + MOVIE_PSF_HALF_WIDTH_NM);
  for (const k in p) o.push('p.' + k + '=' + (+p[k])); // the viewer's world (UI-only keys are ignored)
  return o.join(' ');
}
function makeMovie() {
  const spec = movieSpec();
  const size = +document.getElementById('mv_size').value * (+document.getElementById('mv_pixel-nm').value) / 1000;
  const rect = [view.cx - size / 2, view.cy - size / 2, view.cx + size / 2, view.cy + size / 2];
  // ?wfgpu=any: WideField also on a software WebGPU adapter (tests).
  const job = { type: 'movie', id: ++movieId, spec, rect, gpuAnyAdapter: /[?&]wfgpu=any/.test(location.search) };
  moviePending = job;
  const psfKey = ['psf-model', 'psf-zernike-preset', 'pixel-nm'].map(k => document.getElementById('mv_' + k).value).join();
  const newPsf = document.getElementById('mv_psf-model').value !== '0' && !moviePsfSeen.has(psfKey);
  moviePsfSeen.add(psfKey);
  document.getElementById('mv_make').textContent = newPsf ? 'Computing PSF, rendering…' : 'Rendering…';
  if (genWorkers.ok) genWorkers.dyes.postMessage(job);
  else if (mainEngine) setTimeout(() => Promise.resolve(mainEngine.handle(job)).then(r => onMovieResult(r[0])), 0);
}
function onMovieResult(d) {
  if (!moviePending || d.id !== moviePending.id) return;
  moviePending = null;
  document.getElementById('mv_make').textContent = 'Make movie here';
  if (d.error) { alert('movie failed: ' + d.error); return; }
  // Display range: 0.1 / 99.9 percentiles over the whole movie.
  const sample = [];
  for (let i = 0; i < d.frames.length; i += Math.max(1, (d.frames.length / 20000) | 0)) sample.push(d.frames[i]);
  sample.sort((a, b) => a - b);
  d.lo = sample[Math.floor(sample.length * 0.001)];
  d.hi = Math.max(d.lo + 1, sample[Math.min(sample.length - 1, Math.floor(sample.length * 0.999))]);
  movie = d;
  const cvm = document.getElementById('mv_cv');
  cvm.width = d.w; cvm.height = d.h;
  const scale = Math.max(1, Math.floor(384 / Math.max(d.w, d.h)));
  cvm.style.width = d.w * scale + 'px'; cvm.style.height = d.h * scale + 'px';
  const sl = document.getElementById('mv_slider');
  sl.max = d.n - 1; sl.value = 0;
  const what = /(^| )modality=2( |$)/.test(d.spec || '') ? 'BrightField (transmitted light)' : d.dyes > 0 ? `WideField${d.gpu ? ' (' + (d.gpu === 'CPU' ? 'CPU' : 'GPU: ' + d.gpu) + ')' : ''}, ${d.dyes} dyes, t½ ${d.halfMs < 0 ? '∞' : (d.halfMs / 1000).toFixed(1) + ' s'}`
                           : `${d.blinks} blinks`;
  document.getElementById('mv_info').textContent =
    `${d.n} frames ${d.w}x${d.h}, ${what}, ${(d.ms / 1000).toFixed(1)} s, display ${d.lo}-${d.hi} ADU`;
  document.getElementById('movie').style.display = 'block';
  showMovieFrame(0);
  requestDraw();
}
// One ImageData per movie size and a grey LUT per display range (the same ADU -> byte
// mapping as before: ImageData's round-half-to-even clamp), written through a 32-bit view.
let movieImg = null, movieU32 = null, movieLut = null, movieLutKey = '';
const PIX_LE = new Uint8Array(new Uint32Array([1]).buffer)[0] === 1;
function showMovieFrame(f) {
  const d = movie, cvm = document.getElementById('mv_cv'), g = cvm.getContext('2d');
  if (!movieImg || movieImg.width !== d.w || movieImg.height !== d.h) {
    movieImg = g.createImageData(d.w, d.h);
    movieU32 = new Uint32Array(movieImg.data.buffer);
  }
  const lutKey = d.lo + '|' + d.hi;
  if (movieLutKey !== lutKey) {
    movieLut = new Uint32Array(65536);
    const k = 255 / (d.hi - d.lo);
    for (let a = 0; a < 65536; a++) {
      const v = Math.max(0, Math.min(255, (a - d.lo) * k)), fl = Math.floor(v);
      const b = fl + 0.5 < v ? fl + 1 : v < fl + 0.5 ? fl : (fl & 1) ? fl + 1 : fl; // Uint8ClampedArray's rounding
      movieLut[a] = PIX_LE ? (0xff000000 | (b << 16) | (b << 8) | b) >>> 0 : ((b << 24) | (b << 16) | (b << 8) | 0xff) >>> 0;
    }
    movieLutKey = lutKey;
  }
  const px = d.w * d.h, off = f * px, fr = d.frames, u32 = movieU32, lut = movieLut;
  for (let i = 0; i < px; i++) u32[i] = lut[fr[off + i]];
  g.putImageData(movieImg, 0, 0);
  document.getElementById('mv_fno').textContent = `${f + 1}/${d.n}`;
}
function toggleMoviePlay() {
  const b = document.getElementById('mv_play'), sl = document.getElementById('mv_slider');
  if (movieRaf) { cancelAnimationFrame(movieRaf); movieRaf = 0; b.textContent = '▶'; return; }
  b.textContent = '❚❚';
  const ms = Math.max(30, +document.getElementById('mv_exposure-ms').value);
  movieLast = performance.now(); movieAcc = 0;
  const tick = now => {
    if (!movie) { movieRaf = 0; return; }
    movieAcc += now - movieLast; movieLast = now;
    if (movieAcc >= ms) {
      const steps = Math.floor(movieAcc / ms);
      movieAcc -= steps * ms;
      sl.value = (+sl.value + steps) % movie.n;
      showMovieFrame(+sl.value);
    }
    movieRaf = requestAnimationFrame(tick);
  };
  movieRaf = requestAnimationFrame(tick);
}
// Little-endian baseline TIFF: one uncompressed 16-bit grey page per frame,
// the spec in the first page's ImageDescription (the cli writes the same layout).
function writeTiff16(frames, w, h, n, desc) {
  const enc = new TextEncoder().encode(desc + '\0'), px = w * h;
  const entries = p => (p === 0 ? 10 : 9), ifdBytes = p => 2 + 12 * entries(p) + 4;
  let size = 8;
  for (let p = 0; p < n; p++) size += px * 2 + (p === 0 ? enc.length + (enc.length & 1) : 0) + ifdBytes(p);
  const buf = new ArrayBuffer(size), dv = new DataView(buf), u8 = new Uint8Array(buf);
  dv.setUint16(0, 0x4949, true); dv.setUint16(2, 42, true);
  let pos = 8, link = 4;
  for (let p = 0; p < n; p++) {
    const data = pos;
    for (let i = 0; i < px; i++) dv.setUint16(pos + 2 * i, frames[p * px + i], true);
    pos += px * 2;
    let descOff = 0;
    if (p === 0) { descOff = pos; u8.set(enc, pos); pos += enc.length + (enc.length & 1); }
    dv.setUint32(link, pos, true);
    const E = [[256, 4, 1, w], [257, 4, 1, h], [258, 3, 1, 16], [259, 3, 1, 1], [262, 3, 1, 1]];
    if (p === 0) E.push([270, 2, enc.length, descOff]);
    E.push([273, 4, 1, data], [277, 3, 1, 1], [278, 4, 1, h], [279, 4, 1, px * 2]);
    dv.setUint16(pos, E.length, true); pos += 2;
    for (const [tag, type, count, value] of E) {
      dv.setUint16(pos, tag, true); dv.setUint16(pos + 2, type, true); dv.setUint32(pos + 4, count, true);
      if (type === 3) dv.setUint16(pos + 8, value, true); else dv.setUint32(pos + 8, value, true);
      pos += 12;
    }
    link = pos; dv.setUint32(pos, 0, true); pos += 4;
  }
  return new Blob([buf], { type: 'image/tiff' });
}
function saveMovieTiff(e) {
  e.preventDefault();
  if (!movie) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(writeTiff16(movie.frames, movie.w, movie.h, movie.n, 'insiliscope viewer ' + movie.spec));
  a.download = `insiliscope_${movie.w}x${movie.h}x${movie.n}.tif`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
// Outline of the movie's FOV on the map while the player is open.
function drawMovieFov() {
  if (!movie || document.getElementById('movie').style.display === 'none') return;
  const [x0, y0, x1, y1] = movie.rect, [ax, ay] = project(x0, y0, 0), [bx, by] = project(x1, y1, 0);
  ctx = ctxTop;
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(1, devicePixelRatio);
  ctx.setLineDash([6, 4]); ctx.strokeRect(ax, ay, bx - ax, by - ay); ctx.setLineDash([]);
}
document.getElementById('mv_make').addEventListener('click', makeMovie);
document.getElementById('mv_psf-model').addEventListener('change', e => {
  document.getElementById('mv_psf-zernike-preset').disabled = e.target.value === '0';
});
document.getElementById('mv_play').addEventListener('click', toggleMoviePlay);
document.getElementById('mv_slider').addEventListener('input', e => { if (movie) showMovieFrame(+e.target.value); });
document.getElementById('mv_save').addEventListener('click', saveMovieTiff);
document.getElementById('mv_close').addEventListener('click', e => {
  e.preventDefault(); document.getElementById('movie').style.display = 'none';
  if (movieRaf) toggleMoviePlay();
  requestDraw();
});

window.addEventListener('resize', resizeCanvas);
syncLabels();
if (/[?&]nw/.test(location.search)) startMainEngine(); // ?nw runs the core on the main thread (for testing)
else initGenWorkers();
setLayerMode(!/[?&]2d/.test(location.search) && initGl()); // ?2d forces the 2D fallback (for testing)
resizeCanvas();
</script>
</body>
</html>
