<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inSiliScope viewer</title>
<!-- Link previews (LinkedIn, X, Slack, ...): social.jpg is web/social.jpg, copied to the site root by tools/build_site.sh. -->
<meta name="description" content="A simulated fluorescence microscope in your browser: synthetic cells and DNA-origami nanorulers in 3D, imaged live with realistic dyes, optics and camera noise (dSTORM, PALM, DNA-PAINT, widefield, brightfield). Also a Micro-Manager device adapter.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="inSiliScope">
<meta property="og:title" content="inSiliScope: a simulated fluorescence microscope">
<meta property="og:description" content="Fly through synthetic cells in 3D and image them live with realistic dyes, optics and camera noise, in the browser or in Micro-Manager.">
<meta property="og:url" content="https://kjamartens.github.io/inSiliScope/">
<meta property="og:image" content="https://kjamartens.github.io/inSiliScope/social.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A synthetic cell in 3D: microtubules, nucleus and nuclear pores">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="https://kjamartens.github.io/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="https://kjamartens.github.io/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://kjamartens.github.io/apple-touch-icon.png">
<style>
  /* UI styles: one DOM, themed by body[data-ui-style] (compact | focus | light). A new style is one block of tokens
     below plus one entry in UI_STYLES (uiSchema script; oneOpen: only one group open at a time). The canvas area and its overlays stay dark in every style. */
  :root{--side-w:380px;--lab-w:116px;--lab-w-base:116px;--val-w:68px;--bg:#040507;--panel:#141b25;--border:#36414f;--text:#eef2f7;--muted:#adb8c8;--accent:#559ded;
    --link:#9cc6f2;--in-bg:#1f2836;--in-border:#4a576c;--grp-bg:transparent;--grp-head:transparent;--tip-bg:#222c39;
    --row-gap:4px;--fs:12px;--radius:6px;--guide:#46546a}
  body[data-ui-style=focus]{--panel:#0f141b;--border:#26303d;--grp-bg:#161d27;--grp-head:#1b2430;--accent:#5aa9e6;--guide:#3a4a60}
  body[data-ui-style=light]{--panel:#f5f6f8;--border:#d9dde3;--text:#1f2329;--muted:#5d6672;--accent:#4051b5;
    --link:#4051b5;--in-bg:#fff;--in-border:#c4cad3;--tip-bg:#fff;--guide:#c4cad3}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
  /* Layout: the world view (left, with its View bar) | a splitter | the live microscope (right: the live camera with
     its controls beside it, then every setting). --live-w: the right panel's width (33-62 % of the window, dragged; 50 % by default). */
  #wrap{display:grid;grid-template-columns:minmax(0,1fr) 6px var(--live-w,50vw);height:100vh}
  #worldCol{display:flex;flex-direction:column;min-width:0;min-height:0}
  #viewBar{display:flex;align-items:center;gap:6px;padding:4px 8px;min-height:34px;box-sizing:border-box;background:var(--panel);border-bottom:1px solid var(--border);font-size:var(--fs);flex-wrap:wrap}
  #viewBar h1{font-size:14px;margin:0 6px 0 0;white-space:nowrap}
  #viewBar a.back{font-size:11px;color:var(--link);text-decoration:none;white-space:nowrap}
  #viewBar #mmLink{margin-right:20px}
  #viewBar .tagline{flex:1 1 0;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  #viewBar a.back:hover{text-decoration:underline}
  #viewBar .sp{flex:1}
  #viewBar button{padding:3px 8px}
  #viewBar button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--in-bg))}
  #viewPanel{pointer-events:auto;flex:0 1 auto;min-height:0;width:206px;--lab-w:76px;--val-w:44px;max-width:calc(100vw - 40px);overflow-y:auto;box-sizing:border-box;margin-top:4px;
    padding:4px 0 0;border-top:1px solid #232a35;color:var(--text);font-size:var(--fs)}
  #viewPanel[hidden]{display:none}
  #viewPanel{overflow-x:hidden;padding-left:7px!important}   /* room for the changed-row bar at the left */
  #viewPanel .opt.btnrow{flex-direction:column;gap:4px;align-items:stretch}
  #viewPanel .opt.btnrow button{flex:none;width:100%}
  .mapPick{position:relative;min-width:0}
  #viewPanel .opt:has(.mapPick){grid-template-columns:1fr;row-gap:2px}
  .mapBtn{width:100%;display:block;padding:2px 4px;text-align:left;background:var(--in-bg);border:1px solid var(--in-border);border-radius:4px;color:var(--text);cursor:pointer}
  .mapBtn::after{content:'▾';position:absolute;right:6px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:10px}
  .mapList{position:absolute;z-index:20;right:0;min-width:170px;top:calc(100% + 2px);max-height:260px;overflow-y:auto;background:var(--panel);border:1px solid var(--in-border);border-radius:4px;padding:2px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
  .mapList[hidden]{display:none}
  .mapItem{display:flex;align-items:center;gap:6px;padding:2px 4px;border-radius:3px;cursor:pointer;white-space:nowrap}
  .mapList .mapItem:hover{background:color-mix(in srgb,var(--accent) 20%,transparent)}
  .mapList .mapItem.sel{outline:1px solid var(--accent)}
  .mapItem .bar{flex:none;width:34px;height:9px;border-radius:2px;outline:1px solid rgba(255,255,255,.15)}
  .mapItem .nm{overflow:hidden;text-overflow:ellipsis;font-size:11px}
  #viewPanel .opt.pair:has(#zClipMin){align-items:start}
  #viewPanel .opt.pair:has(#zClipMin) .ctl{display:grid;grid-template-columns:26px auto 1fr;grid-template-rows:auto 1fr auto;column-gap:6px;row-gap:4px;height:74px}
  #viewPanel .opt.pair:has(#zClipMin) .dual{grid-column:1;grid-row:1 / 4;align-self:center;justify-self:center;width:70px!important;min-width:70px;flex:none;transform:rotate(-90deg)}
  #viewPanel #zClipMax{grid-column:2;grid-row:1}
  #viewPanel #zClipMin{grid-column:2;grid-row:3}
  #viewPanel .opt.pair:has(#zClipMin) .ctl .u{grid-column:3;grid-row:2;align-self:center;width:auto}
  #viewPanel button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--in-bg))}
  #viewPanel .opt.pair .ctl input[type=number]{width:40px}
  #viewPanel .opt.gridrow{grid-template-columns:1fr}
  #viewPanel .opt.gridrow>label{margin-bottom:2px}
  #splitter{cursor:col-resize;background:var(--border);opacity:.6}
  #splitter:hover,#splitter.drag{background:var(--accent);opacity:1}
  #side{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);box-sizing:border-box;font-size:var(--fs)}
  #sideTop{position:relative;padding:6px 12px;border-bottom:1px solid var(--border)}
  #sideTop .bar{display:flex;align-items:center;gap:8px}
  #sideTop input[type=search]{flex:1;min-width:0;background:var(--in-bg);border:1px solid var(--in-border);color:var(--text);border-radius:4px;padding:3px 6px;font-size:var(--fs);font-family:inherit}
  .grp .opt.nomatch,.grp .kids.nomatch,.grp .subhead.nomatch{display:none!important}
  /* a setting that differs from its default: a thin accent bar at the row's left and a faint tint */
  #liveCtl .cfg .lab.changed{position:relative}
  #liveCtl .cfg .lab.changed::before{content:'';position:absolute;left:-5px;top:3px;bottom:3px;width:2px;border-radius:1px;background:color-mix(in srgb,var(--accent) 75%,transparent)}
  .opt.changed{position:relative;background:color-mix(in srgb,var(--accent) 6%,transparent);border-radius:2px}
  .opt.changed::before{content:'';position:absolute;left:-5px;top:2px;bottom:2px;width:2px;border-radius:1px;background:color-mix(in srgb,var(--accent) 75%,transparent)}
  /* a row the search matches: the whole line highlighted */
  .opt.hit{background:color-mix(in srgb,var(--accent) 22%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent);border-radius:3px}
  details.grp.nomatch-grp{display:none!important}
  /* The right side: a bar (Live / Snap / Record / fresh, the one-line info) level with the world view's View bar; under
     it the camera image (square) with the settings below it at the same width, and beside both the microscope's
     controls column (focus, configuration, illumination, display, performance), which scrolls, down to the bottom. */
  #liveBar{position:relative;display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--panel);border-bottom:1px solid var(--border);font-size:var(--fs);min-width:0}
  #liveBar>button,#lv_recWrap>button{padding:3px 8px;white-space:nowrap}
  /* Live: clearly a button to press (red outline, red play triangle); red when on; the same size as Stop */
  #lv_live{width:74px;border:1px solid #e5484d!important;font-weight:600}
  #lv_live .ico{color:#e5484d}
  #lv_live.on,#lv_rec.on{border-color:#e5484d;background:#b3261e;color:#fff}
  #lv_live.on .ico{color:#fff}
  #lv_recWrap{position:relative;display:inline-block}
  /* one line, always (reserved before the first frame too); the full text in its tooltip */
  #lv_busy{flex:none;margin-left:4px;font-size:11px;line-height:1.4;color:var(--accent);white-space:nowrap}
  #lv_busy[hidden]{display:none}
  #lv_busy+#lv_info{margin-left:2px}
  #lv_info{flex:1 1 auto;min-width:0;margin-left:4px;font-size:11px;line-height:1.4;height:1.4em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #sideBody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--ctl-w,274px)}
  #sideMain{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--border)}
  #liveView{position:relative;flex:none;width:100%;aspect-ratio:1;background:#000;overflow:hidden}
  #lv_cv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;cursor:default;background:#000}
  #lv_scale,#lv_idle{position:absolute;color:#dfe6ee;font-size:11px;pointer-events:none;text-shadow:0 0 3px #000}
  #lv_perfNote{font-size:10px;line-height:1.35;color:var(--muted);margin-bottom:3px;overflow-wrap:anywhere}
  #lv_perfNote:empty{display:none}
  #lv_perfOut{font-size:10px;line-height:1.35;color:var(--muted);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px}
  #lv_perfOut .tot{color:var(--text);font-weight:600}
  #lv_perfOut .sub{padding-left:8px}
  #lv_perfOut span:nth-child(2n){text-align:right;font-variant-numeric:tabular-nums}
  input[readonly]{opacity:.75;cursor:default}
  #lv_scale{bottom:6px;right:8px;text-align:center}
  /* the zoom inset: the image's outline, the part shown, the factor */
  #lv_zoomNav{position:absolute;top:6px;left:6px;z-index:2;width:44px;height:44px;border:1px solid rgba(255,255,255,.55);background:rgba(10,14,20,.55);cursor:pointer;border-radius:2px}
  #lv_zoomNav[hidden]{display:none}
  #lv_zoomNav i{position:absolute;border:1px solid #fff;box-sizing:border-box;min-width:2px;min-height:2px}
  #lv_zoomNav span{position:absolute;left:calc(100% + 5px);top:50%;transform:translateY(-50%);color:#dfe6ee;font-size:11px;text-shadow:0 0 3px #000;white-space:nowrap}
  /* a finished recording plays in the live view: play/pause, position, Save, close */
  #lv_play{position:absolute;left:6px;right:6px;bottom:6px;z-index:3;display:flex;align-items:center;gap:5px;padding:4px 6px;
    background:rgba(10,14,20,.78);border:1px solid var(--border);border-radius:var(--radius);font-size:11px;color:#dfe6ee}
  #lv_play[hidden]{display:none}
  #lv_play input[type=range]{flex:1 1 auto;min-width:40px}
  #lv_play button{padding:2px 7px;white-space:nowrap}
  #lv_playN{font-variant-numeric:tabular-nums;white-space:nowrap}
  #liveView.playing #lv_scale{bottom:40px}
  #lv_scale i{display:block;height:3px;background:#fff;margin-top:2px}
  #lv_idle{inset:0;display:flex;align-items:center;justify-content:center;color:#8b97a8;font-size:12px;text-align:center;padding:12px}
  #lv_idleLive{pointer-events:auto;margin-left:4px;border:1px solid #e5484d;font-weight:600}
  #lv_idleLive .ico{color:#e5484d}
  #lv_idle [hidden]{display:none}
  .dots{display:inline-block;width:1.2em;text-align:left;font-style:normal}
  .dots::after{content:'.';animation:isc-dots 1.2s steps(1) infinite}
  @keyframes isc-dots{0%{content:'.'}33%{content:'..'}67%{content:'...'}}
  #liveCtl{min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:6px;padding:6px;
    --lab-w:78px;--lab-w-base:78px;--val-w:44px}
  #liveCtl .opt input[type=number]{width:50px}
  /* every box of the column laid out as the Configuration: a muted name column, controls 24 px high, rows 3 px apart */
  #liveCtl select,#liveCtl input[type=number],#liveCtl input[type=text],#panel select,#panel input[type=number],#panel input[type=text]{height:24px;box-sizing:border-box}
  #liveCtl .opt,#panel .opt{gap:6px;margin:3px 0;min-height:24px}
  #liveCtl .opt .ctl select{max-width:none;width:100%}
  .opt.text:has(#zernCoeffs){grid-template-columns:1fr;row-gap:2px} .opt.text:has(#zernCoeffs)>.val{display:none}
  #zernCoeffs{width:100%;box-sizing:border-box;font:10px ui-monospace,Consolas,monospace}   /* (the 28 Zernike modes under their name) */
  #liveCtl .sub{font-size:10px;line-height:1.35}
  #liveCtl .opt .unit,#liveCtl .opt .u{font-size:10px}
  #liveCtl .lc{border:1px solid var(--border);border-radius:var(--radius);padding:5px 7px;flex:none}
  #liveCtl .lc[hidden]{display:none}
  #liveCtl .lc h5,#liveCtl details.grp>summary{margin:0 0 4px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  /* each box folds on a click on its title (open on every load); no arrow, no line under the title */
  #liveCtl .lc h5{cursor:pointer;user-select:none}
  #liveCtl .lc.shut>:not(h5){display:none}
  #liveCtl .lc.shut>h5,#liveCtl details.grp:not([open])>summary{margin-bottom:0}
  #liveCtl details.grp>summary::before{display:none}
  #liveCtl details.grp[open]>summary,body[data-ui-style=focus] #liveCtl details.grp[open]>summary{border-bottom:0;border-radius:0;background:none;color:var(--muted)}
  body[data-ui-style=focus] #liveCtl details.grp[open]{border:0;background:none}
  /* a settings group moved into the column (Illumination & light path): the column's look */
  #liveCtl details.grp{border:0;margin:0;background:none}
  #liveCtl details.grp>summary{padding:0;background:none;cursor:pointer}
  #liveCtl details.grp>.body{padding:0}
  #liveCtl canvas#specPlot{max-width:100%!important}
  /* the laser rows of Illumination & light path: a slider beside the number, as the Configuration had */
  #liveCtl .opt.number:has(>.ctl.lsl){grid-template-columns:var(--lab-w) minmax(0,1fr) var(--val-w)}
  #liveCtl .ctl.lsl{display:flex;gap:4px;align-items:center}
  #liveCtl .ctl.lsl input[type=range]{flex:1 1 auto;min-width:0;width:0}
  /* the spectra plot enlarged (click it) */
  #specBig{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
  #specBig[hidden]{display:none}
  #specBig>div{position:relative;width:min(92vw,900px);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  #specBig canvas{display:block;width:100%;height:auto}
  #specBig .sub{font-size:12px;color:var(--muted);line-height:1.45;margin-top:8px}
  #specBig .specLegend{display:flex;flex-wrap:wrap;gap:3px 16px;margin-top:8px;font-size:12px;color:var(--text)}
  #specBig .specLegend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  #specBig button{position:absolute;top:6px;right:8px;padding:2px 8px}
  #lv_recPop{position:absolute;z-index:20;left:0;top:calc(100% + 4px);width:230px;display:flex;flex-direction:column;gap:5px;padding:7px 8px;
    border:1px solid var(--border);border-radius:var(--radius);background:var(--panel,var(--in-bg));box-shadow:0 4px 14px rgba(0,0,0,.35)}
  #lv_recPop[hidden]{display:none}
  #lv_recPop .recrow{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
  #lv_recPop .recrow input[type=number]{width:72px}
  #lv_recPop .recrow button{margin-left:auto;padding:3px 10px}
  #liveCtl .zrow,#liveCtl .crow{display:flex;align-items:center;gap:4px;margin:2px 0;white-space:nowrap}
  #liveCtl .zrow input[type=number]{width:46px}
  #liveCtl .zrow #lv_z{width:70px}
  #liveCtl .zrow label{margin-left:4px}
  #liveCtl .crow input[type=number]{width:50px}
  #liveCtl .crow label,#liveCtl .zrow label{color:var(--muted);white-space:nowrap}
  #liveCtl .cfg{display:grid;grid-template-columns:var(--lab-w) minmax(0,1fr);gap:3px 6px;align-items:center}
  #liveCtl .cfg select{width:100%}
  #liveCtl .cfg input[type=range]{width:100%}
  /* every Configuration row the same height, so the Exposure row (moved into the grid by mm_config_ui.js) lines up */
  #liveCtl .cfg .expv{display:flex;align-items:center;gap:4px}
  #lv_exp{width:62px}
  #liveCtl .cfg .lab{display:flex;min-width:0}
  #liveCtl .cfg .lab label{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #liveCtl .cfg .lab label[data-tip]:hover{color:var(--accent)}
  #liveCtl .note{font-size:10.5px;color:var(--muted)}
  #lv_hist{display:block;width:100%;height:56px;margin-top:4px;cursor:ew-resize;touch-action:none}
  #panel{flex:1;overflow-y:auto;padding:4px 12px 12px;min-height:0}
  #side p.sub{font-size:11px;color:var(--muted);margin:6px 0;line-height:1.4}
  #side p.sub a{color:var(--link)}
  input[type=number],input[type=text],select{background:var(--in-bg);border:1px solid var(--in-border);color:var(--text);border-radius:4px;padding:2px 4px;font-size:var(--fs);font-family:inherit;box-sizing:border-box}
  input[type=number]{width:64px;-moz-appearance:textfield;appearance:textfield}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  /* the focus keeps its arrows (they step by the step size) */
  #lv_z{-moz-appearance:auto;appearance:auto}
  #lv_z::-webkit-inner-spin-button{-webkit-appearance:inner-spin-button}
  input[type=range],input[type=checkbox]{accent-color:var(--accent)}
  input[type=range]{-webkit-appearance:none;appearance:none;height:14px;margin:0;background:none;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p,0%),var(--in-border) var(--p,0%))}
  input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--in-border)}
  input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-4px;border-radius:50%;background:var(--accent);border:2px solid var(--panel)}
  input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--panel)}
  input[type=range]:disabled{opacity:.5;cursor:default}
  button{background:var(--in-bg);border:1px solid var(--in-border);color:var(--text);border-radius:4px;padding:5px 8px;font-size:var(--fs);cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--accent)}
  /* hamburger menu */
  #menuBtn{font-size:16px;line-height:1;padding:3px 8px}
  #menu{display:none;position:absolute;right:8px;top:100%;z-index:20;margin-top:4px;min-width:210px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 10px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  #menu.open{display:block}
  #menu h4{margin:6px 0 4px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  #menu label{display:block;margin:3px 0;cursor:pointer}
  #menu .btns{display:flex;gap:6px;margin-top:8px}
  #menu .btns button{flex:1;padding:3px 6px}
  #menu .note{font-size:11px;color:var(--muted);margin-top:6px}
  /* groups and sections */
  .sect{margin:12px 0 2px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  details.grp{border:1px solid var(--border);border-radius:var(--radius);margin:6px 0;background:var(--grp-bg)}
  details.grp>summary{cursor:pointer;padding:5px 8px;font-weight:600;list-style:none;display:flex;align-items:center;gap:6px;background:var(--grp-head);border-radius:var(--radius)}
  details.grp>summary::-webkit-details-marker{display:none}
  details.grp>summary::before{content:'▸';color:var(--muted);font-size:10px;transition:transform .12s}
  details.grp[open]>summary::before{transform:rotate(90deg)}
  details.grp[open]>summary{border-bottom:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0}
  details.grp .body{padding:4px 8px 6px}
  /* focus: the one open group carries the accent: its title in the accent colour, its box a faint tint of it */
  body[data-ui-style=focus] details.grp[open]{border-color:color-mix(in srgb,var(--accent) 45%,var(--border));background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  body[data-ui-style=focus] details.grp[open]>summary{color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel));border-bottom-color:color-mix(in srgb,var(--accent) 35%,var(--border))}
  body[data-ui-style=focus] details.grp[open]>summary::before{color:var(--accent)}
  /* the settings under the image: boxes as in the controls column (a small muted title, no arrow, no line or
     background under it); every group open on load, a click on the title folds it */
  #panel details.grp,body[data-ui-style=focus] #panel details.grp[open]{border:1px solid var(--border);background:none;padding:5px 7px;margin:6px 0}
  #panel details.grp>summary,body[data-ui-style=focus] #panel details.grp[open]>summary{padding:0;margin:0 0 4px;background:none;border:0;border-radius:0;
    font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  #panel details.grp:not([open])>summary{margin-bottom:0}
  #panel details.grp>summary::before{display:none}
  #panel details.grp>.body{padding:0}
  /* the title sits in the box's top line (as a fieldset's legend): the line stops either side of it; the boxes keep room
     above for it */
  #liveCtl .lc>h5,#liveCtl .lc>details.grp>summary,#panel details.grp>summary{width:fit-content;max-width:calc(100% - 4px);box-sizing:border-box;
    line-height:13px;margin-top:-12px!important;margin-left:-4px!important;padding:0 4px!important;background:var(--panel)!important}
  #liveCtl{gap:12px;padding-top:12px}
  #panel details.grp,body[data-ui-style=focus] #panel details.grp[open]{margin:12px 0 6px}
  #liveCtl .lc.shut,#liveCtl .lc:has(>details.grp:not([open])),#panel details.grp:not([open]){padding-bottom:3px}
  #panel .sect{font-size:11px;color:var(--text);margin-top:14px}
  /* one option = one line: label (help on hover) | control | value + unit */
  .opt{display:grid;grid-template-columns:var(--lab-w) minmax(0,1fr) var(--val-w);align-items:center;gap:6px;margin:var(--row-gap) 0}
  .opt .lab{display:flex;align-items:center;gap:4px;min-width:0}
  .opt .lab label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
  .opt .ctl{display:flex;align-items:center;gap:4px;justify-content:flex-end}
  .opt .ctl input[type=range]{width:100%;min-width:0}
  .opt .ctl select{max-width:150px}
  .opt .val{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
  .opt .val b{color:var(--text);font-weight:500}
  .opt.wide{grid-template-columns:1fr}
  .opt.wide button{width:100%}
  #panel .opt.wide button,#liveCtl .opt.wide button{height:24px;padding-top:0;padding-bottom:0}
  #reseed{height:22px;padding:0 8px;font-size:11px}
  .opt.check{grid-template-columns:minmax(0,1fr) auto}
  /* rows without a value (select, preset, checkbox): no empty cell, which would wrap onto a second grid row */
  .opt>.val:empty{display:none}
  .opt.select,.opt.preset{grid-template-columns:var(--lab-w) minmax(0,1fr)}
  .opt.number{grid-template-columns:var(--lab-w) auto minmax(0,1fr)}
  .opt.number .ctl{justify-content:flex-start}
  .opt.select select,.opt.preset select{width:100%;max-width:none}
  .opt .val .u{font-size:.9em}
  .opt.pair .ctl input[type=number]{width:52px;flex:none;padding:2px 3px}
  .opt.pair .ctl .dual{flex:1;min-width:30px;width:auto}
  .opt.pair .ctl{grid-column:2 / 4}
  .opt.pair .ctl .u{flex:none;width:calc(var(--val-w) - 26px);padding-left:2px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .opt.pair .val{display:none}
  .opt.hasSide{grid-template-columns:var(--lab-w) minmax(0,1fr) minmax(34px,auto) auto}
  .opt label.side{display:flex;align-items:center;gap:2px;justify-self:end;color:var(--muted);white-space:nowrap;cursor:pointer}
  .opt label.side input{margin:0}
  label[data-tip],.subhead [data-tip]{cursor:help}
  label[data-tip]:hover,.subhead [data-tip]:hover{color:var(--accent)}
  #tip{position:fixed;z-index:50;display:none;max-width:280px;background:var(--tip-bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:11.5px;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.35);pointer-events:none}
  #tip code{font-size:10.5px;color:var(--muted)}
  /* preset children: indented under their preset with a guide line */
  .kids{margin-left:5px;padding-left:9px;border-left:2px solid var(--guide)}
  .kids .opt{--lab-w:calc(var(--lab-w-base) - 16px)}
  body[data-level=basic] .t-advanced,body[data-level=basic] .t-expert,body[data-level=advanced] .t-expert{display:none!important}
  #levelSeg{display:flex;border:1px solid var(--in-border);border-radius:var(--radius);overflow:hidden;flex:none}
  #levelSeg button{border:0;border-radius:0;padding:3px 8px;background:var(--in-bg);color:var(--muted);font-size:11px;cursor:pointer}
  #levelSeg button+button{border-left:1px solid var(--in-border)}
  #levelSeg button.on{background:color-mix(in srgb,var(--accent) 28%,var(--in-bg));color:var(--text)}
  /* sub-headings inside a group, button rows, checkbox grids, radio columns */
  .subhead{display:flex;align-items:center;gap:5px;margin:12px 0 4px;padding-bottom:2px;border-bottom:1px solid var(--border);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .body>.subhead:first-child{margin-top:4px}
  .opt.btnrow{display:flex;gap:6px}
  .opt.btnrow button{flex:1;padding:4px 6px;white-space:nowrap}
  .opt.gridrow{grid-template-columns:var(--lab-w) minmax(0,1fr);align-items:start}
  .opt.gridrow .cells{display:grid;grid-template-columns:1fr 1fr;column-gap:8px}
  .opt.gridrow .cells .opt.check{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:4px;margin:1px 0}
  .opt.gridrow .cells .opt .ctl{flex:none}
  .opt.radio{grid-template-columns:var(--lab-w) minmax(0,1fr);align-items:start}
  .opt.radio .lab{padding-top:1px}
  .radios{display:flex;flex-direction:column;gap:1px}
  .radios label{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .radios input{margin:0 3px 0 0;vertical-align:-2px}
  /* the data layers' status list */
  .dataStatus{margin:8px 0 4px;border:1px solid var(--border);border-radius:5px;padding:5px 8px;font-size:11px;line-height:1.35}
  .dataStatus:empty{display:none}
  .dataStatus .hd{color:var(--muted);margin-bottom:4px}
  .dataStatus .hd.q{margin:6px 0 2px;padding-top:4px;border-top:1px solid var(--border)}
  .dataStatus .st a{color:var(--link);text-decoration:none;margin-left:3px}
  .dataStatus .r{display:grid;grid-template-columns:14px minmax(0,1fr) auto;column-gap:4px;align-items:baseline;margin:3px 0}
  .dataStatus .r .st{font-variant-numeric:tabular-nums}
  .dataStatus .sub2,.dataStatus .bar{grid-column:2 / 4}
  .dataStatus .sub2{color:var(--muted);font-size:10.5px}
  .dataStatus .sub2 a{color:var(--link)}
  .dataStatus .bar{height:3px;margin-top:2px;background:var(--in-border);border-radius:2px;overflow:hidden}
  .dataStatus .bar>i{display:block;height:100%;background:var(--accent)}
  .dataStatus .r.ok .ic,.dataStatus .r.ok .st{color:#5fbf72}
  .dataStatus .r.run .ic,.dataStatus .r.run .st{color:var(--accent)}
  .dataStatus .r.fail .ic,.dataStatus .r.fail .st{color:#e06c6c}
  .dataStatus .r.off{opacity:.55}
  .dataStatus .ft{color:var(--muted);font-size:10px;margin-top:4px}
  /* two-knob range slider (two overlaid range inputs) */
  .dual{position:relative;width:96px;height:18px}
  .dual .track,.dual .fill{position:absolute;top:8px;height:3px;border-radius:2px}
  .dual .track{left:0;right:0;background:var(--in-border)}
  .dual .fill{background:var(--accent)}
  .dual input{position:absolute;left:0;top:0;width:100%!important;height:18px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
  .dual input[type=range]::-webkit-slider-runnable-track{background:none;height:18px}
  .dual input[type=range]::-moz-range-track{background:none}
  .dual input[type=range]::-moz-range-progress{background:none}
  .dual input[type=range]::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:12px;height:12px;margin-top:3px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);cursor:pointer}
  .dual input[type=range]::-moz-range-thumb{pointer-events:auto;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);cursor:pointer}
  /* Phones (body.mobile: a window at most 700 px wide, set by web/live/mobile.js): one column that scrolls with the
     page. The title bar, then (sticky, kept on screen) the square stage (#mStage) with the live image filling it and
     the world view as an inset in its top-right corner (.worldBig: the other way round; a tap on the inset swaps
     them) and the live bar under it in two lines, then the controls column, the search and the settings. Controls
     are finger-sized; inputs at 16 px, below which iOS zooms in on a focused field. */
  html:has(>body.mobile),body.mobile{overflow:auto}
  body.mobile{--fs:14px;--lab-w:112px;--lab-w-base:112px;--val-w:60px}
  body.mobile #wrap{display:block;height:auto}
  body.mobile #splitter{display:none}
  body.mobile #viewBar .tagline,body.mobile #viewBar .sp{display:none}
  body.mobile #viewBar{justify-content:space-between;gap:10px}
  body.mobile #viewBar #mmLink{margin:0 0 0 auto}
  body.mobile #viewBar a.back{font-size:12px}
  #mTop{position:sticky;top:0;z-index:10;background:var(--panel)}
  #mStage{position:relative;width:100%;aspect-ratio:1;background:#000;overflow:hidden}
  #mStage>#liveView,#mStage>#canvasHost{position:absolute;inset:0;width:auto;height:auto;aspect-ratio:auto;flex:none;overflow:hidden}
  #mStage>#canvasHost,#mStage.worldBig>#liveView,#mSwap{inset:6px 6px auto auto;width:37.5%;height:37.5%;z-index:5;box-sizing:border-box;
    border:1px solid rgba(255,255,255,.6);border-radius:4px}
  #mStage.worldBig>#canvasHost{inset:0;width:auto;height:auto;z-index:auto;border:0;border-radius:0}
  #mSwap{position:absolute;z-index:6;padding:0;background:none;border-color:transparent}
  #mStage:not(.worldBig)>#canvasHost :is(#hud,#legend,#animBar,#movie,#xzSplit,#loading),
  #mStage.worldBig>#liveView :is(#lv_idle,#lv_scale,#lv_zoomNav,#lv_play){display:none!important}
  #mFocus{display:none}
  body.mobile #mFocus{display:flex;align-items:center;gap:6px;margin:2px 0 4px;font-size:12px}
  body.mobile #lv_z,body.mobile #lv_z+.u{display:none}   /* the knob instead (its readout shows the height) */
  body.mobile #liveCtl .zrow{justify-content:flex-end}
  body.mobile #mFocus button{flex:none;width:40px;height:36px;padding:0;font-size:20px;line-height:1;touch-action:manipulation}
  #mKnob{flex:1 1 0;min-width:0;height:34px;cursor:ew-resize;touch-action:none}
  #mZ{flex:none;min-width:58px;text-align:right;color:var(--text);font-variant-numeric:tabular-nums}
  body.mobile #liveBar{flex-wrap:wrap;row-gap:4px;border-top:1px solid var(--border)}
  body.mobile #liveBar>button,body.mobile #lv_recWrap>button{padding:6px 10px}
  body.mobile #lv_live{width:84px}
  body.mobile #menuBtn{order:1;margin-left:auto;font-size:18px}
  body.mobile #liveBar::after{content:'';order:1;flex-basis:100%;height:0}
  body.mobile :is(#lv_busy,#lv_info,#levelSeg){order:2}
  body.mobile #lv_info{flex:1 1 0;margin-left:0}
  body.mobile #levelSeg button{padding:5px 9px;font-size:12px}
  body.mobile #menu{max-width:calc(100vw - 16px);box-sizing:border-box}
  body.mobile #sideBody{display:flex;flex-direction:column}
  body.mobile #sideMain{display:contents}
  body.mobile #liveCtl{order:1;overflow:visible;min-height:auto;--lab-w:112px;--lab-w-base:112px;--val-w:60px}
  body.mobile #sideTop{order:2;border-top:1px solid var(--border)}
  body.mobile :is(#panel,#animPanel){order:3;overflow:visible;min-height:auto}
  body.mobile :is(input[type=number],input[type=text],input[type=search],select){font-size:16px}
  body.mobile :is(#liveCtl,#panel) :is(select,input[type=number],input[type=text]),body.mobile #setSearch{height:32px}
  body.mobile :is(#liveCtl,#panel) .opt{min-height:32px}
  body.mobile #liveCtl .opt input[type=number],body.mobile #liveCtl .crow input[type=number]{width:68px}
  body.mobile #liveCtl .zrow #lv_z{width:84px}
  body.mobile #liveCtl .zrow #lv_zStep{width:60px}
  body.mobile .opt.pair .ctl input[type=number]{width:60px}
  body.mobile button{padding:6px 10px}
  body.mobile input[type=range]{height:28px}
  body.mobile input[type=range]::-webkit-slider-thumb{width:20px;height:20px;margin-top:-8px}
  body.mobile input[type=range]::-moz-range-thumb{width:18px;height:18px}
  body.mobile .dual{height:28px}
  body.mobile .dual .track,body.mobile .dual .fill{top:12px}
  body.mobile .dual input{height:28px}
  body.mobile .dual input[type=range]::-webkit-slider-runnable-track{height:28px}
  body.mobile .dual input[type=range]::-webkit-slider-thumb{width:20px;height:20px;margin-top:4px}
  body.mobile .dual input[type=range]::-moz-range-thumb{width:18px;height:18px}
  body.mobile :is(label,.subhead){-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  body.mobile #viewPanel{width:260px}
  body.mobile .mapList{max-width:calc(100vw - 24px)}
  body.mobile #movie{left:4px!important;right:4px!important;top:auto!important;bottom:4px!important;max-height:calc(100% - 8px);overflow:auto}
  body.mobile #mv_cv{max-width:100%;height:auto!important}
  body.mobile #legend{pointer-events:none}   /* a large part of the small view: its gestures go through it */
  .m-only{display:none}
  body.mobile .m-only{display:revert}
  #canvasHost{position:relative;min-height:0;flex:1}
  canvas{display:block;cursor:grab}
  #cv,#cvXZ,#lv_cv{touch-action:none}   /* their drags and pinches are the view's, not the page's */
  canvas.dragging{cursor:grabbing}
  /* Three stacked layers, all the same pixel size: #cvBase (grid + microtubules, 2D), #cvGl (cell bodies, WebGL2),
     #cv (nuclei + scale bar, 2D, the interactive one). #cvGl/#cvBase are display:none when WebGL2 is unavailable. */
  #cvBase{position:absolute;top:0;left:0;background:#05070a;pointer-events:none;z-index:0}
  #cvGl{position:absolute;top:0;left:0;pointer-events:none;z-index:1}
  #cv{position:relative;z-index:2;background:transparent}
  /* x-z side view: the bottom --xz-h of the canvas area (the three layers above shrink to the rest) */
  #cvXZ{position:absolute;left:0;bottom:0;display:none;background:#05070a;box-sizing:border-box;z-index:2}
  #xzSplit{position:absolute;left:0;right:0;height:9px;bottom:calc(var(--xz-h, 0px) - 4px);z-index:4;display:none;cursor:ns-resize;touch-action:none;
    background:linear-gradient(transparent 3px,#3a4454 3px,#3a4454 6px,transparent 6px)}
  #xzSplit:hover,#xzSplit.drag{background:linear-gradient(transparent 3px,var(--accent) 3px,var(--accent) 6px,transparent 6px)}
  #canvasHost.xz #legend{bottom:calc(var(--xz-h) + 8px)}
  #hud,#legend,#movie{z-index:3;color:#dfe6ee}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:4;pointer-events:none;font-size:14px;color:#8b97a8;background:#05070a}
  #loading.err{pointer-events:auto;color:#eef2f7;line-height:1.6;padding:0 24px;text-align:center}
  #loading.err a{color:#9cc6f2}
  #movie{position:absolute;bottom:8px;right:8px;display:none;z-index:4;background:rgba(10,13,18,.94);border:1px solid #232a35;border-radius:6px;padding:6px;font-size:11px}
  #movie .t{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:3px 0}
  #movie .t.drag{cursor:move;user-select:none}
  #movie a{color:#8bb8e8}
  #movie button{background:#1a212b;border-color:#2c3644;color:#dfe6ee}
  #mv_cv{display:block;image-rendering:pixelated;cursor:default;background:#000}
  /* the world view's info box, one column: the View button, where the view is, notes; the View options open in it */
  #hud{position:absolute;top:8px;left:8px;font-size:11px;background:rgba(10,13,18,.78);border:1px solid #232a35;border-radius:6px;padding:6px 9px;line-height:1.5;pointer-events:none;
    display:flex;flex-direction:column;align-items:flex-start;max-height:calc(100% - 16px);box-sizing:border-box}
  #canvasHost.xz #hud{max-height:calc(100% - var(--xz-h) - 16px)}
  #hudText{white-space:pre;margin-top:4px}
  #hud:has(#viewPanel:not([hidden])){background:rgba(10,13,18,.94);z-index:5}
  /* the View group in the box: no box or title of its own */
  #viewPanel details.grp,body[data-ui-style=focus] #viewPanel details.grp[open]{border:0;background:none;margin:0}
  #viewPanel details.grp>summary{display:none}
  #viewPanel details.grp>.body{padding:0}
  #hud #viewBtn{pointer-events:auto;padding:2px 8px}
  #hud #viewBtn.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 18%,var(--in-bg))}
  #legend{position:absolute;bottom:8px;left:8px;max-width:calc(100% - 150px);font-size:11px;background:rgba(10,13,18,.7);border:1px solid #232a35;border-radius:6px;padding:6px 9px;line-height:1.5}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  /* sidebar tabs: the settings panel and the animation editor (web/anim/editor.js styles its own panel) */
  #tabs{display:flex;gap:4px;margin-top:8px}
  #tabs[hidden]{display:none}   /* shown by the menu's "Show animation pane (beta)" (web/anim/editor.js) */
  #tabs button{flex:1;padding:4px 6px;border-radius:5px 5px 0 0;border-bottom:none;color:var(--muted)}
  #tabs button.on{color:var(--text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--in-bg))}
  #animPanel{flex:1;overflow-y:auto;padding:4px 12px 12px;min-height:0}
  #animBar{position:absolute;left:0;right:0;bottom:0;height:46px;display:none;z-index:3;box-sizing:border-box}
</style>
</head>
<body>
<div id="wrap">
  <div id="worldCol">
  <div id="viewBar">
    <h1>inSiliScope</h1>
    <span class="tagline" title="Synthetic cells and DNA-origami nanorulers, imaged live with realistic dyes, optics and camera noise. Drag to pan, wheel to zoom, Shift-drag to tilt; the live camera on the right starts by itself (■ Stop stops it).">a simulated fluorescence microscope &middot; drag, zoom, Shift-drag to tilt</span>
    <span class="sp"></span>
    <a id="mmLink" class="back" target="_top" data-umami-event="link" data-umami-event-to="micro-manager" href="https://kjamartens.github.io/inSiliScope/docs/micro-manager/" title="The Micro-Manager adapter: download and getting started">Micro-Manager &rarr;</a>
    <a id="docsLink" class="back" target="_top" data-umami-event="link" data-umami-event-to="docs" href="https://kjamartens.github.io/inSiliScope/docs/" title="Documentation: quickstart, samples, physics, gallery">Docs &rarr;</a>
  </div>
  <div id="canvasHost">
    <canvas id="cvBase"></canvas>
    <canvas id="cvGl"></canvas>
    <canvas id="cv"></canvas>
    <canvas id="cvXZ"></canvas>
    <div id="hud"><button id="viewBtn" title="What the world view draws: camera angle, layers, z clip" aria-expanded="false">View ▾</button><div id="hudText"></div><div id="viewPanel" hidden></div></div>
    <div id="loading">Loading the cell field (WebAssembly core, packing cells)…</div>
    <div id="movie"><div class="t drag" title="Drag to move the player"><span id="mv_info"></span><span><a href="#" id="mv_save">save TIFF</a> &nbsp; <a href="#" id="mv_gif" title="The movie as shown (display range), scaled up to at least 512 px">GIF</a> &nbsp; <a href="#" id="mv_mp4" title="The movie as shown (display range), scaled up to at least 512 px; WebM where the browser cannot encode H.264">MP4</a> &nbsp; <a href="#" id="mv_close">close</a></span></div>
      <canvas id="mv_cv"></canvas>
      <div class="t"><button id="mv_play">▶</button><input type="range" id="mv_slider" min="0" max="0" value="0" style="flex:1"><span id="mv_fno"></span></div></div>
    <div id="animBar"></div>
    <div id="legend"></div>
    <div id="xzSplit" title="Drag to resize the x-z view (down to hide it); double-click: fit it to the cells again"></div>
  </div>
  </div>

  <div id="splitter" title="Drag to resize the microscope panel"></div>

  <div id="side">
    <!-- The live microscope: its bar (level with the View bar), the camera image at the stage position (= the world
         view's centre) with the settings under it, and the controls column beside them. -->
    <div id="liveBar">
      <button id="lv_live" title="Live: the camera images the sample at the stage position frame after frame; light reaching the sample bleaches and converts its dyes (the sample's history), as in Micro-Manager's live mode"><span class="ico">▶</span> Live</button>
      <button id="lv_snap" title="Snap: one frame">Snap</button>

<script id="uiPanel">

// The Randomize button sits small in the Seed row (in place of its unit), not on a row of its own.
{

// this project's own reference imagery -- makes the nucleus's 3D-ness legible
// at a glance instead of just being a flat-shaded blob.

const MT_STOPS = [[0.35, 0.45, 1], [0.2, 0.75, 1], [0.3, 0.95, 0.8], [0.55, 1, 0.5]];

const LINE_MAPS = {
  rainbow: DEPTH_STOPS, cool: MT_STOPS, warm: PORE_STOPS,
  viridis: [[0.23, 0.32, 0.55], [0.13, 0.57, 0.55], [0.37, 0.79, 0.38], [0.99, 0.91, 0.14]],
  plasma: [[0.62, 0.2, 0.78], [0.84, 0.34, 0.56], [0.98, 0.58, 0.3], [0.94, 0.98, 0.13]],

// Standard marching squares, generalised to the polar (ring, theta-index)
// mesh above: theta wraps around (i+1 mod n), ring does not. Returns
// segments in whatever frame the mesh itself is in (local, per
// buildCytoMesh) with z = the iso-level (contour height) -- the caller
// translates by c.x,c.y before projecting.
// Reads the mesh's interleaved vertex array (x, y, h at 3*(k*n + i)); returns a flat
// array of x1, y1, x2, y2, level per segment.
function marchingSquaresContours(mesh, levels) {
  const { rings, n, flat: f } = mesh;
  const segs = [], corner = [0, 0, 0, 0], px = [0, 0], py = [0, 0];
  for (let k = 0; k < rings; k++) {
    for (let i = 0; i < n; i++) {
      const i2 = (i + 1) % n;
      // the quad's corners p00, p10, p11, p01; edges (c, c+1 mod 4) in that order
      corner[0] = 3 * (k * n + i); corner[1] = 3 * (k * n + i2);
      corner[2] = 3 * ((k + 1) * n + i2); corner[3] = 3 * ((k + 1) * n + i);
      for (let l = 0; l < levels.length; l++) {
        const lvl = levels[l];
        let np = 0;
        for (let e = 0; e < 4; e++) {
          const a = corner[e], b = corner[(e + 1) & 3], ah = f[a + 2], bh = f[b + 2];

}

// ---- per-cell scene: geometry, depth order, 2D and WebGL2 painters -------------
// Depth order (issue 9). Everything translucent of one cell -- the cytoplasm surface quads, the nucleus surface
// quads, the footprint outline and the cytoplasm contour lines -- is painted back to front in ONE merged order
// (there is no z-buffer for translucent surfaces), and the cells are painted far to near (by their turned y:
// footprints do not overlap, so the farther cell is the one with the smaller turned y). Microtubules and dyes are
// opaque in a z-buffer on the GPU (drawn first, the translucent surfaces then depth-test against them); the 2D
// fallback paints each cell's microtubules under its own surfaces. Depth (nearness to the camera) is
// v*sin(tilt) + (z - pivot z)*cos(tilt), v the turned y (the camera, web/scene/core.js).
//
// Clipping (issue 11). Every primitive belongs to a layer kind (IscScene.KIND: cytoplasm surface, nucleus, outline,
// contours, microtubules, dyes). A frame's state gives each shown kind up to IV_MAX intervals along one axis, each
// with its own colour and opacity, plus a z range (the Z clip): the GPU tests them per fragment (GL_CLIP), so a sweep
// or a slider move is a uniform update and never touches a buffer; the 2D fallback tests per primitive.
//
// draw() runs on every pan/zoom event, so nothing here may redo work that a pan/zoom cannot change. Everything
// below hangs off the asset's `entry` (one per chunk): flat typed-array copies of the geometry (`render`), its
// depth order and the GPU buffers. The order depends only on the cell's effective rotation (packRot minus the
// view's rotation), the tilt and the contour step -- the cell's own translation adds the same constant to every
// primitive. While the view turns it is re-sorted per ORDER_Q of rotation or tilt: the detailed cells at once, the
// others within ORDER_BUDGET_MS per frame (the rest keep their last order a frame longer); an exact frame (export)
// always sorts at its true angle.
const NUC_PTS = 48, NUC_RINGS = 17;   // the plain-ellipsoid fallback (no rings from the engine)

// The nucleus surface rings in the cell's local frame (x, y, z per point, np points per ring, bottom pole to top
// pole): the engine's rings (asset.nuc) when it sends them, else the plain ellipsoid of the pack record.

  const xyz = new Float64Array(NUC_RINGS * NUC_PTS * 3), ct = Math.cos(c.nucRot), st = Math.sin(c.nucRot), rz = c.nucHeight / 2;

    for (let i = 0; i < NUC_PTS; i++) {

// Quads 0..nqC-1 are the cytoplasm mesh (vertices 0..nvC-1, vertex k*n + i), quads nqC..nq-1 the nucleus

// centre (local x, y, height).

// Line primitives: the footprint outline (the mesh's outer ring, nO segments) then the contour segments of `step`.

// Ids sorted by ascending depth (far first): a stable two-pass LSD radix sort of the depths quantised to 22 bits,
// so primitives within one quantum keep their id order (invisible).

// One cell in the frame's camera: its effective rotation (packRot - view rotation), the turned-frame offset of its

const rgba = ([r, g, b, a]) => `rgba(${r},${g},${b},${a})`;

// The dyes' colour, density and fluorescent fraction redraw the dye overlay.
for (const k of [...DYE_UI.targets.flatMap(t => [t.prefix + '-dye', t.prefix + '-label-pct', t.prefix + '-dye.fluorescent-pct']),

// The Sample select: a nanoruler world is looked at from much closer (the rods are 200 nm long), with its dyes on;

// ---- PSF preview (Objective & PSF, advanced) ----
// The kernel a movie uses and its splat (isc_scope_psf_preview = sim::MakeScopePsfPreview): each z plane oversampled (sum 1) beside the camera image of one emitter at a pixel
// centre, shown in the movie player; the slider is the emitter's defocus. A job for the movie worker (it shares the
// kernel memo with the movies and works from file:// pages), or the main-thread engine with ?nw.
let psfJob = null, psfJobId = 0;
function previewPsf() {
  const b = document.getElementById('psfPreview');
  b.textContent = 'Computing PSF…';
  psfJob = { id: ++psfJobId, spec: movieSpec(), na: 1.4, pixelNm: +document.getElementById('mv_pixel-nm').value,
    psf: document.getElementById('mv_psf-model').value === '0' ? 'Gaussian (no defocus)'
      : 'Gibson-Lanni + Zernike, ' + document.getElementById('mv_psf-zernike-preset').selectedOptions[0].textContent };
  const job = { type: 'psf', id: psfJob.id, spec: psfJob.spec };
  if (genWorkers.ok) genWorkers.dyes.postMessage(job);
  else if (mainEngine) setTimeout(() => Promise.resolve(mainEngine.handle(job, onPsfResult)).then(r => onPsfResult(r[0])), 0);
  else { b.textContent = 'Preview PSF'; alert('PSF preview: the workers are not ready yet.'); }
}
function onPsfResult(d) {
  if (!psfJob || d.id !== psfJob.id) return;
  const b = document.getElementById('psfPreview');
  if (d.type === 'psf-progress') { b.textContent = `Computing PSF ${Math.round(100 * d.frac)} %…`; return; }
  if (d.type !== 'psf') return;
  const job = psfJob;
  psfJob = null;
  b.textContent = 'Preview PSF';
  if (d.error) { alert('PSF preview failed: ' + d.error); return; }
  showPsfPreview(Object.assign(d, { title: job.psf, na: job.na, pixelNm: job.pixelNm }));
}
// The player shows the two panels side by side at the same scale: the kernel (os x os samples per camera pixel) and
// the camera pixels drawn os x os each; each panel scaled to its own peak in the plane shown.
function showPsfPreview(d) {
  if (movieRaf) toggleMoviePlay();
  const gap = 6, cw = d.camSize * d.oversampling;
  movie = { psf: d, n: d.nz, w: d.size + gap + cw, h: Math.max(d.size, cw), rect: null };
  const cvm = document.getElementById('mv_cv');
  cvm.width = movie.w; cvm.height = movie.h;
  const scale = Math.min(1, 768 / movie.w);
  cvm.style.width = Math.round(movie.w * scale) + 'px'; cvm.style.height = Math.round(movie.h * scale) + 'px';
  const sl = document.getElementById('mv_slider');
  sl.max = d.nz - 1; sl.value = (d.nz - 1) >> 1;
  document.getElementById('mv_save').style.display = 'none';
  document.getElementById('mv_info').textContent = `PSF: ${d.title}, ${d.lambdaNm} nm, NA ${d.na}. ` +
    `Left: kernel, ${d.oversampling}x oversampled (${(d.pixelNm / d.oversampling).toFixed(1)} nm); right: ${d.pixelNm} nm camera pixels, ` +
    `emitter at a pixel centre. Each scaled to its peak.`;
  document.getElementById('movie').style.display = 'block';
  showMovieFrame(+sl.value);
  requestDraw();
}
function showPsfPlane(f) {
  const d = movie.psf, W = movie.w, H = movie.h, g = document.getElementById('mv_cv').getContext('2d');
  const img = g.createImageData(W, H), u32 = new Uint32Array(img.data.buffer);
  const grey = v => { const b = Math.max(0, Math.min(255, Math.round(255 * v))); return PIX_LE ? (0xff000000 | (b << 16) | (b << 8) | b) >>> 0 : ((b << 24) | (b << 16) | (b << 8) | 0xff) >>> 0; };
  u32.fill(PIX_LE ? 0xff2a2018 : 0x18202aff);   // the gap and margins
  const panel = (data, n, rep, x0) => {
    let max = 0;
    for (let i = 0; i < n * n; i++) if (data[i] > max) max = data[i];
    const k = max > 0 ? 1 / max : 0, y0 = (H - n * rep) >> 1;
    for (let y = 0; y < n * rep; y++) for (let x = 0; x < n * rep; x++)
      u32[(y0 + y) * W + x0 + x] = grey(data[((y / rep) | 0) * n + ((x / rep) | 0)] * k);
  };
  panel(d.planes.subarray(f * d.size * d.size, (f + 1) * d.size * d.size), d.size, 1, 0);
  panel(d.cams.subarray(f * d.camSize * d.camSize, (f + 1) * d.camSize * d.camSize), d.camSize, d.oversampling, d.size + 6);
  g.putImageData(img, 0, 0);
  const zUm = (f - (d.nz - 1) / 2) * d.zStepNm / 1000;
  document.getElementById('mv_fno').textContent = d.gaussian ? 'in focus' : `z − focus = ${zUm >= 0 ? "+" : "−"}${Math.abs(zUm).toFixed(2)} µm`;
}
document.getElementById('psfPreview').addEventListener('click', previewPsf);

// ---- light path: spectra plot and detection readout (issue 16) ----
// From the movie's own setup (the setup job: the C++ light path and labels a movie uses): the dye's excitation and
// emission (and its pre state), the laser lines, the dichroic's and the emission filter's transmission and the camera
// QE; below, the detected fraction, effective wavelength and photons per second while ON.
let specTimer = 0;

// ---- the BFP position's readout: regime and depth (the setup job's excitation, as a movie uses it) ----
let bfpTimer = 0;
function scheduleBfpReadout() { clearTimeout(bfpTimer); bfpTimer = setTimeout(drawBfpReadout, 120); }
async function drawBfpReadout() {
  const out = document.getElementById('bfpReadout');
  if (!out) return;
  try {
    const ex = (await setupJob(movieSpec())).excitation;
    if (!ex) { out.textContent = ''; return; }
    const lit = self.ISC_DYE_DATA.lasers.filter(nm => +document.getElementById('mv_laser-' + nm).value > 0);
    const nm = lit.length ? lit[lit.length - 1] : 640, d = ex.depth_nm[nm];
    out.textContent = ex.regime + (ex.regime === 'TIRF' ? `: 1/e depth ${d.toFixed(0)} nm at ${nm} nm, field x${ex.field_factor.toFixed(2)}`
      : ex.regime === 'HILO' ? `: sheet ${(Math.asin(Math.min(1, ex.u)) * 180 / Math.PI).toFixed(0)}° from the axis in the medium` + (d > 0 ? `, ${(d / 1000).toFixed(1)} µm thick` : '')
      : ex.regime === 'Clipped' ? `: beyond the pupil edge (${ex.u_max.toFixed(3)}), no light` : ': the beam straight up');
  } catch (e) { out.textContent = ''; }
}
for (const k of ['mv_illum-bfp', 'mv_illum-profile', 'mv_illum-fwhm', 'mv_bf-n-medium', 'mv_size', 'mv_pixel-nm', ...self.ISC_DYE_DATA.lasers.map(nm => 'mv_laser-' + nm)])
  document.getElementById(k)?.addEventListener('input', scheduleBfpReadout);
scheduleBfpReadout();

// The spectra plot's colour of a wavelength (violet 400 nm .. red 700 nm, beyond it red): bright on the dark looks,
// darker on Light. The laser lines and the dye curves both use it, so every line has contrast (the library's emission
// colours can be very dark, Cy3B's is black); a dye's excitation and emission take the colour of its weighted
// emission wavelength (the emission spectrum's centroid).
// The hue follows the spectrum piecewise (400 violet, 450 blue, 490 cyan, 520 green, 570 yellow, 590 orange, >= 625 red).
const WAVE_HUE = [[400, 275], [450, 235], [490, 185], [520, 125], [570, 58], [590, 32], [625, 2]];
function waveColour(nm, light) {
  let hue = WAVE_HUE[WAVE_HUE.length - 1][1];
  if (nm <= WAVE_HUE[0][0]) hue = WAVE_HUE[0][1];
  else for (let i = 1; i < WAVE_HUE.length; i++) if (nm <= WAVE_HUE[i][0]) {
    const [a, ha] = WAVE_HUE[i - 1], [b, hb] = WAVE_HUE[i];
    hue = ha + (hb - ha) * (nm - a) / (b - a); break;
  }
  return light ? `hsl(${hue.toFixed(0)},85%,42%)` : `hsl(${hue.toFixed(0)},100%,${nm >= 625 ? 66 : 62}%)`;
}
const centroidNm = vals => { let s = 0, w = 0; for (let i = 0; i < vals.length; i++) { s += vals[i] * (300 + i); w += vals[i]; } return w > 0 ? s / w : 600; };
function scheduleSpecPlot() {
  clearTimeout(specTimer);
  specTimer = setTimeout(() => { drawSpecPlot(false); if (!document.getElementById('specBig').hidden) drawSpecPlot(true); }, 120);
}
// big: the enlarged plot (#specBig, click the small one), drawn at k = 2 (its canvas has twice the CSS pixels); the
// small one (laid out on 300 x 96) at the screen pixels it covers (k = its CSS width / 300 x devicePixelRatio, up to 4:
// sharp on a phone, the same size and look on the page).
const SPEC_W = 300, SPEC_H = 96;
async function drawSpecPlot(big) {
  const cv2 = document.getElementById(big ? 'specPlotBig' : 'specPlot'), out = document.getElementById(big ? 'specBigReadout' : 'specReadout');
  if (!cv2 || !cv2.offsetParent) return;
  const k = big ? 2 : Math.min(4, Math.max(1, (cv2.clientWidth || SPEC_W) / SPEC_W * (devicePixelRatio || 1)));
  if (!big && cv2.width !== Math.round(SPEC_W * k)) { cv2.width = Math.round(SPEC_W * k); cv2.height = Math.round(SPEC_H * k); }
  try {
    const S = await setupJob(movieSpec()), lp = S.light_path, AL = S.labels;
    const shown = DYE_UI.targets.filter(t => t.specimen === DYE_UI.specimen() && !AL[t.structure].off).map(t => [t, AL[t.structure]]);
    const g = cv2.getContext('2d'), W = cv2.width, H = cv2.height, x0 = 350, x1 = 800, top = 8 * k, bot = H - 16 * k;
    const X = nm => (nm - x0) / (x1 - x0) * W, Y = v => bot - v * (bot - top);
    const light = document.body.dataset.uiStyle === 'light';
    // the palette: the dark looks get brighter, thicker lines (dye colours lifted to a readable lightness)
    const P = light
      ? { text: '#555', lw: 1.2, emFill: 'rgba(0,120,255,0.12)', emEdge: null, dich: '#888', exF: '#777', qe: '#bbb', laserW: 2, laserEdge: '#111',
          laser: nm => waveColour(nm, true) }
      : { text: '#cfd6df', lw: 1.7, emFill: 'rgba(110,180,255,0.26)', emEdge: 'rgba(150,205,255,0.9)', dich: '#f2f2f2', exF: '#ffcf70', qe: '#a3b1c4', laserW: 3, laserEdge: '#ffffff',
          laser: nm => waveColour(nm, false) };
    const legend = [];   // [label, style] for the enlarged plot's legend
    g.clearRect(0, 0, W, H);
    g.font = (big ? 22 : 10 * k) + 'px sans-serif'; g.fillStyle = P.text;
    const step = big ? 50 : 100;
    for (let nm = 400; nm <= 800; nm += step) { g.fillText(String(nm), X(nm) - 9 * k, H - 3 * k); g.fillRect(X(nm), bot, k, 3 * k); }
    if (big) g.fillText('nm', X(x0) + 4 * k, H - 3 * k);
    const curve = (vals, style, dash, fill) => {
      g.beginPath();
      for (let nm = x0; nm <= x1; nm++) { const v = vals[nm - 300] || 0; if (nm === x0) g.moveTo(X(nm), Y(v)); else g.lineTo(X(nm), Y(v)); }
      if (fill) { g.lineTo(X(x1), Y(0)); g.lineTo(X(x0), Y(0)); g.closePath(); g.fillStyle = fill; g.fill(); return; }
      g.setLineDash((dash || []).map(v => v * k)); g.strokeStyle = style; g.lineWidth = P.lw * k; g.stroke(); g.setLineDash([]);
    };
    curve(lp.emission_T, null, null, P.emFill);
    if (P.emEdge) curve(lp.emission_T, P.emEdge);
    legend.push(['emission filter: ' + lp.emission_filter, { fill: P.emFill, stroke: P.emEdge }]);
    curve(lp.dichroic_T, P.dich, [2, 2]);
    legend.push(['dichroic: ' + lp.dichroic, { stroke: P.dich, dash: [2, 2] }]);
    if (lp.excitation_T.some(v => v !== 1)) {
      curve(lp.excitation_T, P.exF, [6, 2, 1, 2]);
      legend.push(['excitation filter: ' + lp.excitation_filter, { stroke: P.exF, dash: [6, 2, 1, 2] }]);
    }
    curve(lp.qe, P.qe, [1, 3]);
    legend.push(['camera QE' + (lp.qe_name ? ': ' + lp.qe_name : ''), { stroke: P.qe, dash: [1, 3] }]);
    for (const [t, L] of shown) {
      const name = DYE_UI.dyeNameOf(t.prefix);
      for (const [role, dash] of [['main', null], ['pre', [5, 3]]]) {
        const sp = L['dye_' + role];
        if (!sp.present || sp.is_dark || (role === 'pre' && L.mode !== 'PALM')) continue;
        const who = name + (role === 'pre' ? ' (pre state)' : '');
        const c = waveColour(sp.em ? centroidNm(sp.em) : sp.ex ? centroidNm(sp.ex) : 600, light);   // its weighted emission wavelength
        if (sp.ex) { curve(sp.ex, c, [3, 3]); legend.push([who + ' excitation', { stroke: c, dash: [3, 3] }]); }
        if (sp.em) { curve(sp.em, c, dash); legend.push([who + ' emission', { stroke: c, dash }]); }
      }
    }
    let lines = 0;
    for (const l of lp.lasers) {
      if (!(l.kw_per_cm2 > 0)) continue;   // blocked by the excitation filter
      lines++;
      // a laser line: its colour with an edge on both sides (white on the dark looks), so it stands apart from a dye
      // curve of the same hue
      const c = P.laser(l.nm), x = X(l.nm), w = P.laserW * k, e = (light ? 1 : 1.5) * k;
      g.fillStyle = P.laserEdge; g.fillRect(x - w / 2 - e, top, w + 2 * e, bot - top);
      g.fillStyle = c; g.fillRect(x - w / 2, top, w, bot - top);
      legend.push([`${l.nm} nm laser, ${+l.kw_per_cm2.toFixed(3)} kW/cm²`, { stroke: c, width: P.laserW, edge: P.laserEdge }]);
    }
    cv2.dataset.lasers = lines;
    const fmt = st => st ? `${(100 * st.detected_fraction).toFixed(1)} % detected at ${st.lambda_nm.toFixed(0)} nm, ${Math.round(st.detected_per_s).toLocaleString()} ph/s` : 'dark';
    const parts = [];
    if (!shown.length) parts.push('no labelled target (every dye None, 0 % labelled or no structure)');
    for (const [t, L] of shown) {
      const who = shown.length > 1 ? t.name + ': ' : '';
      parts.push(`${who}<b>${DYE_UI.dyeNameOf(t.prefix)}</b>, ${L.mode}: ${fmt(L.main)}${L.mode === 'WideField' ? '' : ' while ON'}`);
      if (L.pre) parts.push(`pre state: ${fmt(L.pre)}`);
      if (L.mode === 'dSTORM') parts.push(`ON ${(1000 * L.on_s_now).toPrecision(3)} ms, initial ON ${L.initial_on_s.toPrecision(3)} s (excitation x${L.excitation_scale.toPrecision(3)} of Dempsey 2011's)`);
      if (L.k_act_per_s > 0) parts.push(`activation ${L.k_act_per_s.toPrecision(3)} /s per dye`);
      const bg = L.imager_background_per_px_per_s;
      if (bg > 0) parts.push(`free imager: ${bg.toFixed(0)} ph/px/s`);
      if (L.generic) parts.push('<i>generic values: no data for this dye in this mode</i>');
    }
    // the legend and the readout (what reaches the camera per label) only under the enlarged plot
    if (big) {
      const sw = s => `<svg width="30" height="12" aria-hidden="true">` + (s.fill
        ? `<rect x="1" y="2" width="28" height="8" fill="${s.fill}"${s.stroke ? ` stroke="${s.stroke}"` : ''}/>`
        : (s.edge ? `<line x1="1" y1="6" x2="29" y2="6" stroke="${s.edge}" stroke-width="${(s.width || 2) + 3}"/>` : '') +
          `<line x1="1" y1="6" x2="29" y2="6" stroke="${s.stroke}" stroke-width="${s.width || P.lw + 0.3}"${s.dash ? ` stroke-dasharray="${s.dash.join(' ')}"` : ''}/>`) + '</svg>';
      document.getElementById('specBigLegend').innerHTML = legend.map(([t, s]) => `<span>${sw(s)}${t}</span>`).join('');
    }
    out.innerHTML = !big ? '' : parts.join('<br>');
  } catch (e) {
    out.textContent = 'light path: ' + (e && e.message || e);
  }
}
// the plot follows the settings and the controls column (where Illumination & light path is)
for (const id of ['panel', 'liveCtl']) {
  document.getElementById(id).addEventListener('input', scheduleSpecPlot);
  document.getElementById(id).addEventListener('change', scheduleSpecPlot);
  document.getElementById(id).addEventListener('toggle', scheduleSpecPlot, true);
}
// click the plot: a larger copy over the page (Esc, a click beside it or ✕ closes it)
(function () {
  const ov = document.createElement('div');
  ov.id = 'specBig'; ov.hidden = true;
  ov.innerHTML = '<div role="dialog" aria-label="Spectra"><button title="Close (Esc)">✕</button><canvas id="specPlotBig" width="1720" height="560"></canvas><div class="specLegend" id="specBigLegend"></div><div class="sub" id="specBigReadout"></div></div>';
  document.body.append(ov);
  const close = () => { ov.hidden = true; };
  ov.addEventListener('click', e => { if (e.target === ov || e.target.tagName === 'BUTTON') close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !ov.hidden) close(); });
  document.getElementById('specPlot').addEventListener('click', () => { ov.hidden = false; drawSpecPlot(true); });
})();
// the planned movie square follows the Acquisition group's state and the camera size / pixel size
document.getElementById('panel').addEventListener('toggle', e => { if (e.target.dataset && e.target.dataset.group === 'acq') requestDraw(); }, true);
for (const id of ['mv_size', 'mv_pixel-nm', 'mv_modality', 'mv_z']) document.getElementById(id).addEventListener('input', requestDraw);
scheduleSpecPlot();
window.addEventListener('resize', scheduleSpecPlot);   // (a new pixel density: another screen, a page zoom, the phone layout)
document.getElementById('mv_psf-model').addEventListener('change', e => {
  document.getElementById('mv_psf-zernike-preset').disabled = e.target.value === '0';
});
document.getElementById('mv_play').addEventListener('click', toggleMoviePlay);
document.getElementById('mv_slider').addEventListener('input', e => { if (movie) showMovieFrame(+e.target.value); });
document.getElementById('mv_save').addEventListener('click', saveMovieTiff);
document.getElementById('mv_gif').addEventListener('click', e => saveMovieVideo(e, 'gif'));
document.getElementById('mv_mp4').addEventListener('click', e => saveMovieVideo(e, 'mp4'));
document.getElementById('mv_close').addEventListener('click', e => {
  e.preventDefault(); document.getElementById('movie').style.display = 'none';
  if (movieRaf) toggleMoviePlay();
  requestDraw();
});

// The movie player: starts in the bottom-right corner of the canvas area (over the x-z view); its title bar drags it
// anywhere in the canvas area (kept inside it on a resize).
const moviePanel = document.getElementById('movie');
function clampMoviePanel() {
  if (moviePanel.style.left === '' || moviePanel.style.display === 'none') return;
  const hr = host.getBoundingClientRect();
  moviePanel.style.left = Math.max(0, Math.min(hr.width - moviePanel.offsetWidth, parseFloat(moviePanel.style.left))) + 'px';
  moviePanel.style.top = Math.max(0, Math.min(hr.height - moviePanel.offsetHeight, parseFloat(moviePanel.style.top))) + 'px';
}
moviePanel.querySelector('.t.drag').addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.closest('a,button,input')) return;
  e.preventDefault();
  const hr = host.getBoundingClientRect(), pr = moviePanel.getBoundingClientRect(), dx = e.clientX - pr.left, dy = e.clientY - pr.top;
  moviePanel.style.right = moviePanel.style.bottom = 'auto';
  const move = ev => { moviePanel.style.left = (ev.clientX - hr.left - dx) + 'px'; moviePanel.style.top = (ev.clientY - hr.top - dy) + 'px'; clampMoviePanel(); };
  move(e);
  const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
});
window.addEventListener('resize', () => { resizeCanvas(); clampMoviePanel(); });
els.showXZ.addEventListener('input', resizeCanvas);
// While an image slice is shown, the slice height (View) and the focus height (Acquisition) move together; turning a
// slice on takes the focus to the slice.
let zCoupling = false;
function coupleZ(from, to) {
  if (zCoupling || els.dataSlice.value === 'none' || +to.value === +from.value) return;
  zCoupling = true;
  try { to.value = from.value; to.dispatchEvent(new Event('input', { bubbles: true })); } finally { zCoupling = false; }
}
const mvZ = document.getElementById('mv_z');
els.sliceZ.addEventListener('input', () => coupleZ(els.sliceZ, mvZ));
mvZ.addEventListener('input', () => coupleZ(mvZ, els.sliceZ));
let lastSlice = els.dataSlice.value;
els.dataSlice.addEventListener('input', () => { if (lastSlice === 'none') coupleZ(els.sliceZ, mvZ); lastSlice = els.dataSlice.value; });
syncLabels();
if (/[?&]nw/.test(location.search)) startMainEngine(); // ?nw runs the core on the main thread (for testing)
else initGenWorkers();
setLayerMode(!/[?&]2d/.test(location.search) && initGl()); // ?2d forces the 2D fallback (for testing)
resizeCanvas();
