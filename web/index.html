<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cell field viewer</title>
<style>
  /* UI styles: one DOM, themed by body[data-ui-style] (compact | focus | light). A new style is one block of tokens
     below plus one entry in UI_STYLES (uiSchema script; oneOpen: only one group open at a time). The canvas area and its overlays stay dark in every style. */
  :root{--side-w:380px;--lab-w:116px;--lab-w-base:116px;--val-w:68px;--bg:#0c0f14;--panel:#11161d;--border:#232a35;--text:#dfe6ee;--muted:#8b97a8;--accent:#4a90d9;
    --link:#8bb8e8;--in-bg:#1a212b;--in-border:#2c3644;--grp-bg:transparent;--grp-head:transparent;--tip-bg:#1d2530;
    --row-gap:4px;--fs:12px;--radius:6px;--guide:#2f3a4a}
  body[data-ui-style=focus]{--panel:#0f141b;--border:#26303d;--grp-bg:#161d27;--grp-head:#1b2430;--accent:#5aa9e6;--guide:#3a4a60}
  body[data-ui-style=light]{--panel:#f5f6f8;--border:#d9dde3;--text:#1f2329;--muted:#5d6672;--accent:#4051b5;
    --link:#4051b5;--in-bg:#fff;--in-border:#c4cad3;--tip-bg:#fff;--guide:#c4cad3}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
  #wrap{display:grid;grid-template-columns:var(--side-w) 1fr;height:100vh}
  #side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--border);box-sizing:border-box;font-size:var(--fs)}
  #sideTop{position:relative;padding:10px 12px 6px;border-bottom:1px solid var(--border)}
  #sideTop .bar{display:flex;align-items:center;gap:8px}
  #sideTop h1{font-size:15px;margin:0;flex:1}
  #side a.back{display:block;font-size:11px;color:var(--link);text-decoration:none;margin:0 0 6px}
  #side a.back:hover{text-decoration:underline}
  #panel{flex:1;overflow-y:auto;padding:4px 12px 12px;min-height:0}
  #side p.sub{font-size:11px;color:var(--muted);margin:6px 0;line-height:1.4}
  #side p.sub a{color:var(--link)}
  input[type=number],input[type=text],select{background:var(--in-bg);border:1px solid var(--in-border);color:var(--text);border-radius:4px;padding:2px 4px;font-size:var(--fs);font-family:inherit;box-sizing:border-box}
  input[type=number]{width:64px}
  input[type=range],input[type=checkbox]{accent-color:var(--accent)}
  button{background:var(--in-bg);border:1px solid var(--in-border);color:var(--text);border-radius:4px;padding:5px 8px;font-size:var(--fs);cursor:pointer;font-family:inherit}
  button:hover{border-color:var(--accent)}
  /* hamburger menu */
  #menuBtn{font-size:16px;line-height:1;padding:3px 8px}
  #menu{display:none;position:absolute;right:12px;top:100%;z-index:20;margin-top:4px;min-width:210px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 10px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  #menu.open{display:block}
  #menu h4{margin:6px 0 4px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  #menu label{display:block;margin:3px 0;cursor:pointer}
  #menu .btns{display:flex;gap:6px;margin-top:8px}
  #menu .btns button{flex:1;padding:3px 6px}
  #menu .note{font-size:11px;color:var(--muted);margin-top:6px}
  /* groups and sections */
  .sect{margin:12px 0 2px;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  details.grp{border:1px solid var(--border);border-radius:var(--radius);margin:6px 0;background:var(--grp-bg)}
  details.grp>summary{cursor:pointer;padding:5px 8px;font-weight:600;list-style:none;display:flex;align-items:center;gap:6px;background:var(--grp-head);border-radius:var(--radius)}
  details.grp>summary::-webkit-details-marker{display:none}
  details.grp>summary::before{content:'▸';color:var(--muted);font-size:10px;transition:transform .12s}
  details.grp[open]>summary::before{transform:rotate(90deg)}
  details.grp[open]>summary{border-bottom:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0}
  details.grp .body{padding:4px 8px 6px}
  /* focus: the one open group carries the accent: its title in the accent colour, its box a faint tint of it */
  body[data-ui-style=focus] details.grp[open]{border-color:color-mix(in srgb,var(--accent) 45%,var(--border));background:color-mix(in srgb,var(--accent) 7%,var(--panel))}
  body[data-ui-style=focus] details.grp[open]>summary{color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel));border-bottom-color:color-mix(in srgb,var(--accent) 35%,var(--border))}
  body[data-ui-style=focus] details.grp[open]>summary::before{color:var(--accent)}
  body[data-ui-style=focus] #menu [data-act=expand]{display:none}
  /* one option = one line: label (i) | control | value + unit */
  .opt{display:grid;grid-template-columns:var(--lab-w) minmax(0,1fr) var(--val-w);align-items:center;gap:6px;margin:var(--row-gap) 0}
  .opt .lab{display:flex;align-items:center;gap:4px;min-width:0}
  .opt .lab label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .opt .ctl{display:flex;align-items:center;gap:4px;justify-content:flex-end}
  .opt .ctl input[type=range]{width:100%;min-width:0}
  .opt .ctl select{max-width:150px}
  .opt .val{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
  .opt .val b{color:var(--text);font-weight:500}
  .opt.wide{grid-template-columns:1fr}
  .opt.wide button{width:100%}
  .opt.check{grid-template-columns:minmax(0,1fr) auto}
  .opt.select,.opt.preset{grid-template-columns:var(--lab-w) minmax(0,1fr)}
  .opt.select select,.opt.preset select{width:100%;max-width:none}
  .opt .val .u{font-size:.9em}
  .opt.pair .ctl input[type=number]{width:52px;flex:none;padding:2px 3px}
  .opt.pair .ctl .dual{flex:1;min-width:30px;width:auto}
  .opt.pair .ctl{grid-column:2 / 4}
  .opt.pair .ctl .u{flex:none;width:calc(var(--val-w) - 26px);padding-left:2px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .opt.pair .val{display:none}
  .opt.hasSide{grid-template-columns:var(--lab-w) minmax(0,1fr) minmax(34px,auto) auto}
  .opt label.side{display:flex;align-items:center;gap:2px;justify-self:end;color:var(--muted);white-space:nowrap;cursor:pointer}
  .opt label.side input{margin:0}
  .info{display:inline-flex;align-items:center;justify-content:center;flex:none;width:13px;height:13px;border-radius:50%;border:1px solid var(--muted);color:var(--muted);font-size:9px;font-style:italic;font-family:Georgia,serif;cursor:help;user-select:none}
  .info:hover,.info:focus{color:var(--accent);border-color:var(--accent);outline:none}
  #tip{position:fixed;z-index:50;display:none;max-width:280px;background:var(--tip-bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:11.5px;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.35);pointer-events:none}
  #tip code{font-size:10.5px;color:var(--muted)}
  /* preset children: indented under their preset with a guide line */
  .kids{margin-left:5px;padding-left:9px;border-left:2px solid var(--guide)}
  .kids .opt{--lab-w:calc(var(--lab-w-base) - 16px)}
  body[data-level=default] .adv{display:none!important}
  /* sub-headings inside a group, button rows, checkbox grids, radio columns */
  .subhead{display:flex;align-items:center;gap:5px;margin:12px 0 4px;padding-bottom:2px;border-bottom:1px solid var(--border);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .body>.subhead:first-child{margin-top:4px}
  .opt.btnrow{display:flex;gap:6px}
  .opt.btnrow button{flex:1;padding:4px 6px;white-space:nowrap}
  .opt.gridrow{grid-template-columns:var(--lab-w) minmax(0,1fr);align-items:start}
  .opt.gridrow .cells{display:grid;grid-template-columns:1fr 1fr;column-gap:8px}
  .opt.gridrow .cells .opt.check{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:4px;margin:1px 0}
  .opt.gridrow .cells .opt .ctl{flex:none}
  .opt.radio{grid-template-columns:var(--lab-w) minmax(0,1fr);align-items:start}
  .opt.radio .lab{padding-top:1px}
  .radios{display:flex;flex-direction:column;gap:1px}
  .radios label{cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .radios input{margin:0 3px 0 0;vertical-align:-2px}
  /* the data layers' status list */
  .dataStatus{margin:8px 0 4px;border:1px solid var(--border);border-radius:5px;padding:5px 8px;font-size:11px;line-height:1.35}
  .dataStatus:empty{display:none}
  .dataStatus .hd{color:var(--muted);margin-bottom:4px}
  .dataStatus .hd.q{margin:6px 0 2px;padding-top:4px;border-top:1px solid var(--border)}
  .dataStatus .st a{color:var(--link);text-decoration:none;margin-left:3px}
  .dataStatus .r{display:grid;grid-template-columns:14px minmax(0,1fr) auto;column-gap:4px;align-items:baseline;margin:3px 0}
  .dataStatus .r .st{font-variant-numeric:tabular-nums}
  .dataStatus .sub2,.dataStatus .bar{grid-column:2 / 4}
  .dataStatus .sub2{color:var(--muted);font-size:10.5px}
  .dataStatus .sub2 a{color:var(--link)}
  .dataStatus .bar{height:3px;margin-top:2px;background:var(--in-border);border-radius:2px;overflow:hidden}
  .dataStatus .bar>i{display:block;height:100%;background:var(--accent)}
  .dataStatus .r.ok .ic,.dataStatus .r.ok .st{color:#5fbf72}
  .dataStatus .r.run .ic,.dataStatus .r.run .st{color:var(--accent)}
  .dataStatus .r.fail .ic,.dataStatus .r.fail .st{color:#e06c6c}
  .dataStatus .r.off{opacity:.55}
  .dataStatus .ft{color:var(--muted);font-size:10px;margin-top:4px}
  /* two-knob range slider (two overlaid range inputs) */
  .dual{position:relative;width:96px;height:18px}
  .dual .track,.dual .fill{position:absolute;top:8px;height:3px;border-radius:2px}
  .dual .track{left:0;right:0;background:var(--in-border)}
  .dual .fill{background:var(--accent)}
  .dual input{position:absolute;left:0;top:0;width:100%!important;height:18px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
  .dual input::-webkit-slider-runnable-track{background:none;height:18px}
  .dual input::-moz-range-track{background:none}
  .dual input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:12px;height:12px;margin-top:3px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);cursor:pointer}
  .dual input::-moz-range-thumb{pointer-events:auto;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--panel);cursor:pointer}
  @media (max-width:700px){
    #wrap{grid-template-columns:1fr;grid-template-rows:45vh 1fr}
    #side{border-right:none;border-bottom:1px solid var(--border)}
  }
  #canvasHost{position:relative;min-height:0}
  canvas{display:block;cursor:grab}
  canvas.dragging{cursor:grabbing}
  /* Three stacked layers, all the same pixel size: #cvBase (grid + microtubules, 2D), #cvGl (cell bodies, WebGL2),
     #cv (nuclei + scale bar, 2D, the interactive one). #cvGl/#cvBase are display:none when WebGL2 is unavailable. */
  #cvBase{position:absolute;top:0;left:0;background:#05070a;pointer-events:none;z-index:0}
  #cvGl{position:absolute;top:0;left:0;pointer-events:none;z-index:1}
  #cv{position:relative;z-index:2;background:transparent}
  /* x-z side view: the bottom --xz-h of the canvas area (the three layers above shrink to the rest) */
  #cvXZ{position:absolute;left:0;bottom:0;display:none;background:#05070a;border-top:1px solid #232a35;box-sizing:border-box;z-index:2}
  #canvasHost.xz #legend{bottom:calc(var(--xz-h) + 8px)}
  #hud,#legend,#movie{z-index:3;color:#dfe6ee}
  #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:4;pointer-events:none;font-size:14px;color:#8b97a8;background:#05070a}
  #movie{position:absolute;bottom:8px;right:8px;display:none;z-index:4;background:rgba(10,13,18,.94);border:1px solid #232a35;border-radius:6px;padding:6px;font-size:11px}
  #movie .t{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:3px 0}
  #movie .t.drag{cursor:move;user-select:none}
  #movie a{color:#8bb8e8}
  #movie button{background:#1a212b;border-color:#2c3644;color:#dfe6ee}
  #mv_cv{display:block;image-rendering:pixelated;cursor:default;background:#000}
  #hud{position:absolute;top:8px;left:8px;font-size:11px;background:rgba(10,13,18,.7);border:1px solid #232a35;border-radius:6px;padding:8px 10px;line-height:1.5;pointer-events:none;white-space:pre}
  #legend{position:absolute;bottom:8px;left:8px;font-size:11px;background:rgba(10,13,18,.7);border:1px solid #232a35;border-radius:6px;padding:6px 9px;line-height:1.5}
  .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  /* sidebar tabs: the settings panel and the animation editor (web/anim/editor.js styles its own panel) */
  #tabs{display:flex;gap:4px;margin-top:8px}
  #tabs[hidden]{display:none}   /* shown by the menu's "Show animation pane (WIP)" (web/anim/editor.js) */
  #tabs button{flex:1;padding:4px 6px;border-radius:5px 5px 0 0;border-bottom:none;color:var(--muted)}
  #tabs button.on{color:var(--text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--in-bg))}
  #animPanel{flex:1;overflow-y:auto;padding:4px 12px 12px;min-height:0}
  #animBar{position:absolute;left:0;right:0;bottom:0;height:46px;display:none;z-index:3;box-sizing:border-box}
</style>
</head>
<body>
<div id="wrap">
  <div id="side">
    <div id="sideTop">
      <a id="docsLink" class="back" target="_top" href="https://kjamartens.github.io/inSiliScope/">&larr; inSiliScope docs</a>
      <div class="bar">
        <h1>Cell field viewer</h1>
        <button id="menuBtn" title="Options and style" aria-haspopup="true" aria-expanded="false">☰</button>
      </div>
      <div id="menu" role="menu"></div>
      <div id="tabs" role="tablist" hidden><button data-tab="settings" class="on" role="tab">Settings</button><button data-tab="anim" role="tab" title="Animations: orbits, layers building up, slabs sweeping through a cell; export as MP4, WebM or GIF">Animation</button></div>
    </div>
    <!-- Filled from UI_GROUPS by the uiSchema script below (same element ids as the main script reads). -->
    <div id="panel"></div>
    <div id="animPanel" hidden></div>
  </div>

  <div id="canvasHost">
    <canvas id="cvBase"></canvas>
    <canvas id="cvGl"></canvas>
    <canvas id="cv"></canvas>
    <canvas id="cvXZ"></canvas>
    <div id="hud"></div>
    <div id="loading">Loading the cell field (WebAssembly core, packing cells)…</div>
    <div id="movie"><div class="t drag" title="Drag to move the player"><span id="mv_info"></span><span><a href="#" id="mv_save">save TIFF</a> &nbsp; <a href="#" id="mv_gif" title="The movie as shown (display range), scaled up to at least 512 px">GIF</a> &nbsp; <a href="#" id="mv_mp4" title="The movie as shown (display range), scaled up to at least 512 px; WebM where the browser cannot encode H.264">MP4</a> &nbsp; <a href="#" id="mv_close">close</a></span></div>
      <canvas id="mv_cv"></canvas>
      <div class="t"><button id="mv_play">▶</button><input type="range" id="mv_slider" min="0" max="0" value="0" style="flex:1"><span id="mv_fno"></span></div></div>
    <div id="animBar"></div>
    <div id="legend">
      <span class="sw" style="background:#5aa9e6"></span>cell body
      <span class="sw" style="background:#e6a23c;margin-left:10px"></span>nucleus (colour = depth)
      <span class="sw" style="background:#e6c65a;margin-left:10px"></span>microtubule
      <span class="sw" id="dyeSwatch" style="background:#ff4d4d;margin-left:10px"></span>dye
      <span class="sw" style="background:#3a4454;margin-left:10px"></span>chunk grid
    </div>
  </div>
</div>

<script src="insiliscope_module.js"></script>

<script src="scene/compute.js"></script>
<script src="anim/sequence.js"></script>

<script id="uiSchema">
'use strict';
// ---- option panel: schema + renderer ------------------------------------------------------------------------------
// Every option of the side panel is one entry of UI_GROUPS. This script builds #panel from it before the main script
// runs, with the element ids the main script reads (els, params(), movieSpec(), MOVIE_KEYS), so the generator path
// does not know the panel changed. One option = one line: label (i) | control | value + unit. Rows marked adv are
// hidden in the Default level; show() hides rows that do not apply (e.g. WideField rows unless that modality is
// chosen). A preset (or an entry with kids) draws its kids indented under it; picking a preset writes their values,
// editing one by hand makes it "Custom". Styles are CSS only (body[data-ui-style], UI_STYLES).
// This script is data only (no DOM access until a show()/fmt() runs): web/lab/engine_check.mjs reads the defaults
// from it (tests/parity/load_prototype.mjs schemaDefaults). The renderer is the uiPanel script below.
const { UI_GROUPS, UI_STYLES, USER_DYES, cameraModeGain, DYE_UI } = (() => {
const $ = id => document.getElementById(id);
const modality = () => +($('mv_modality') ? $('mv_modality').value : 0);
const FL = () => modality() === 0, BF = () => modality() === 1;
// ---- the dye library (web/dye_library.js, generated from data/dyes by tools/gen_dye_library.mjs) ----
const DD = self.ISC_DYE_DATA;
const ND = DD.dyes.length, MODE_NAMES = ['dSTORM', 'PALM', 'DNA-PAINT', 'WideField'];
const dyeIndex = id => DD.dyes.findIndex(d => d.id === id);
const sourceOf = n => DD.dyes[+($('mv_dye' + n + '.source') ? $('mv_dye' + n + '.source').value : 0)];
// The dye a structure's choice means: a library dye or a user dye's source dye.
const choiceDye = v => (+v < ND ? DD.dyes[+v] : sourceOf(+v - ND + 1));
// User dyes (Custom dyes group): the engine's dye slots dye1..dye3 (FluoParam_DyeN_*), none until the user adds one.
// Each has a name and a default mode (viewer only: the movie gets mt-mode = that mode when the structure's mode is
// "the dye's default") and every dye field, whatever the mode; a structure picks one by name in its Dye select.
const N_USER_DYES = 3;
const USER_DYES = {
  added: [false, false, false],
  isUser: v => +v >= ND,
  slot: v => +v - ND + 1,
  name: n => ($('ud' + n + '-name') ? $('ud' + n + '-name').value.trim() : '') || 'Dye ' + n,
  modeIndex: n => +$('ud' + n + '-mode').value,
};
const mtChoice = () => ($('mv_mt-dye') ? $('mv_mt-dye').value : String(dyeIndex(DD.dyeDefault.dye)));
const mtMode = () => {
  const m = $('mv_mt-mode') ? +$('mv_mt-mode').value : -1, v = mtChoice();
  if (m >= 0) return MODE_NAMES[m];
  return USER_DYES.isUser(v) ? MODE_NAMES[USER_DYES.modeIndex(USER_DYES.slot(v))] : choiceDye(v).defaultMode;
};
const inMode = (...modes) => () => FL() && modes.includes(mtMode());
// The Dye select lists the library dyes with data for the structure's mode (every dye runs in every mode, on generic
// values where the library has none; those are not offered); the user dyes are listed whatever the mode.
const dyeHasMode = (i, m) => !DD.dyes[i].modes[m].generic;
const firstDyeFor = m => { const i = DD.dyes.findIndex(d => d.defaultMode === m); return i >= 0 ? i : DD.dyes.findIndex((d, j) => dyeHasMode(j, m)); };
function filterMtDyes() {
  const sel = $('mv_mt-dye'), m = mtMode();
  for (let i = 0; i < ND; i++) { const o = sel.options[i]; o.hidden = o.disabled = !dyeHasMode(i, m); }
}
// Shows the added user dyes in the structures' Dye select (by name), hides the others, and moves a structure off a
// removed one (to the default library dye).
function refreshUserDyes() {
  const sel = $('mv_mt-dye');
  for (let n = 1; n <= N_USER_DYES; n++) {
    const o = sel.querySelector('option[value="' + (ND + n - 1) + '"]');
    o.hidden = o.disabled = !USER_DYES.added[n - 1];
    o.textContent = USER_DYES.name(n) + ' (custom)';
  }
  $('addUserDye').disabled = USER_DYES.added.every(Boolean);
  if (USER_DYES.isUser(sel.value) && !USER_DYES.added[USER_DYES.slot(sel.value) - 1]) {
    sel.value = String(dyeIndex(DD.dyeDefault.dye));
    sel.dispatchEvent(new Event('input', { bubbles: true }));
    sel.dispatchEvent(new Event('change', { bubbles: true }));
  }
}
// Dye fields (the option suffixes of mt-dye.<field> / dye<N>.<field>): label, unit, tip, value of a dye in a mode,
// the modes it applies to (null = all). Picking a dye or a mode loads these rows from the library; edit them after.
const DYE_FIELD_ROWS = [
  ['fluorescent-pct', 'Fluorescent', '%', 'Share of the attached labels whose dye is fluorescent (maturation, photoactivation efficiency, dead dyes).', d => 100 * d.fluorescentFraction, null],
  ['qy', 'Quantum yield', '', 'Fluorescence quantum yield of the dye (main state).', d => d.states.main.qy, null],
  ['ext-coeff', 'Extinction ε', 'M⁻¹cm⁻¹', 'Molar extinction coefficient at the absorption peak (main state); the excitation spectrum scales it at each laser line.', d => d.states.main.extCoeff, null],

          num('mv_gain-std-pct', 'Gain spread', '%', 'Per-pixel gain spread (PRNU). <code>CamParam_GainStdPctPerPixel</code>', 0, 50, 0.1, 0.5, { adv }),
          num('mv_read-noise-std-pct', 'Read-noise spread', '%', 'Per-pixel read-noise spread. <code>CamParam_ReadNoiseStdPctPerPixel</code>', 0, 100, 1, 20, { adv }),
          { kind: 'html', html: '<div class="sub" id="emGainReadout"></div>', show: () => emccdChosen() },
          num('mv_cic', 'CIC', 'e⁻/px/frame', 'EMCCD clock-induced charge. <code>CamParam_CicElectrons</code>', 0, 1, 'any', 0.002, { adv }),
          num('mv_bit-depth', 'Bit depth', 'bits', 'EMCCD ADC bit depth. <code>CamParam_BitDepth</code>', 8, 16, 1, 16, { adv }),
        ] }),
  ] },
  { id: 'formation', title: 'Image formation', items: [
    num('mv_wf-upscale', 'Mean-field upscaling', '× per px', 'Mean-field (FFT) grid cells per camera pixel, per axis: WideField dyes, pre states and the dSTORM initial ON while they are dense. <code>General_WideFieldUpscaling</code>', 1, 4, 1, 1, { adv, show: FL }),
    num('mv_wf-plane-nm', 'Mean-field z plane', 'nm', 'Thickness of the mean-field dye planes. <code>General_WideFieldZPlaneNm</code>', 5, 500, 5, 25, { adv, show: FL }),
    num('mv_mean-field-density-per-um2', 'Mean-field above', '/µm²', 'A continuous population renders mean-field (fast, its mean image) while more than this many of its dyes emit per µm² within the focal slab, per dye (exact windows) below. <code>General_MeanFieldDensityPerUm2</code>', 0, null, 1, 20, { adv, show: FL }),
    num('mv_mean-field-slab-nm', 'Focal slab', 'nm', 'Thickness of that slab around the focal plane. <code>General_MeanFieldSlabNm</code>', 0, null, 50, 500, { adv, show: FL }),
    num('mv_mean-field-max-emitters', 'Per-dye cap', 'dyes', 'A second switch to mean-field, a cost cap: a continuous population (WideField dyes, PALM pre states, the dSTORM initial ON) also renders mean-field while more than this many of its dyes are expected to emit in the whole field of view, at any depth within the Dye z range (Acquisition), not only in the focal slab. Per dye, each emitting dye costs two PSF splats, so this keeps dense, defocused populations fast. Either test is enough; populations only dim, so a movie switches at most once, from mean-field to per dye. <code>General_MeanFieldMaxEmitters</code>', 0, null, 100, 5000, { adv, show: FL }),
    range('mv_bf-quality', 'BF quality', '', 'Speed vs precision. 1: thin object, 6 condenser points; 2: 0.5 µm slices, 12 points; 3: 0.5 µm, 24 points; 4: 0.25 µm slices, 48 points (slow). Sets the source count, grid, geometry samples and slice step; picking a level resets the two overrides below. <code>General_BrightFieldQuality</code>',
      1, 4, 1, 3, { show: BF, cls: 'bfRow', valId: 'mv_bf-quality-name',
        fmt: v => v + ' ' + BF_QUALITY_NAMES[+v] + (+$('mv_bf-sources').value !== 0 || +$('mv_bf-slice-um').value !== -1 ? ' *' : ''),
        apply: () => ({ 'mv_bf-sources': 0, 'mv_bf-slice-um': -1 }),
        kids: [
          num('mv_bf-sources', 'Sources', 'points', 'Condenser source points; 0 = from the quality level (6/12/24/48). <code>General_BrightFieldSources</code>', 0, 256, 1, 0, { adv, show: BF, cls: 'bfRow' }),
          num('mv_bf-slice-um', 'Slice step', 'µm', 'Multislice step; 0 = one thin slice, −1 = from the quality level (0/0.5/0.5/0.25). <code>General_BrightFieldSliceUm</code>', -1, 5, 0.125, -1, { adv, show: BF, cls: 'bfRow' }),
        ] }),
  ] },

  { sect: 'Acquisition', id: 'acq', title: 'Acquisition', open: true, items: [
    num('mv_frames', 'Frames', 'frames', 'Number of camera frames.', 1, 2000, 1, 10),
    num('mv_exposure-ms', 'Exposure', 'ms', 'Exposure time per frame (also the player\'s frame time).', 1, null, 1, 50),
    num('mv_z', 'Focus height', 'µm', 'Focal plane height above the coverslip (the ZStage position): 0 = coverslip in focus. While an image slice is shown (View), it moves with the slice height.', null, null, 0.1, 0.5),
    num('mv_z-range-um', 'Dye z range', 'µm', 'Only dyes within ± range/2 of the focal plane are rendered (0 = all). <code>SimType_CellFieldZRangeUm</code>', 0, null, 0.5, 7, { adv }),
    num('mv_start-sec', 'Start time', 's', 'Simulated time of the first frame after the illumination starts. 60 s: past the dSTORM initial ON phase and the first PALM conversions, near steady state; 0 shows the start (every dSTORM dye ON).', 0, null, 1, 60, { adv }),
    button('mv_make', 'Make movie here', 'Renders a movie of the dyes under the view centre with the adapter\'s own PSF/noise code (sCMOS defaults), in a worker. Saved as a 16-bit TIFF from the player.'),
  ] },

  { sect: 'About', id: 'about', title: 'About this viewer', items: [
    { kind: 'html', html: `<p class="sub">The insiliscope world model (C++ core, compiled to WASM, run in Web Workers). Every cell,
      microtubule and dye is a pure function of (seed, address): pan anywhere and come back to the same structure. Cells
      are packed on fixed 8x8-chunk blocks, so what you see is what the Micro-Manager adapter images. The JS prototype
      this was ported from is in <a href="prototype/index.html">prototype/</a>.</p>
      <p class="sub">Drag to pan, wheel to zoom. Panning is exactly the stage-motion case for the inSiliScope adapter:
      the field does not move, the viewport (camera FOV) does, and the same world coordinate always re-derives the same
      structure. Packing moves and turns overlapping cells apart (never shrinks them) and drops a cell still stuck after
      relaxation. Dyes are the real labelled sites of the core (13_3 lattice, binder + linker), shown once zoomed in.</p>` },
  ] },
];

// Styles: name -> menu label. The look is CSS (body[data-ui-style=...]); add a block there and an entry here.
const UI_STYLES = { compact: { label: 'Compact (dark)' }, focus: { label: 'Focus (one group open)', oneOpen: true }, light: { label: 'Light' } };
// The structure's dye and mode as the panel has them, for the data layers (dataModeOv in the main script).
const DYE_UI = { mtMode, dye: () => choiceDye(mtChoice()), lightPresetValues,
  dyeName: () => USER_DYES.isUser(mtChoice()) ? USER_DYES.name(USER_DYES.slot(mtChoice())) : choiceDye(mtChoice()).name };
return { UI_GROUPS, UI_STYLES, USER_DYES, cameraModeGain, DYE_UI };
})();
</script>
<script id="uiPanel">
'use strict';
(function () {
const $ = id => document.getElementById(id);

// ---- persistence (per viewer; may be unavailable) ----
const store = {
  get(k, d) { try { const v = localStorage.getItem('isc.ui.' + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('isc.ui.' + k, v); } catch (e) { /* private window etc. */ } },
};

// ---- rendering ----
function h(tag, attrs, html) {
  const e = document.createElement(tag);
  for (const k in attrs || {}) if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) e.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
  if (html !== undefined) e.innerHTML = html;
  return e;
}
const entries = [];   // every rendered entry, kids included: { ...entry, row, group, parent }
const groups = [];    // { g, det, sect }

function labelCell(e, forId) {
  const lab = h('div', { class: 'lab' });
  lab.append(h('label', forId ? { for: forId } : {}, e.label));
  if (e.tip) lab.append(h('span', { class: 'info', tabindex: 0, role: 'note', 'aria-label': e.label + ' info', 'data-tip': e.tip }, 'i'));
  return lab;
}
function inputAttrs(e, id, value) {
  return { type: e.kind === 'range' ? 'range' : 'number', id, min: e.min, max: e.max, step: e.step, value: value };
}
function renderEntry(e, host, g, parent) {
  const r = { ...e, group: g, parent };
  let row;
  if (e.kind === 'html') {
    row = h('div', {}, e.html);
  } else if (e.kind === 'head') {
    row = h('div', { class: 'subhead' });
    row.append(h('span', {}, e.label));
    if (e.tip) row.append(h('span', { class: 'info', tabindex: 0, role: 'note', 'aria-label': e.label + ' info', 'data-tip': e.tip }, 'i'));
  } else if (e.kind === 'buttons') {
    row = h('div', { class: 'opt btnrow' });
    for (const [id, label, tip] of e.buttons) row.append(h('button', { id, title: tip }, label));
  } else if (e.kind === 'grid') {
    // checkboxes in two columns after the label; the kids are ordinary entries (ids, defaults, show) drawn in it
    row = h('div', { class: 'opt gridrow' });
    const cells = h('div', { class: 'cells' });
    row.append(h('div', { class: 'lab' }, '<label>' + e.label + '</label>'), cells);
    r.row = row; host.append(row); entries.push(r);
    r.kidEntries = e.kids.map(k => renderEntry(k, cells, g, r));
    return r;
  } else if (e.kind === 'radio') {
    // a column of radio buttons; the column element has the entry's id and a value property (the checked option)
    row = h('div', { class: 'opt radio' });
    const col = h('div', { class: 'radios', id: e.id, role: 'radiogroup' });
    for (const [v, t, tip] of e.options) {
      const l = h('label', tip ? { title: tip.replace(/<[^>]+>/g, '') } : {});
      l.append(h('input', { type: 'radio', name: e.id, value: v, checked: v === e.value }), document.createTextNode(' ' + t));
      col.append(l);
    }
    Object.defineProperty(col, 'value', {
      get: () => { const c = col.querySelector('input:checked'); return c ? c.value : e.value; },
      set: v => { for (const i of col.querySelectorAll('input')) i.checked = i.value === String(v); },
    });
    row.append(labelCell(e), col);
  } else if (e.kind === 'button') {
    row = h('div', { class: 'opt wide' });
    row.append(h('button', { id: e.id, title: e.tip }, e.label));
  } else if (e.kind === 'text') {
    row = h('div', { class: 'opt text' });
    const ctl = h('div', { class: 'ctl' });
    ctl.append(h('input', { type: 'text', id: e.id, value: e.value, maxlength: 40 }));
    row.append(labelCell(e, e.id), ctl, h('div', { class: 'val' }));
  } else {
    row = h('div', { class: 'opt ' + e.kind });
    const ctl = h('div', { class: 'ctl' }), val = h('div', { class: 'val' });
    if (e.kind === 'range') {
      ctl.append(h('input', inputAttrs(e, e.id, e.value)));
      val.append(h('b', { id: e.valId || e.id + 'Val' }), document.createTextNode(e.unit ? ' ' : ''), h('span', { class: 'u' }, e.unit));
    } else if (e.kind === 'number') {
      ctl.append(h('input', inputAttrs(e, e.id, e.value)));
      val.append(h('span', { class: 'u' }, e.unit));
    } else if (e.kind === 'check') {
      ctl.append(h('input', { type: 'checkbox', id: e.id, checked: !!e.value }));
    } else if (e.kind === 'select' || e.kind === 'preset') {
      const s = h('select', { id: e.id });
      const opts = e.kind === 'preset' ? Object.keys(e.presets).map(n => [n, n]).concat([['custom', 'Custom']]) : e.options;
      for (const [v, t] of opts) s.append(h('option', { value: v, selected: v === e.value, disabled: v === 'custom' }, t));
      ctl.append(s);
    } else if (e.kind === 'pair') {
      const bounds = e.bounded ? { min: e.lo, max: e.hi } : {};   // bounded: the boxes are limited to the slider range too
      const bMin = h('input', { type: 'number', id: e.id + 'Min', step: e.step, value: e.vMin, ...bounds });
      const bMax = h('input', { type: 'number', id: e.id + 'Max', step: e.step, value: e.vMax, ...bounds });
      const dual = h('div', { class: 'dual' });
      const lo = h('input', { type: 'range', min: e.lo, max: e.hi, step: e.step, 'aria-label': e.label + ' min' });
      const hi = h('input', { type: 'range', min: e.lo, max: e.hi, step: e.step, 'aria-label': e.label + ' max' });
      const fill = h('div', { class: 'fill' });
      dual.append(h('div', { class: 'track' }), fill, lo, hi);
      ctl.append(bMin, dual, bMax, h('span', { class: 'u' }, e.unit));   // spans the value column too (CSS)
      const span = e.hi - e.lo;
      const syncDual = () => {
        lo.value = +bMin.value; hi.value = +bMax.value;   // clamped to [lo, hi] by the input itself
        const a = (+lo.value - e.lo) / span, b = (+hi.value - e.lo) / span;
        fill.style.left = (100 * Math.min(a, b)) + '%'; fill.style.width = (100 * Math.abs(b - a)) + '%';
      };
      const fromSlider = (src, box, other, isLo) => () => {
        let v = +src.value;
        if (isLo ? v > +other.value : v < +other.value) { v = +other.value; src.value = v; }
        box.value = v;
        box.dispatchEvent(new Event('input', { bubbles: true }));
      };
      lo.addEventListener('input', fromSlider(lo, bMin, hi, true));
      hi.addEventListener('input', fromSlider(hi, bMax, lo, false));
      bMin.addEventListener('input', syncDual); bMax.addEventListener('input', syncDual);
      r.syncDual = syncDual;
    }
    row.prepend(labelCell(e, e.kind === 'pair' ? e.id + 'Min' : e.id));
    row.append(ctl, val);
    if (e.side) {   // a small checkbox at the line's right end (e.g. Tilt | x-z)
      const l = h('label', { class: 'side', title: e.side.tip });
      l.append(h('input', { type: 'checkbox', id: e.side.id, checked: !!e.side.value }), document.createTextNode(e.side.label));
      row.classList.add('hasSide');
      row.append(l);
    }
  }
  if (e.adv || (g && g.adv)) row.classList.add('adv');
  if (e.cls) row.classList.add(e.cls);
  r.row = row;
  host.append(row);
  entries.push(r);
  if (e.kids) {
    const kids = h('div', { class: 'kids' });
    r.kidsEl = kids;
    host.append(kids);
    r.kidEntries = e.kids.map(k => renderEntry(k, kids, g, r));
  }
  return r;
}

const panel = $('panel');
const oneOpen = () => !!(UI_STYLES[document.body.dataset.uiStyle] || {}).oneOpen;
// Open groups: one remembered group in a oneOpen style, each group's own remembered state otherwise.
function applyOpen() {
  if (oneOpen()) {
    const want = store.get('focusOpen', (groups.find(G => G.det.open) || groups[0]).g.id);
    for (const G of groups) G.det.open = G.g.id === want;
  } else for (const G of groups) G.det.open = store.get('open.' + G.g.id, G.g.open ? '1' : '0') === '1';
}
let curSect = null;
for (const g of UI_GROUPS) {
  if (g.sect !== undefined) { curSect = { el: h('div', { class: 'sect' }, g.sect), groups: [] }; panel.append(curSect.el); }
  const det = h('details', { class: 'grp', 'data-group': g.id });
  det.append(h('summary', {}, g.title));
  const body = h('div', { class: 'body' });
  det.append(body);
  det.addEventListener('toggle', () => {
    if (!oneOpen()) store.set('open.' + g.id, det.open ? '1' : '0');
    else if (det.open) { store.set('focusOpen', g.id); for (const o of groups) if (o.det !== det) o.det.open = false; }
  });
  panel.append(det);
  const G = { g, det, sect: curSect, entries: g.items.map(e => renderEntry(e, body, g, null)) };
  groups.push(G); curSect.groups.push(G);
}

// ---- values, presets, visibility ----
const byId = {};
for (const r of entries) if (r.id) byId[r.id] = r;
function setValue(id, v) {
  const el = $(id);
  if (el.type === 'checkbox') el.checked = !!v; else el.value = v;
  el.dispatchEvent(new Event('input', { bubbles: true }));
}
function presetMatch(r) {
  for (const name in r.presets) {
    const vals = r.presets[name];
    if (Object.keys(vals).every(id => Math.abs(+$(id).value - vals[id]) < 1e-9)) return name;
  }
  return 'custom';
}
const isShown = r => (!r.show || r.show()) && (!r.parent || isShown(r.parent));
const isDefault = r => r.kind === 'pair'
  ? +$(r.id + 'Min').value === r.vMin && +$(r.id + 'Max').value === r.vMax
  : r.kind === 'check' ? $(r.id).checked === !!r.value
  : r.kind === 'select' || r.kind === 'radio' ? $(r.id).value === r.value
  : +$(r.id).value === +r.value;
function sync() {
  const level = document.body.dataset.level;
  for (const r of entries) {
    if (r.kind === 'range' && r.row) {
      const b = $(r.valId || r.id + 'Val'), v = $(r.id).value;
      const t = r.fmt ? r.fmt(v) : String(v);
      b.textContent = t;
      const u = r.row.querySelector('.u');
      if (u) u.style.display = isNaN(parseFloat(t)) ? 'none' : '';
    }
    if (r.kind === 'pair' && r.syncDual) r.syncDual();
    if (r.kind === 'preset') $(r.id).value = presetMatch(r);
    if (r.row && (r.kind !== 'html' || r.show)) r.row.style.display = isShown(r) ? '' : 'none';
    if (r.kidsEl) r.kidsEl.style.display = isShown(r) ? '' : 'none';
  }
  for (const G of groups) {
    const any = G.g.items.length && entries.some(r => r.group === G.g &&
      (r.kind === 'html' || isShown(r) && (level === 'advanced' || !(r.adv || G.g.adv))));
    G.det.style.display = any && (!G.g.show || G.g.show()) && (level === 'advanced' || !G.g.adv) ? '' : 'none';
  }
  for (const S of new Set(groups.map(G => G.sect))) S.el.style.display = S.el.textContent && S.groups.some(G => G.det.style.display !== 'none') ? '' : 'none';
  const nDiff = entries.filter(r => (r.adv || (r.group && r.group.adv)) && r.id && r.kind !== 'button' && r.kind !== 'preset' && !isDefault(r)).length;
  const note = $('advNote');
  if (note) note.textContent = level === 'default' && nDiff ? `${nDiff} hidden advanced option${nDiff > 1 ? 's differ' : ' differs'} from the default.` : '';
}
for (const r of entries) {
  if (r.kind === 'button' && r.onClick) $(r.id).addEventListener('click', () => { r.onClick(); sync(); });
  if (r.onInput) $(r.id).addEventListener('input', r.onInput);
  if (!r.id || r.kind === 'button' || r.kind === 'html') continue;
  const ids = r.kind === 'pair' ? [r.id + 'Min', r.id + 'Max'] : [r.id];
  for (const id of ids) {
    const el = $(id);
    if (r.kind === 'preset') el.addEventListener('change', () => {
      const vals = r.presets[el.value];
      if (vals) for (const k in vals) setValue(k, vals[k]);
    });
    if (r.apply) el.addEventListener('input', () => { const vals = r.apply(el.value); for (const k in vals) if (+$(k).value !== vals[k]) setValue(k, vals[k]); });
    // A preset select fires input before change: syncing on that input would match its unchanged kids and put the
    // old preset back before change applies the new one, so a preset syncs only after applying (on change).
    if (r.kind !== 'preset') el.addEventListener('input', sync);
    el.addEventListener('change', sync);
  }
}
for (const r of entries) if (r.init) r.init();

// ---- hamburger menu: level, style, expand/collapse ----
const menu = $('menu'), menuBtn = $('menuBtn');
menu.innerHTML = '<h4>Options</h4>' +
  '<label><input type="radio" name="uiLevel" value="default"> Default</label>' +
  '<label><input type="radio" name="uiLevel" value="advanced"> Advanced</label>' +
  '<h4>Style</h4>' + Object.keys(UI_STYLES).map(k => `<label><input type="radio" name="uiStyle" value="${k}"> ${UI_STYLES[k].label}</label>`).join('') +
  '<h4>Panes</h4><label title="The Settings / Animation tabs: the animation editor (work in progress)"><input type="checkbox" id="showAnimPane"> Show animation pane (WIP)</label>' +
  '<div class="btns"><button data-act="expand">Expand all</button><button data-act="collapse">Collapse all</button></div>' +
  '<div class="note" id="advNote"></div>';
function setLevel(v) { document.body.dataset.level = v; store.set('level', v); menu.querySelector(`[name=uiLevel][value=${v}]`).checked = true; sync(); }
function setStyle(v) { if (!UI_STYLES[v]) v = 'focus'; document.body.dataset.uiStyle = v; store.set('style', v); menu.querySelector(`[name=uiStyle][value=${v}]`).checked = true; applyOpen(); window.dispatchEvent(new Event('resize')); }
menu.addEventListener('change', ev => {
  if (ev.target.name === 'uiLevel') setLevel(ev.target.value);
  if (ev.target.name === 'uiStyle') setStyle(ev.target.value);
});
menu.addEventListener('click', ev => {
  const act = ev.target.dataset && ev.target.dataset.act;
  if (act) for (const G of groups) G.det.open = act === 'expand';
});
const openMenu = open => { menu.classList.toggle('open', open); menuBtn.setAttribute('aria-expanded', open); };
menuBtn.addEventListener('click', ev => { ev.stopPropagation(); openMenu(!menu.classList.contains('open')); });
document.addEventListener('click', ev => { if (!menu.contains(ev.target)) openMenu(false); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') openMenu(false); });

// ---- mouse wheel on any slider: one step per notch (up = more). Over a two-knob slider it moves the knob
// nearest the pointer (equal knobs: the max one up, the min one down). ----
document.addEventListener('wheel', ev => {
  let el = ev.target;
  if (!(el instanceof Element)) return;
  const dir = ev.deltaY < 0 || (ev.deltaY === 0 && ev.deltaX > 0) ? 1 : -1;
  const dual = el.closest('.dual');
  if (dual) {
    const [lo, hi] = dual.querySelectorAll('input');
    const r = dual.getBoundingClientRect(), f = (ev.clientX - r.left) / r.width;
    const pos = i => (+i.value - +i.min) / (+i.max - +i.min);
    el = lo.value === hi.value ? (dir > 0 ? hi : lo) : Math.abs(f - pos(lo)) <= Math.abs(f - pos(hi)) ? lo : hi;
  }
  if (el.tagName !== 'INPUT' || el.type !== 'range' || el.disabled) return;
  ev.preventDefault();
  const before = el.value, step = +el.step || 1;
  el.value = +(+el.value + dir * step).toPrecision(12);   // the input clamps and snaps to its step
  if (el.value !== before) el.dispatchEvent(new Event('input', { bubbles: true }));
}, { passive: false });

// ---- (i) tooltips: one floating box, on hover and keyboard focus ----
const tip = h('div', { id: 'tip', role: 'tooltip' });
document.body.append(tip);
function showTip(t) {
  tip.innerHTML = t.dataset.tip; tip.style.display = 'block';
  const a = t.getBoundingClientRect(), b = tip.getBoundingClientRect();
  let x = a.left - 8, y = a.bottom + 6;
  if (x + b.width > innerWidth - 8) x = innerWidth - 8 - b.width;
  if (y + b.height > innerHeight - 8) y = a.top - 6 - b.height;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
const hideTip = () => { tip.style.display = 'none'; };

// Reads the mesh's interleaved vertex array (x, y, h at 3*(k*n + i)); returns a flat
// array of x1, y1, x2, y2, level per segment.

      const i2 = (i + 1) % n;
      // the quad's corners p00, p10, p11, p01; edges (c, c+1 mod 4) in that order
      corner[0] = 3 * (k * n + i); corner[1] = 3 * (k * n + i2);
      corner[2] = 3 * ((k + 1) * n + i2); corner[3] = 3 * ((k + 1) * n + i);

  let start;

      const opts = d.module ? { instantiateWasm(info, done) { WebAssembly.instantiate(d.module, info).then(inst => done(inst, d.module)); return {}; } } : {};

document.getElementById('psfPreview').addEventListener('click', previewPsf);

// ---- light path: spectra plot and detection readout (issue 16) ----
// From the JS reference's own physics (prototype/scope: scopeLightPath, scopeLabels = what a movie uses): the dye's
// excitation and emission (and its pre state), the laser lines, the dichroic's and the emission filter's transmission
// and the camera QE; below, the detected fraction, effective wavelength and photons per second while ON.
let specMods = null, specTimer = 0;
function scheduleSpecPlot() { clearTimeout(specTimer); specTimer = setTimeout(drawSpecPlot, 120); }
async function drawSpecPlot() {
  const cv2 = document.getElementById('specPlot'), out = document.getElementById('specReadout');
  if (!cv2 || !cv2.offsetParent) return;
  try {
    specMods = specMods || Promise.all([import('./prototype/scope/scope_movie.js'), import('./prototype/scope/dye_library.js')]);
    const [SM, DL] = await specMods;
    const spec = SM.parseSpec(movieSpec()), camera = SM.scopeCamera(spec), lp = SM.scopeLightPath(spec, camera);
    const L = SM.scopeLabels(spec, lp)[0];
    const g = cv2.getContext('2d'), W = cv2.width, H = cv2.height, x0 = 350, x1 = 800, top = 8, bot = H - 16;
    const X = nm => (nm - x0) / (x1 - x0) * W, Y = v => bot - v * (bot - top);
    const light = document.body.dataset.uiStyle === 'light';
    g.clearRect(0, 0, W, H);
    g.font = '10px sans-serif'; g.fillStyle = light ? '#555' : '#aaa';
    for (let nm = 400; nm <= 800; nm += 100) { g.fillText(String(nm), X(nm) - 9, H - 3); g.fillRect(X(nm), bot, 1, 3); }
    const curve = (vals, style, dash, fill) => {
      g.beginPath();
      for (let nm = x0; nm <= x1; nm++) { const v = vals[nm - 300] || 0; if (nm === x0) g.moveTo(X(nm), Y(v)); else g.lineTo(X(nm), Y(v)); }
      if (fill) { g.lineTo(X(x1), Y(0)); g.lineTo(X(x0), Y(0)); g.closePath(); g.fillStyle = fill; g.fill(); return; }
      g.setLineDash(dash || []); g.strokeStyle = style; g.lineWidth = 1.2; g.stroke(); g.setLineDash([]);
    };
    curve(lp.emissionFilter.T, null, null, light ? 'rgba(0,120,255,0.12)' : 'rgba(120,180,255,0.16)');
    curve(lp.dichroic.T, light ? '#888' : '#999', [2, 2]);
    curve(lp.qe, light ? '#bbb' : '#666', [1, 3]);
    const col = (L.dye.states.main.emHex || '#ff4d4d');
    for (const [role, dash] of [['main', null], ['pre', [5, 3]]]) {
      const st = L.dye.states[role];
      if (!st || st.isDark || (role === 'pre' && L.mode !== 'PALM')) continue;
      const sp = DL.stateSpectra(st), c = role === 'main' ? col : (st.emHex || '#4f4');
      if (sp.ex) curve(sp.ex, c, [3, 3]);
      if (sp.em) curve(sp.em, c, dash);
    }
    for (const l of lp.lasers) {
      const hue = Math.max(0, Math.min(270, 270 - (l.nm - 400) * 270 / 300));
      g.fillStyle = l.nm >= 700 ? '#a33' : `hsl(${hue},90%,55%)`; g.fillRect(X(l.nm) - 1, top, 2, bot - top);
    }
    const fmt = st => st ? `${(100 * st.detectedFraction).toFixed(1)} % detected at ${st.lambdaNm.toFixed(0)} nm, ${Math.round(st.detectedPerSec).toLocaleString()} ph/s` : 'dark';
    const mtv = +document.getElementById('mv_mt-dye').value;
    const dyeName = USER_DYES.isUser(mtv) ? USER_DYES.name(USER_DYES.slot(mtv)) : L.dye.name;
    const parts = [`<b>${dyeName}</b>, ${L.mode}: ${fmt(L.states.main)}${L.mode === 'WideField' ? '' : ' while ON'}`];
    if (L.states.pre) parts.push(`pre state: ${fmt(L.states.pre)}`);
    if (L.mode === 'dSTORM') parts.push(`ON ${(1000 * L.onSecNow).toPrecision(3)} ms, initial ON ${L.label.kinetics.initialOnSec.toPrecision(3)} s (excitation x${L.excitationScale.toPrecision(3)} of Dempsey 2011's)`);
    if (L.kActPerSec > 0) parts.push(`activation ${L.kActPerSec.toPrecision(3)} /s per dye`);
    const bg = L.imagerBackgroundPerPxPerSec(+document.getElementById('mv_pixel-nm').value / 1000);
    if (bg > 0) parts.push(`free imager: ${bg.toFixed(0)} ph/px/s`);
    if (L.dye.modes[L.mode] && L.dye.modes[L.mode].generic) parts.push('<i>generic values: no data for this dye in this mode</i>');
    out.innerHTML = parts.join('<br>') + '<br><span style="opacity:.7">ex dashed, em solid, pre state long-dashed; dichroic dotted, filter shaded, QE dotted grey</span>';
  } catch (e) {
    specMods = null;   // try the import again next time
    // Browsers do not load ES modules from file:// pages: the plot (the JS reference's physics) needs the page over http.
    if (location.protocol === 'file:') out.innerHTML = 'The spectra plot needs the viewer served over http (e.g. <code>node web/lab/serve.mjs</code>, then http://localhost:8123/web/), not opened as a file. Movies are not affected.';
    else out.textContent = 'light path: ' + (e && e.message || e);
  }
}
document.getElementById('panel').addEventListener('input', scheduleSpecPlot);
document.getElementById('panel').addEventListener('change', scheduleSpecPlot);
document.getElementById('panel').addEventListener('toggle', scheduleSpecPlot, true);
// the planned movie square follows the Acquisition group's state and the camera size / pixel size
document.getElementById('panel').addEventListener('toggle', e => { if (e.target.dataset && e.target.dataset.group === 'acq') requestDraw(); }, true);
for (const id of ['mv_size', 'mv_pixel-nm', 'mv_modality']) document.getElementById(id).addEventListener('input', requestDraw);
scheduleSpecPlot();

});

// The movie player: starts in the bottom-right corner of the canvas area (over the x-z view); its title bar drags it
// anywhere in the canvas area (kept inside it on a resize).
const moviePanel = document.getElementById('movie');
function clampMoviePanel() {
  if (moviePanel.style.left === '' || moviePanel.style.display === 'none') return;
  const hr = host.getBoundingClientRect();
  moviePanel.style.left = Math.max(0, Math.min(hr.width - moviePanel.offsetWidth, parseFloat(moviePanel.style.left))) + 'px';
  moviePanel.style.top = Math.max(0, Math.min(hr.height - moviePanel.offsetHeight, parseFloat(moviePanel.style.top))) + 'px';
}
moviePanel.querySelector('.t.drag').addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.target.closest('a,button,input')) return;
  e.preventDefault();
  const hr = host.getBoundingClientRect(), pr = moviePanel.getBoundingClientRect(), dx = e.clientX - pr.left, dy = e.clientY - pr.top;
  moviePanel.style.right = moviePanel.style.bottom = 'auto';
  const move = ev => { moviePanel.style.left = (ev.clientX - hr.left - dx) + 'px'; moviePanel.style.top = (ev.clientY - hr.top - dy) + 'px'; clampMoviePanel(); };
  move(e);
  const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); };
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
});
window.addEventListener('resize', () => { resizeCanvas(); clampMoviePanel(); });
els.showXZ.addEventListener('input', resizeCanvas);
// While an image slice is shown, the slice height (View) and the focus height (Acquisition) move together; turning a
// slice on takes the focus to the slice.
let zCoupling = false;
function coupleZ(from, to) {
  if (zCoupling || els.dataSlice.value === 'none' || +to.value === +from.value) return;
  zCoupling = true;
  try { to.value = from.value; to.dispatchEvent(new Event('input', { bubbles: true })); } finally { zCoupling = false; }
}
const mvZ = document.getElementById('mv_z');
els.sliceZ.addEventListener('input', () => coupleZ(els.sliceZ, mvZ));
mvZ.addEventListener('input', () => coupleZ(mvZ, els.sliceZ));
let lastSlice = els.dataSlice.value;
els.dataSlice.addEventListener('input', () => { if (lastSlice === 'none') coupleZ(els.sliceZ, mvZ); lastSlice = els.dataSlice.value; });
syncLabels();
if (/[?&]nw/.test(location.search)) startMainEngine(); // ?nw runs the core on the main thread (for testing)
else initGenWorkers();
setLayerMode(!/[?&]2d/.test(location.search) && initGl()); // ?2d forces the 2D fallback (for testing)
resizeCanvas();
</script>
